  # ---------------------------------------------------------------------------
  # Audit
  # ---------------------------------------------------------------------------
  /api/v1/admin/audit:
    get:
      tags: [Audit]
      summary: Query the audit log
      description: |
        Phase 0/3. Requires `audit:view`. `before`/`after` snapshots are redacted at
        write time: a secret never appears here.
      operationId: listAuditEntries
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: organizationId
          in: query
          schema: { type: string, format: uuid }
        - name: actorUserId
          in: query
          schema: { type: string, format: uuid }
        - name: entityType
          in: query
          schema: { type: string, maxLength: 100 }
        - name: entityId
          in: query
          schema: { type: string, maxLength: 128 }
        - name: action
          in: query
          schema: { type: string, maxLength: 100 }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/audit/{entryId}:
    parameters:
      - $ref: "#/components/parameters/AuditEntryId"
    get:
      tags: [Audit]
      summary: Read one audit entry
      description: Phase 0/3. Requires `audit:view`.
      operationId: getAuditEntry
      responses:
        "200":
          description: Audit entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditLogEntry" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Unknown audit entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ---------------------------------------------------------------------------
  # Health
  # ---------------------------------------------------------------------------
  /health/live:
    get:
      tags: [Health]
      summary: Liveness probe
      description: Anonymous. Never checks a dependency; a live process with a dead database is still live.
      operationId: getLiveness
      security: []
      responses:
        "200":
          description: The process is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [Healthy] }

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe
      description: |
        Anonymous. Checks PostgreSQL, Redis, the agent service, and the Clerk JWKS.
        Returns `503` when any critical check is `Unhealthy`. `Degraded` still
        returns `200`. The payload never contains credentials, hostnames, or stack traces.
      operationId: getReadiness
      security: []
      responses:
        "200":
          description: Ready, or ready with a degraded non-critical dependency
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthReport" }
        "503":
          description: Not ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthReport" }

  /health:
    get:
      tags: [Health]
      summary: Readiness probe (alias)
      description: |
        Anonymous. `/health` and `/health/ready` are both mapped with the same
        `HealthCheckOptions` and `HealthCheckResponseWriter`, so they return the
        identical JSON `HealthReport` — `/health` is a true alias, not a
        `text/plain` status string. It checks PostgreSQL, the agent service and the
        Clerk JWKS (plus Redis when a Redis connection string is configured), and
        returns `503` when a critical check is `Unhealthy`; `Degraded` still returns
        `200`. The `version` block is omitted in Production (finding M-3).
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Ready, or ready with a degraded non-critical dependency
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthReport" }
        "503":
          description: Not ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthReport" }

  /metrics:
    get:
      tags: [Health]
      summary: Prometheus metrics
      description: |
        Phase 0. Authenticated: `X-Internal-Token`, or `Authorization: Bearer
        <Metrics:ScrapeToken>` when configured. Metric names use the `aveline.` prefix.
      operationId: getMetrics
      security:
        - internalToken: []
        - bearerAuth: []
      responses:
        "200":
          description: Prometheus exposition format
          content:
            text/plain:
              schema: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Clerk JWT from the `jwt-aveline-v1` template. Validated against the Clerk
        JWKS (signature, `iss`, `exp`, `nbf`). `aud` is deliberately not validated.
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: |
        Service-to-service shared secret. Required on `/internal/**` and `/metrics`.
        Not for frontend clients.
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: |
        Customer API key, formatted `avl_live_<32 base62 characters>` or
        `avl_test_<...>`. Phase 3. Available on the Rose plan and above.

  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: |
        The organization id. Its presence in the path is mandatory for
        organization-scoped authorization: the handler reads only this route value.
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AdminRequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    NotificationId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ApiKeyId:
      name: keyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PricingRuleId:
      name: ruleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PricingEntryId:
      name: entryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AuditEntryId:
      name: entryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    From:
      name: from
      in: query
      required: true
      schema: { type: string, format: date-time }
      description: ISO 8601 UTC, inclusive
    To:
      name: to
      in: query
      required: true
      schema: { type: string, format: date-time }
      description: ISO 8601 UTC, exclusive
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9._:-]+$" }
      description: |
        Required on money-shaped POSTs. A replay with the same key and body returns
        the original response with `Idempotency-Replayed: true`; a replay with a
        different body returns `409` with `code: idempotency-key-reuse`. Concurrent
        requests with the same key are serialised by a short lease, so exactly one
        executes; `409` with `code: idempotency-key-in-flight` means the original was
        still running when the wait budget expired.

  responses:
    Unauthorized:
      description: |
        401. The body is **empty** for JWT failures. Send the client through
        re-authentication.
      content:
        application/json:
          schema:
            description: Usually empty
            nullable: true
    Forbidden:
      description: |
        403. The body is **empty** for policy failures. For the account-state gate
        the body is a `ProblemDetails`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Not found, or the caller is not a member of the target organization
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ValidationError:
      description: One or more request fields failed validation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationProblemDetails" }
    RateLimited:
      description: Rate limit or quota exceeded
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - $ref: "#/components/schemas/QuotaExceededError"

  schemas:

    # --- primitives and enums ------------------------------------------------
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }
        code:
          type: string
          description: Machine-readable code. Present on Part C endpoints.
          example: insufficient-balance
        requestId:
          type: string
          description: Correlation id. Phase 0 onwards.
    ValidationProblemDetails:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
    QuotaExceededError:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          properties:
            quota:
              type: object
              properties:
                metricKey: { type: string }
                limit: { type: integer }
                used: { type: integer }
                resetsAt: { type: string, format: date-time }
    InsufficientBalanceError:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          properties:
            code: { type: string, enum: [insufficient-balance] }
            available: { type: number }
            requested: { type: number }
    PlanLimitViolationError:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          properties:
            code: { type: string, enum: [plan-limit-violation] }
            violations:
              type: array
              items:
                type: object
                properties:
                  key: { type: string }
                  observed: { type: number }
                  allowed: { type: number }

    PlanTier:
      type: string
      enum: [Seed, Bloom, Orchid, Rose, Enterprise]
    AccountState:
      type: string
      enum: [OnboardingPending, Active, Suspended]
    ContactPreferences:
      type: string
      enum: [Email, Phone, SMS, WhatsApp, None]
    DevicePlatform:
      type: string
      enum: [Ios, Android, Web]
    MembershipStatus:
      type: string
      enum: [Pending, Active, Suspended]
    BoutiqueRole:
      type: string
      enum: [org:boutique_owner, org:boutique_supervisor, org:boutique_manager, org:boutique_staff]
    IntegrationType:
      type: string
      description: |
        The integration types the API accepts. Required credential fields per type are
        defined in `Modules/Integrations/Services/IntegrationService.cs:15-24`.
      enum: [WhatsApp, Instagram, PaymentGateway]
    AgentKey:
      type: string
      description: |
        The registered agent keys. `commerce` currently has no graph — its work is
        attributed to `orchestrator` until the Commerce agent is implemented.
      enum: [orchestrator, customer_memory, visual_insight, commerce]
    AgentTriggerKind:
      type: string
      enum: [WhatsAppInbound, WhatsAppOutbound, ApiRequest, Scheduled, Manual, Webhook]
    AgentRunStatus:
      type: string
      enum: [Running, Succeeded, Failed, Cancelled, TimedOut, PausedForApproval]
    AgentStepKind:
      type: string
      enum: [LlmCall, ToolCall, Decision, HumanInterrupt, Retrieval, Validation]
    AgentStepStatus:
      type: string
      enum: [Succeeded, Failed, Skipped, TimedOut]
    PricingScopeKind:
      type: string
      enum: [Global, Provider, ProviderModel]
    PricingRuleStatus:
      type: string
      enum: [Draft, Active, Superseded, Cancelled]
    RoundingMode:
      type: string
      enum: [Ceiling, HalfUp, Down, Up]
    BlossomLedgerEntryType:
      type: string
      enum: [PeriodAllocation, TopUpGrant, AdminCredit, AdminDebit, TopUpRevocation, Expiry, PlanUpgradeProration, PlanDowngradeAdjustment, CorrectionRecompute]
    ApiKeyStatus:
      type: string
      enum: [Active, Revoked, Expired]
    AlertSeverity:
      type: string
      enum: [Info, Warning, Critical]
    AlertStatus:
      type: string
      enum: [Firing, Acknowledged, Resolved]

    PageMeta:
      type: object
      required: [total, page, pageSize]
      properties:
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 200 }

    TimeWindow:
      type: object
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        timezone: { type: string, default: UTC }

    DataQuality:
      type: object
      description: |
        Instrumentation status for the metric in this response. A client MUST NOT
        render a metric as a real zero when its flag here is `false`.
      properties:
        costIsEstimated: { type: boolean }
        latencyInstrumented: { type: boolean }
        nodeFailuresObserved: { type: boolean }
        perStepAttribution: { type: boolean }
        toolInstrumented: { type: boolean }
        retryInstrumented: { type: boolean }
        materialisedCounts: { type: boolean }
        streamingRunsIncluded: { type: boolean }
        unattributedRunsExcluded: { type: boolean }

    BlossomAmount:
      type: number
      description: Blossom quantity. Maximum 4 decimal places.
      minimum: 0.0001

    AdjustmentReason:
      type: string
      minLength: 10
      maxLength: 500

    # --- auth / users --------------------------------------------------------
    AuthClaimsResponse:
      type: object
      properties:
        userId: { type: string }
        email: { type: string, nullable: true }
        userRole: { type: string }
        organizationRole: { type: string }
        organizationId: { type: string, nullable: true }
        accountState: { $ref: "#/components/schemas/AccountState" }
        claims:
          type: object
          additionalProperties: { type: string }
    UserDto:
      type: object
      required: [id, clerkId, email, firstName, lastName, username, userRole, organizationRole, accountState, isActive]
      properties:
        id: { type: string, format: uuid }
        clerkId: { type: string }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        displayName: { type: string, nullable: true }
        username: { type: string }
        phoneNumber: { type: string }
        address: { type: string, nullable: true }
        profileImageUrl: { type: string, nullable: true }
        userRole: { type: string }
        organizationRole: { type: string }
        organizationId: { type: string }
        hasCompletedOnboarding: { type: boolean }
        accountState: { $ref: "#/components/schemas/AccountState" }
        contactPreference: { $ref: "#/components/schemas/ContactPreferences" }
        pushNotificationsEnabled: { type: boolean }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UpdateProfileRequest:
      type: object
      properties:
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        displayName: { type: string, maxLength: 200, nullable: true }
        phoneNumber: { type: string, maxLength: 20 }
        profileImageUrl: { type: string, maxLength: 1000, nullable: true }
        contactPreference: { $ref: "#/components/schemas/ContactPreferences" }
        pushNotificationsEnabled: { type: boolean }
    SessionSummary:
      type: object
      properties:
        id: { type: string }
        ipAddressHash: { type: string, nullable: true }
        userAgent: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        lastActiveAt: { type: string, format: date-time, nullable: true }
        isCurrent: { type: boolean }
    AdminApprovalRequestSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        clerkUserId: { type: string }
        email: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        status: { type: string, enum: [Pending, Approved, Rejected] }
        requestedAt: { type: string, format: date-time }
        reviewedAt: { type: string, format: date-time, nullable: true }
        reviewedByClerkUserId: { type: string, nullable: true }
    AdminUserPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/UserDto"
                  - type: object
                    properties:
                      organizationName: { type: string, nullable: true }

    AdminOrganization:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        clerkOrgId: { type: string, nullable: true }
        ownerUserId: { type: string, format: uuid }
        planTier: { $ref: "#/components/schemas/PlanTier" }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminOrganizationPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/AdminOrganization" }

    # --- organizations -------------------------------------------------------
    OrganizationProfileDto:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        clerkOrgId: { type: string, nullable: true }
        ownerUserId: { type: string, format: uuid }
        address: { type: string, nullable: true }
        phoneNumber: { type: string, nullable: true }
        description: { type: string, nullable: true }
        logoUrl: { type: string, nullable: true }
        planTier: { $ref: "#/components/schemas/PlanTier" }
        hasCompletedOnboarding: { type: boolean }
        createdAt: { type: string, format: date-time }
    OrganizationMembershipView:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        organizationName: { type: string }
        slug: { type: string }
        boutiqueRole: { type: string }
        status: { $ref: "#/components/schemas/MembershipStatus" }
    OrganizationProfileWithMembershipDto:
      type: object
      properties:
        organization: { $ref: "#/components/schemas/OrganizationProfileDto" }
        membership: { $ref: "#/components/schemas/OrganizationMembershipView", nullable: true }
    CreateOrganizationResponse:
      type: object
      properties:
        organization:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            slug: { type: string }
            clerkOrgId: { type: string, nullable: true }
            ownerUserId: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
        accountState: { type: string, nullable: true }
