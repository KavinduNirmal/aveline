name: Aveline CI

on:
  push:
    branches: [main, master, development]
  pull_request:
    branches: [main, master, development]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Repository Hygiene (Locks, Env, Secrets)
  # ---------------------------------------------------------------------------
  hygiene:
    name: Repository Hygiene & Lockfile Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify only bun lockfile exists
        run: |
          echo "Checking for disallowed package manager lockfiles..."
          DISALLOWED=$(find . -name "package-lock.json" -o -name "yarn.lock" -o -name "pnpm-lock.yaml" -o -name "pnpm-lock.yml" -o -name "npm-shrinkwrap.json" | grep -v node_modules || true)
          if [ -n "$DISALLOWED" ]; then
            echo "::error::Disallowed lockfiles found in repository. Only bun.lock / bun.lockb is permitted:"
            echo "$DISALLOWED"
            exit 1
          fi
          echo "✓ Lockfile hygiene passed"

      - name: Verify no .env files committed
        run: |
          echo "Checking for committed .env files..."
          ENV_FILES=$(find . -name ".env" -o -name ".env.local" -o -name ".env.production" -o -name ".env.development" | grep -v "\.env\.example" || true)
          if [ -n "$ENV_FILES" ]; then
            echo "::error::Committed environment file(s) detected:"
            echo "$ENV_FILES"
            exit 1
          fi
          echo "✓ No .env files found"

  # ---------------------------------------------------------------------------
  # Job 2: Build & Test — ASP.NET Core API
  # ---------------------------------------------------------------------------
  build-api:
    name: Build & Test API
    runs-on: ubuntu-latest
    needs: hygiene

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Aveline.Api/Aveline.Api.csproj

      - name: Build API
        run: dotnet build Aveline.Api/Aveline.Api.csproj --no-restore -c Release

      - name: Test API
        run: dotnet test Aveline.Api/Aveline.Api.sln --no-build --no-restore -c Release

  # ---------------------------------------------------------------------------
  # Job 3: Lint & Verify — Python Agent Service
  # ---------------------------------------------------------------------------
  lint-python:
    name: Lint Python Agent Service
    runs-on: ubuntu-latest
    needs: hygiene

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies & linter
        run: |
          python -m pip install --upgrade pip
          pip install ruff -r agnet-service/requirements.txt

      - name: Run Ruff Lint
        run: ruff check agnet-service/app/

  # ---------------------------------------------------------------------------
  # Job 4: Analyze — Flutter Mobile App
  # ---------------------------------------------------------------------------
  analyze-flutter:
    name: Analyze Flutter App
    runs-on: ubuntu-latest
    needs: hygiene

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get
        working-directory: frontend/aveline_mobile

      - name: Analyze Flutter codebase
        run: flutter analyze --no-fatal-infos
        working-directory: frontend/aveline_mobile
