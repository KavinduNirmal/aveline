      operationId: getSystemErrors
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: groupBy
          in: query
          schema:
            type: string
            enum: [minute, hour, routeTemplate, statusCode]
            default: hour
      responses:
        "200":
          description: Error rate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorStatisticsResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/statistics/system/throughput:
    get:
      tags: [System Statistics]
      summary: Read system throughput
      description: Phase 6. Requires `stats:system`.
      operationId: getSystemThroughput
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: groupBy
          in: query
          schema:
            type: string
            enum: [minute, hour, day]
            default: hour
      responses:
        "200":
          description: Throughput series
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemThroughputResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/statistics/system/eventbus:
    get:
      tags: [System Statistics]
      summary: Read Redis event bus health
      description: |
        Phase 6. Requires `stats:system`. Returns an instantaneous snapshot of the
        cumulative `EventBusMetrics` counters — it is **not** a windowed series, and
        the handler binds no `from`/`to` filter (finding M-11). `publish_latency_ms`
        is omitted because the counters cannot measure it (BR-7.10).
      operationId: getSystemEventBus
      responses:
        "200":
          description: Event bus metrics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemEventBusResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/statistics/system/alerts:
    get:
      tags: [System Statistics]
      summary: List system alerts
      description: Phase 6. Requires `stats:system`.
      operationId: listSystemAlerts
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/AlertStatus" }
        - name: severity
          in: query
          schema: { $ref: "#/components/schemas/AlertSeverity" }
        - name: ruleId
          in: query
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Alerts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemAlertPage" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/statistics/system/alerts/{alertId}/acknowledge:
    parameters:
      - name: alertId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [System Statistics]
      summary: Acknowledge a firing alert
      description: Phase 6. Requires `stats:system`.
      operationId: acknowledgeSystemAlert
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 500, nullable: true }
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemAlert" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The alert is not in a firing state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

