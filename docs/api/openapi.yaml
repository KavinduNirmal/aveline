        agentWarmedUp: { type: boolean }

    # --- notifications -------------------------------------------------------
    UserNotificationDto:
      type: object
      properties:
        id: { type: string, format: uuid }
        notificationId: { type: string, format: uuid }
        type: { type: string }
        title: { type: string }
        body: { type: string }
        data:
          type: object
          additionalProperties: { type: string, nullable: true }
        isRead: { type: boolean }
        readAt: { type: string, format: date-time, nullable: true }
        deliveredAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        organizationId: { type: string, format: uuid }
        organizationName: { type: string, nullable: true }
    UnreadCountResponse:
      type: object
      required: [count]
      properties:
        count: { type: integer, minimum: 0 }

    MarkAllReadResponse:
      type: object
      required: [updated]
      properties:
        updated: { type: integer, minimum: 0 }

    NotificationPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/UserNotificationDto" }

    # --- conversations -------------------------------------------------------
    ConversationDto:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          description: >-
            The thread's nature and audience. `Salon` is the agent-to-staff thread;
            `Announcement` and `Digest` are reserved. Customer context is a separate axis
            carried by `customerId`, and clients classify by that context first.
        customerId: { type: string, format: uuid, nullable: true }
        customerName: { type: string, nullable: true }
        externalRef:
          type: string
          nullable: true
          description: >-
            The channel reference (e.g. a WhatsApp phone number). Present on a
            channel-created thread even when the customer is not yet identified, so the
            client renders it as an unnamed client rather than pinning it as the concierge.
        threadId: { type: string }
        status: { type: string }
        lastMessageAt: { type: string, format: date-time, nullable: true }
        lastMessagePreview:
          type: string
          nullable: true
          description: >-
            A block-aware summary of the newest message, truncated to 120 characters. Null
            when the message carries no block the inbox knows how to summarise.
        lastMessageKind:
          type: string
          nullable: true
          description: The message kind as sent (`Note` for every agent persona).
        lastMessageBlock:
          type: string
          nullable: true
          description: >-
            The content-block type the preview was derived from. This is the row's
            category, because agent output is published as `kind: Note` and the category
            lives in the blocks.
        lastMessageAuthor:
          type: string
          nullable: true
          description: One of `Staff`, `Agent`, `Customer`.
        lastMessageAgentKey: { type: string, nullable: true }
        markers:
          type: array
          description: >-
            The row's actionable states, sorted by fixed priority
            `approval` -> `choice` -> `draft`. A set rather than one value, because a
            thread can hold more than one.
          items:
            type: string
            enum: [approval, choice, draft]
    ConversationPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/ConversationDto" }
    AttachmentDto:
      type: object
      description: One stored thread attachment.
      properties:
        attachmentId: { type: string, format: uuid }
        url:
          type: string
          description: |
            Where a reader fetches the bytes. **Always the authenticated Aveline route**, whichever
            provider stores the bytes: `MessageAttachment.Url` is deliberately not rewritten to a
            Cloudinary URL, because a provider URL is not a stable value to persist (a signed URL
            is permanent, an expiring one is not, and an `authenticated` one is neither). Every
            reader uses this field rather than building a path; the provider's own key lives on
            the row, not on the wire.
        contentType: { type: string }
        fileName: { type: string }
        sizeBytes: { type: integer, format: int64 }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        messageId:
          type: string
          format: uuid
          nullable: true
          description: Null until a send binds the attachment to its message.

    # --- catalog & visual intelligence ---------------------------------------
    CatalogItem:
      type: object
      description: One catalog inventory item (`InventoryItemDto`).
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        itemName: { type: string }
        category: { type: string }
        color: { type: string }
        sizes:
          type: array
          items: { type: string }
        price: { type: number }
        cost: { type: number }
        quantity: { type: integer }
        status: { type: string, enum: [available, reserved, archived] }
        fabric: { type: string, nullable: true }
        style: { type: string, nullable: true }
        imageUrl:
          type: string
          nullable: true
          description: |
            The item's stored image reference. On the Cloudinary tier this is the **absolute CDN
            delivery URL** carrying one width, `f_auto` and `q_auto`; on the database tier it is
            the relative Aveline catalog route.
        sku: { type: string, nullable: true }
        description: { type: string, nullable: true }
        metadata:
          type: object
          additionalProperties: { type: string }
          nullable: true
        deletedAt: { type: string, format: date-time, nullable: true }
        isAvailable: { type: boolean }
        createdAtUtc: { type: string, format: date-time }
    CatalogItemCreateRequest:
      type: object
      required: [itemName, category, color, price]
      properties:
        itemName: { type: string }
        category: { type: string }
        color: { type: string }
        sizes:
          type: array
          items: { type: string }
        price: { type: number }
        cost: { type: number }
        quantity: { type: integer }
        status: { type: string, enum: [available, reserved, archived], default: available }
        fabric: { type: string, nullable: true }
        style: { type: string, nullable: true }
        imageUrl:
          type: string
          nullable: true
          description: An absolute URL, a raw base64 value, or a `data:` URL.
        sku: { type: string, nullable: true }
        description: { type: string, nullable: true }
    CatalogItemUpdateRequest:
      type: object
      properties:
        itemName: { type: string, nullable: true }
        category: { type: string, nullable: true }
        color: { type: string, nullable: true }
        sizes:
          type: array
          nullable: true
          items: { type: string }
        price: { type: number, nullable: true }
        cost: { type: number, nullable: true }
        quantity: { type: integer, nullable: true }
        status: { type: string, nullable: true, enum: [available, reserved, archived] }
        fabric: { type: string, nullable: true }
        style: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true }
        sku: { type: string, nullable: true }
        description: { type: string, nullable: true }
        metadata:
          type: object
          additionalProperties: { type: string }
          nullable: true
    CatalogItemSearchRequest:
      type: object
      description: The POST search body (`SearchInventoryDto`). `organizationId` is taken from the route.
      properties:
        category: { type: string, nullable: true }
        color: { type: string, nullable: true }
        size: { type: string, nullable: true }
        minPrice: { type: number, nullable: true }
        maxPrice: { type: number, nullable: true }
        inStockOnly: { type: boolean, default: false }
        page: { type: integer, default: 1 }
        pageSize: { type: integer, default: 50 }
    CatalogImage:
      type: object
      description: The catalog upload response, echoing the stored row.
      properties:
        id: { type: string, format: uuid }
        url:
          type: string
          description: |
            The stored image reference. The response shape is identical across providers; the
            database tier returns the relative Aveline catalog route and the Cloudinary tier
            returns the absolute CDN delivery URL carrying
            `w_{Media:CatalogDisplayWidth},f_auto,q_auto`.
        fileName: { type: string, nullable: true }
        size: { type: integer, format: int64 }
        contentType: { type: string }
    QrCodeResponse:
      type: object
      properties:
        payload: { type: string }
        format: { type: string, enum: [png, svg, json] }
        dataUrl: { type: string, nullable: true }
        base64: { type: string, nullable: true }
        svg: { type: string, nullable: true }
        size: { type: integer }
        eccLevel: { type: string, enum: [L, M, Q, H] }
        createdAtUtc: { type: string, format: date-time }
    QrScanResult:
      type: object
      properties:
        success: { type: boolean }
        found: { type: boolean }
        scanType: { type: string }
        rawPayload: { type: string }
        matchedIdentifier: { type: string, nullable: true }
        item: { $ref: "#/components/schemas/CatalogItem" }
        message: { type: string }
    CatalogCustomerMatch:
      type: object
      properties:
        customerId: { type: string, format: uuid }
        customerName: { type: string }
        customerPhone: { type: string, nullable: true }
        matchScore: { type: number }
        matchReason: { type: string }
        matchingPreferences:
          type: array
          items: { type: string }
    CatalogLookbook:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        customerId: { type: string, format: uuid, nullable: true }
        name: { type: string }
        occasion: { type: string }
        totalPrice: { type: number }
        styleNotes: { type: string, nullable: true }
        heroImageUrl: { type: string, nullable: true }
        createdAtUtc: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              inventoryItemId: { type: string, format: uuid }
              role: { type: string }
              itemName: { type: string, nullable: true }
              category: { type: string, nullable: true }
              price: { type: number }
              imageUrl: { type: string, nullable: true }
    CatalogComposedOutfit:
      type: object
      properties:
        lookName: { type: string }
        style: { type: string }
        occasion: { type: string }
        stylingNotes: { type: string }
        primaryItem: { $ref: "#/components/schemas/CatalogItem" }
        complementaryItems:
          type: array
          items: { $ref: "#/components/schemas/CatalogItem" }
        totalLookPrice: { type: number }
    CatalogSaleRequest:
      type: object
      description: The counter-sale body (`RecordCatalogSaleDto`). `organizationId` comes from the route.
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1
          description: How many pieces sold. Must not exceed the stock on hand.
        unitPrice:
          type: number
          nullable: true
          description: |
            The price one piece sold for. Omitted means the catalog price; supplied means the
            counter agreed a different one. Must be greater than zero.
        customerId:
          type: string
          format: uuid
          nullable: true
          description: The client the sale is attributed to, when the counter captured one.
        note: { type: string, nullable: true }
    CatalogSaleReceipt:
      type: object
      description: What the counter gets back (`CatalogSaleReceiptDto`).
      properties:
        itemId: { type: string, format: uuid }
        itemName: { type: string }
        sku: { type: string, nullable: true }
        quantitySold: { type: integer }
        unitPrice: { type: number }
        totalAmount: { type: number }
        remainingStock:
          type: integer
          description: The stock left after the sale. A real measurement, including a measured zero.
        status: { type: string, enum: [available, low_stock, reserved, archived] }
        ledgerEntryId:
          type: string
          format: uuid
          description: The takings-journal row the register will show for this sale.
        recordedAtUtc: { type: string, format: date-time }
    CatalogLookbookUpdateRequest:
      type: object
      description: |
        The editable metadata of a composed lookbook (`UpdateOutfitCompositionDto`). Every field is
        optional; an omitted field keeps the stored value, and an empty `styleNotes` clears it.
      properties:
        name: { type: string, nullable: true }
        occasion: { type: string, nullable: true }
        styleNotes: { type: string, nullable: true }
    CatalogSourcingRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        category: { type: string }
        color: { type: string }
        description: { type: string }
        targetPrice: { type: number, nullable: true }
        quantityNeeded: { type: integer }
        customerId: { type: string, format: uuid, nullable: true }
        urgency: { type: string, default: medium }
        status: { type: string, default: pending }
        createdAtUtc: { type: string, format: date-time }
    CatalogSupplier:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        supplierName: { type: string }
        contactEmail: { type: string, nullable: true }
        contactPhone: { type: string, nullable: true }
        minimumOrder: { type: number, nullable: true }
        deliveryTimeDays: { type: integer, nullable: true }
        isActive: { type: boolean }
        createdAtUtc: { type: string, format: date-time }
    CatalogSupplierItem:
      type: object
      properties:
        supplierId: { type: string, format: uuid }
        supplierName: { type: string }
        sku: { type: string }
        itemName: { type: string }
        category: { type: string }
        color: { type: string }
        wholesalePrice: { type: number }
        leadTimeDays: { type: integer }
        availableStock: { type: integer }
        imageUrl: { type: string, nullable: true }
    AnalyzeImageRequest:
      type: object
      description: |
        `AnalyzeImageDto`. `organizationId` is overwritten from the route, so it need not be sent.
        The request carries **either** a named reference (`imageRefKind` + `imageRefId`) **or**
        `imageUrl`.
      properties:
        organizationId: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        imageRefKind:
          type: string
          nullable: true
          enum: [attachment, inventoryImage, externalUrl]
          description: |
            The reference arm's row kind. `attachment` and `inventoryImage` are the two
            tokenisable kinds; `externalUrl` (or an unknown value) falls through to `imageUrl`.
        imageRefId:
          type: string
          format: uuid
          nullable: true
          description: The referenced row's id. Absent means the reference arm does not apply.
        imageUrl:
          type: string
          default: ""
          description: |
            **Non-nullable and defaulting to empty** (strategy §4 C14). Empty is treated as
            absent, so a stale `""` never shadows a named reference. The arm stays deliberately
            permissive and any host is forwarded to the provider.
        fileName: { type: string, nullable: true }
        contextHint: { type: string, nullable: true }
        prompt: { type: string, nullable: true }
    ImageAnalysisResult:
      type: object
      description: |
        `ImageAnalysisResultDto`. Only the fields whose wire name is pinned by an external
        consumer are listed with the exact spelling; the remainder serialise camelCase.
      properties:
        category: { type: string }
        primary_color:
          type: string
          description: |
            The extracted dominant colour. On the wire as `primary_color` (snake_case) because
            `image_tools.py` reads `primary_color` first and silently lost the camelCase value.
        colorHex: { type: string, nullable: true }
        secondary_colors:
          type: array
          items: { type: string }
          description: |
            The accent colours. Also `secondary_colors` (snake_case): the same boundary read the
            camelCase spelling as absent.
        pattern: { type: string, nullable: true }
        style: { type: string, nullable: true }
        fabric: { type: string, nullable: true }
        garmentType: { type: string, nullable: true }
        suggestedItemName: { type: string, nullable: true }
        description: { type: string, nullable: true }
        stylingNotes: { type: string, nullable: true }
        confidenceScore: { type: number, default: 0.95 }
        isFallback:
          type: boolean
          default: false
          description: True when the deterministic offline fallback produced the answer.
        not_analysable:
          type: boolean
          default: false
          description: |
            The referenced asset's stored type is outside the vision provider's analysable subset,
            so no analysis was attempted and no access was minted. Carried explicitly so a caller
            can tell "this format cannot be analysed" from "the provider failed" (`isFallback`).
        suggestedKeywords:
          type: array
          items: { type: string }
    MediaTokenResponse:
      type: object
      description: A mint's wire answer.
      properties:
        token:
          type: string
          description: The opaque media token (`base64url(payload).base64url(hmac)`).
        url:
          type: string
          description: The absolute Aveline URL a fetcher should call, built from `Media:PublicBaseUrl`.
        publicId:
          type: string
          description: |
            The provider public id. Carried so the analysis cache can key on `{orgId}:{publicId}`
            instead of the ever-changing token URL.
        expiresAtUtc: { type: string, format: date-time }
    MediaProviderError:
      type: object
      description: A provider failure on the protected media route. The body carries a correlation id, never provider detail.
      properties:
        message: { type: string }
        correlationId: { type: string }
    MessageDto:
      type: object
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        authorKind: { type: string }
        agentKey: { type: string, nullable: true }
        authorUserId: { type: string, format: uuid, nullable: true }
        kind: { type: string }
        contentBlocks:
          type: array
          items: { type: object, additionalProperties: true }
        contentHash: { type: string, nullable: true }
        replyToMessageId: { type: string, format: uuid, nullable: true }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        clientMessageId:
          type: string
          format: uuid
          nullable: true
          description: |
            The client-generated idempotency key this message was stored under, echoed so a
            client can reconcile the realtime broadcast of its own optimistic row. Null for
            anything the server authored.
        workflowRunId:
          type: string
          format: uuid
          nullable: true
          description: The LangGraph run that produced this message, for bubble-to-run correlation.
    DeliveryResultDto:
      type: object
      description: |
        The result of one attempt to put a block in front of the customer on their own channel.
        `delivered` is the whole answer: when it is false **nothing reached the customer**,
        `refusal` names the state in machine terms and `detail` is the sentence to show the
        associate. The sentence is the server's because only it knows which state applies —
        "you have not connected WhatsApp" and "that client has no number on file" are different
        things to do next, and one generic failure for both would be a worse answer than either.
      required: [delivered]
      properties:
        delivered: { type: boolean }
        channel:
          type: string
          nullable: true
          description: The channel the words actually left on, when they did (`WhatsApp`).
        providerMessageId:
          type: string
          nullable: true
          description: The provider's own id for the outbound message, for support.
        message:
          allOf:
            - $ref: "#/components/schemas/MessageDto"
          nullable: true
          description: |
            The row the delivery was recorded as, with `status: Sent`. This is the difference the
            transcript exists to show: `Sent` says a customer has it, where a `Published` note
            would be a record of something that never left the shop.
        refusal:
          type: string
          nullable: true
          enum:
            - conversation_not_found
            - no_customer
            - no_channel_handle
            - channel_not_connected
            - channel_unsupported
            - provider_refused
        detail:
          type: string
          nullable: true
          description: The reason, phrased for the associate.
    MessagePage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/MessageDto" }

