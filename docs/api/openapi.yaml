              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ---------------------------------------------------------------------------
  # Subscription and entitlements
  # ---------------------------------------------------------------------------
  /api/v1/orgs/{organizationId}/subscription:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Billing]
      summary: Read the current subscription
      description: |
        Phase 2. Requires `billing:view`. If no subscription row exists yet, returns
        `200` with `status: "None"` and the tier derived from the organization, so a
        valid organization never produces a 404 here.
      operationId: getSubscription
      responses:
        "200":
          description: Subscription
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{organizationId}/subscription/change-plan:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      tags: [Billing]
      summary: Upgrade or downgrade the plan
      description: |
        Phase 2. Requires `billing:manage`. Requires `Idempotency-Key`.

        An upgrade takes effect immediately and writes a `PlanUpgradeProration`
        ledger entry. A downgrade defaults to the next period and is blocked with
        `409 plan-limit-violation` when current usage exceeds any target limit.
      operationId: changePlan
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePlanRequest" }
      responses:
        "200":
          description: Plan changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangePlanResponse" }
        "400":
          description: No-op plan change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Plan limit violation, or idempotency key reuse
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanLimitViolationError" }

  /api/v1/orgs/{organizationId}/subscription/cancel:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      tags: [Billing]
      summary: Cancel at the end of the current period
      description: Phase 2. Requires `billing:manage`.
      operationId: cancelSubscription
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Already cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/orgs/{organizationId}/entitlements:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Billing]
      summary: Read resolved entitlements for the organization
      description: |
        Phase 2. Requires `billing:view`. Frontends should drive ALL plan gating
        from this endpoint rather than hardcoding a plan matrix.
      operationId: getEntitlements
      responses:
        "200":
          description: Entitlements
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntitlementListResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/entitlements/usage:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Billing]
      summary: Read observed usage against each limited entitlement
      description: Phase 2. Requires `billing:view`.
      operationId: getEntitlementUsage
      responses:
        "200":
          description: Entitlement usage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntitlementUsageResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ---------------------------------------------------------------------------
  # API keys
  # ---------------------------------------------------------------------------
  /api/v1/orgs/{organizationId}/api-keys:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [API Keys]
      summary: List API keys
      description: Phase 3. Requires `apikeys:view`. The secret and its hash are never returned.
      operationId: listApiKeys
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ApiKeyStatus" }
      responses:
        "200":
          description: API keys
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyPage" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [API Keys]
      summary: Create an API key
      description: |
        Phase 3. Requires `apikeys:manage` and the `api.access` entitlement
        (Rose and Enterprise only). The plaintext `secret` is returned **exactly
        once** in this response and can never be retrieved again.
      operationId: createApiKey
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApiKeyRequest" }
      responses:
        "201":
          description: Created. Store the secret immediately.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyCreatedResponse" }
        "400":
          description: Validation failure, or a scope that cannot be delegated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Missing permission, or the plan does not include `api.access`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/orgs/{organizationId}/api-keys/{keyId}/revoke:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/ApiKeyId"
    post:
      tags: [API Keys]
      summary: Revoke an API key
      description: Phase 3. Requires `apikeys:manage`. Effective within 60 seconds on all instances.
      operationId: revokeApiKey
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 300 }
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKey" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Already revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/orgs/{organizationId}/api-keys/{keyId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/ApiKeyId"
    delete:
      tags: [API Keys]
      summary: Delete an unused API key
      description: Phase 3. Requires `apikeys:manage`. Only permitted when the key has never been used.
      operationId: deleteApiKey
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The key has been used and cannot be hard-deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ---------------------------------------------------------------------------
  # Pricing — admin
  # ---------------------------------------------------------------------------
  /api/v1/admin/pricing/rules:
    get:
      tags: [Pricing]
      summary: List Blossom conversion rules
      description: "Phase 1. Requires the team-only `PricingAdminRead` policy: the `admin` or `owner` role **and** `pricing:view`. Never available to boutique roles."
      operationId: listPricingRules
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: scopeKind
          in: query
          schema: { $ref: "#/components/schemas/PricingScopeKind" }
        - name: provider
          in: query
          schema: { type: string, maxLength: 64 }
        - name: model
          in: query
          schema: { type: string, maxLength: 128 }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/PricingRuleStatus" }
        - name: activeAt
          in: query
          schema: { type: string, format: date-time }
          description: Return the rule that would price usage at this instant
      responses:
        "200":
          description: Rules
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingRulePage" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Pricing]
      summary: Create a Blossom conversion rule
      description: |
        Phase 1. Requires `pricing:manage`. A past `effectiveFrom` additionally
        requires `pricing:backdate`. The rule is created as `Draft`.
      operationId: createPricingRule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePricingRuleRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingRule" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Missing `pricing:manage`, or a past effective date without `pricing:backdate`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: The effective window overlaps an existing rule for the same scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/admin/pricing/rules/{ruleId}:
    parameters:
      - $ref: "#/components/parameters/PricingRuleId"
    get:
      tags: [Pricing]
      summary: Read one conversion rule
      description: "Phase 1. Requires the team-only `PricingAdminRead` policy: the `admin` or `owner` role **and** `pricing:view`."
      operationId: getPricingRule
      responses:
        "200":
          description: Rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingRule" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Pricing]
      summary: Edit a draft conversion rule
      description: |
        Phase 1. Requires `pricing:manage`. Only permitted while `status = Draft`.
        A past `effectiveFrom` additionally requires `pricing:backdate` (403 otherwise).
      operationId: updatePricingRule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePricingRuleRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingRule" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The rule is not a `Draft` (`code: rule-immutable`). Only a `Draft`
            rule may be edited; supersede it with a new rule instead.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/admin/pricing/rules/{ruleId}/activate:
    parameters:
      - $ref: "#/components/parameters/PricingRuleId"
    post:
      tags: [Pricing]
      summary: Activate a conversion rule
      description: |
        Phase 1. Requires `pricing:manage`. Atomically trims the predecessor's
        `effectiveTo` to this rule's `effectiveFrom` and marks the predecessor
        `Superseded`. A past `effectiveFrom` in the body additionally requires
        `pricing:backdate` (403 otherwise).
      operationId: activatePricingRule
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                effectiveFrom: { type: string, format: date-time, nullable: true }
      responses:
        "200":
          description: Activated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingRule" }
        "400":
          description: The rule is not a Draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The effective window overlaps an existing rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/admin/pricing/rules/{ruleId}/cancel:
    parameters:
      - $ref: "#/components/parameters/PricingRuleId"
    post:
      tags: [Pricing]
      summary: Cancel a draft conversion rule
      description: Phase 1. Requires `pricing:manage`.
      operationId: cancelPricingRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { $ref: "#/components/schemas/AdjustmentReason" }
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingRule" }
        "400":
          description: |
            `code: rule-priced` when the rule is already `Active` and has priced
            usage (activate a superseding rule instead); `code: validation` for a
            bad reason.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/pricing/rules/{ruleId}/recompute:
    parameters:
      - $ref: "#/components/parameters/PricingRuleId"
    post:
      tags: [Pricing]
      summary: Re-price already-recorded usage affected by a backdated rule
      description: |
        Requires `pricing:backdate`. Calculates pricing differences for affected AI usage
        records, writes compensating `BlossomLedgerEntry` (CorrectionRecompute) entries,
        updates the organization `UsageAccount`, and emits `pricing.rule.recomputed` events.
      operationId: recomputePricingRule
      responses:
        "200":
          description: Recompute result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingRecomputeResult" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Price book
  # ---------------------------------------------------------------------------
  /api/v1/admin/pricing/price-book:
    get:
      tags: [Pricing]
      summary: List price-book entries
      description: |
        Phase 1. Requires the team-only `PricingAdminRead` policy: the `admin` or `owner` role **and** `pricing:view`.

        Returns a **bare array of entries — there is no `page`/`pageSize` and no
        `{ items, total }` envelope** (finding M-8, a deliberate deviation from the
        §A.4 pagination convention).
      operationId: listPricingPriceEntries
      parameters:
        - name: skuKind
          in: query
          schema: { $ref: "#/components/schemas/PricingSkuKind" }
        - name: planTier
          in: query
          schema: { $ref: "#/components/schemas/PlanTier" }
        - name: organizationId
          in: query
          schema: { type: string, format: uuid }
          description: |
            Filter to this organization's override; omit to list global entries only.
      responses:
        "200":
          description: Price-book entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PricingPriceEntry" }
        "400":
          description: Invalid `skuKind` or `planTier` filter
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Pricing]
      summary: Create a price-book entry
      description: Phase 1. Requires `pricing:manage`. Created as `Draft`.
      operationId: createPricingPriceEntry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePriceEntryRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingPriceEntry" }
        "400":
          description: Field validation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/pricing/price-book/{entryId}:
    parameters:
      - $ref: "#/components/parameters/PricingEntryId"
    get:
      tags: [Pricing]
      summary: Read one price-book entry
      description: |
        Phase 1. Requires the team-only `PricingAdminRead` policy: the `admin` or `owner` role **and** `pricing:view`.
        A global entry (no `organizationId`) is always readable; a per-organization
        override is readable only when the caller passes that same `organizationId`.
      operationId: getPricingPriceEntry
      parameters:
        - name: organizationId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Price-book entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingPriceEntry" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Pricing]
      summary: Edit a price-book entry
      description: Phase 1. Requires `pricing:manage`.
      operationId: updatePricingPriceEntry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePriceEntryRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingPriceEntry" }
        "400":
          description: Field validation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Pricing]
      summary: Retire a price-book entry
      description: |
        Phase 1. Requires `pricing:manage`. Sets the entry's status to `Cancelled`;
        returns `204 No Content`.
      operationId: deletePricingPriceEntry
      responses:
        "204":
          description: Retired
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Agent statistics
  # ---------------------------------------------------------------------------
  /api/v1/orgs/{organizationId}/statistics/agents/runs:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Agent Statistics]
      summary: List agent workflow runs
      description: Phase 4. Requires `stats:view:agent` (owner and above).
      operationId: listAgentRuns
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/AgentRunStatus" }
        - name: agentKey
          in: query
          schema: { $ref: "#/components/schemas/AgentKey" }
        - name: triggerKind
          in: query
          schema: { $ref: "#/components/schemas/AgentTriggerKind" }
        - name: customerId
          in: query
          schema: { type: string, format: uuid }
        - name: conversationId
          in: query
          schema: { type: string, format: uuid }
        - name: sort
          in: query
          schema:
            type: string
            enum: [startedAt, -startedAt, durationMs, -durationMs]
            default: -startedAt
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRunPage" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/statistics/agents/runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: runId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Agent Statistics]
      summary: Read one agent run with its step trace
      description: Phase 4. Requires `stats:view:agent`.
      operationId: getAgentRun
      responses:
        "200":
          description: Run with steps
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRunDetail" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{organizationId}/statistics/agents/reliability:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Agent Statistics]
      summary: Read agent success and failure rates
      description: Phase 4. Requires `stats:view:agent`.
      operationId: getAgentReliability
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: groupBy
          in: query
          schema:
            type: string
            enum: [agentKey, triggerKind, nodeName, day, hour]
            default: agentKey
      responses:
        "200":
          description: Reliability series
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentReliabilityResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/statistics/agents/latency:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Agent Statistics]
      summary: Read agent workflow latency percentiles
      description: |
        Phase 4. Requires `stats:view:agent`. Percentile fields are `null` with
        `precision: insufficient-sample` when `sampleCount` is below
        `Telemetry:MinSampleForPercentile` (default 20).
      operationId: getAgentLatency
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: groupBy
          in: query
          schema:
            type: string
            enum: [agentKey, triggerKind, day, hour]
            default: agentKey
      responses:
        "200":
          description: Latency series
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PercentileSeriesResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/statistics/agents/tokens:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Agent Statistics]
      summary: Read agent token usage
      description: Phase 4. Requires `stats:view:agent`.
      operationId: getAgentTokens
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: groupBy
          in: query
          schema:
            type: string
            enum: [agentKey, provider, model, workflowId, day, hour]
            default: agentKey
      responses:
        "200":
          description: Token usage series
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentTokenResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/statistics/agents/steps:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Agent Statistics]
      summary: Read per-node agent step statistics
      description: Phase 4. Requires `stats:view:agent`.
      operationId: getAgentSteps
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: agentKey
          in: query
          schema: { $ref: "#/components/schemas/AgentKey" }
        - name: nodeName
          in: query
          schema: { type: string, maxLength: 128 }
      responses:
        "200":
          description: Step statistics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentStepStatisticsResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/statistics/agents/cost:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Agent Statistics]
      summary: Read agent AI cost
      description: |
        Phase 4. Requires `stats:view:agent`. `dataQuality.costIsEstimated` is
        `true` until the agent service reports actual cost, which it does not today.
      operationId: getAgentCost
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: groupBy
          in: query
          schema:
            type: string
            enum: [agentKey, provider, model, day]
            default: day
      responses:
        "200":
          description: Cost series
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentCostResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
