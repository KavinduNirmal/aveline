          description: Ledger entry written
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlossomLedgerEntryResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Period closed, or idempotency key reuse
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/admin/orgs/{organizationId}/blossoms/debit:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      tags: [Admin Billing]
      summary: Debit Blossoms from an organization
      description: Phase 2. Requires `billing:adjust`. Requires `Idempotency-Key`.
      operationId: adminDebitBlossoms
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, reason]
              properties:
                amount: { $ref: "#/components/schemas/BlossomAmount" }
                reason: { $ref: "#/components/schemas/AdjustmentReason" }
