  # ---------------------------------------------------------------------------
  # Commerce — orders and business rules (tenant-scoped)
  #
  # These routes were undocumented until the tenant-dashboard slice, which is part of how two
  # blocking defects survived: `OrdersController` and `BusinessRulesController` carried no
  # `[Authorize]` at all and used an `{orgId}` token the organization-scope handler never reads,
  # so any authenticated caller could read and write any organization's orders and rules.
  #
  # The token is `organizationId` on every route below. The policy split is deliberate: reads and
  # create stay at member level (the counter creates orders); the lifecycle verbs, the order-status
  # change and every business-rule route require `orders:manage`, because staff may approve a
  # customer order but may not change an order's lifecycle or the rules that gate discounts.
  # ---------------------------------------------------------------------------
  /api/v1/orgs/{organizationId}/orders:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Commerce]
      summary: List orders for the organization
      description: |
        SHIPPED. `BoutiqueMember` policy — any active member of this organization.
      operationId: listOrders
      responses:
        "200":
          description: A page of orders
          content:
            application/json:
              schema: { type: object, description: "PagedResult<OrderResponseDto>" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Commerce]
      summary: Create an order
      description: |
        SHIPPED. `BoutiqueMember` policy — the counter associate creates the order they are serving.
      operationId: createOrder
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { type: object, description: "OrderResponseDto" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/orders/{id}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Commerce]
      summary: Read one order
      description: SHIPPED. `BoutiqueMember` policy.
      operationId: getOrderById
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema: { type: object, description: "OrderResponseDto" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Commerce]
      summary: Update an order
      description: |
        SHIPPED. `BoutiqueOrderManage` policy (`orders:manage`). Staff hold the read and the
        create but not this verb.
      operationId: updateOrder
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { type: object, description: "OrderResponseDto" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
