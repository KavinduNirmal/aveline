# =============================================================================
# Aveline — Azure deployment
#
# Deliberately SEPARATE from ci.yml: ci.yml validates every push and pull request
# and must stay fast and secret-free; this workflow ships, so it runs only when
# asked and only where the OIDC trust exists.
#
# NOTE: no deployment job existed before this file. Every deployment of the beta
# was performed by hand from a workstation, which is why the environment drifted
# from docs/deployment.md. This workflow is the first codified path.
#
# -----------------------------------------------------------------------------
# ONE-TIME SETUP (required before this can run)
#
# Uses a USER-ASSIGNED MANAGED IDENTITY, not an app registration. This tenant has
# `defaultUserRolePermissions.allowedToCreateApps: false`, so `az ad app create`
# and `az ad sp create-for-rbac` both fail with
# "401 Insufficient privileges to complete the operation" - app registration is
# disabled tenant-wide for ordinary users and only a Global Administrator could
# change that. A managed identity is created by the *resource provider* rather
# than the Graph API, so it is unaffected, and it supports GitHub OIDC federated
# credentials. No client secret exists at any point.
#
# 1. Create the identity and trust GitHub's OIDC issuer:
#
#      az identity create -g rg-aveline -n id-aveline-github
#      PRINCIPAL=$(az identity show -g rg-aveline -n id-aveline-github --query principalId -o tsv)
#
#      az identity federated-credential create \
#        --identity-name id-aveline-github -g rg-aveline --name gh-master-immutable \
#        --issuer https://token.actions.githubusercontent.com \
#        --subject 'repo:KavinduNirmal@65773645/aveline@1345130828:ref:refs/heads/master' \
#        --audiences api://AzureADTokenExchange
#
#    Add one credential per branch that may deploy:
#      --subject 'repo:KavinduNirmal@65773645/aveline@1345130828:ref:refs/heads/release/version-beta-0.2.0'
#
#    A workflow triggered from a ref with no matching subject cannot log in. That
#    is the intended restriction.
#
#    THE SUBJECT IS NOT repo:OWNER/REPO. This repository receives GitHub's
#    "immutable" subject claims, which bake the owner and repository *numeric ids*
#    into the claim. A credential written as
#    repo:KavinduNirmal/aveline:ref:refs/heads/master therefore never matches, and
#    the login dies with
#
#      AADSTS700213: No matching federated identity record found for presented
#      assertion subject 'repo:KavinduNirmal@65773645/aveline@1345130828:...'
#
#    which is exactly how the first run of this workflow failed (2026-09-26). The
#    incorrect subject is accepted silently when the credential is created - Azure
#    does not validate the format against the IdP - so read the prefix from GitHub
#    before writing a credential:
#
#      gh api repos/KavinduNirmal/aveline/actions/oidc/customization/sub
#
#        {"use_default":true,"use_immutable_subject":true,
#         "sub_claim_prefix":"repo:KavinduNirmal@65773645/aveline@1345130828"}
#
#    The subject is that prefix, then ":ref:refs/heads/<branch>". If the repository
#    is ever transferred or renamed, both ids change and every credential has to be
#    rewritten. That is the point of the immutable form: a rename cannot silently
#    inherit this deploy identity. Turning it off instead (PUT the same endpoint
#    with use_immutable_subject=false) makes the name-only form match again, at the
#    cost of that guarantee. Prefer the explicit id form.
#
# 2. Grant it exactly what it needs (all three already granted for rg-aveline):
#      AcrPush                        on avelineacr     push images
#      Key Vault Secrets User         on kv-aveline-mw  read the connection string for migrations
#      Container Apps Contributor     on rg-aveline      update the revisions
#
#    Container Apps Contributor, not Contributor: the deploy job updates revisions
#    and has no business writing anything else in the group.
#
# 3. Repository variables (Settings > Secrets and variables > Actions > Variables):
#      AZURE_CLIENT_ID        the identity's clientId (NOT its principalId)
#      AZURE_TENANT_ID        the directory (tenant) id
#      AZURE_SUBSCRIPTION_ID  the subscription id
#      ACR_NAME               avelineacr
#      RESOURCE_GROUP         rg-aveline
#      CONTAINER_APP_ENV      cae-aveline
#
# 4. Repository secret
#      POSTGRES_ADMIN_PASSWORD  only if you intend to re-run the Bicep template.
#                               Migrations read the connection string from Key Vault
#                               and do not need it.
# =============================================================================

name: Aveline Deploy

on:
  # Manual by default. Nothing ships without a human choosing to ship it.
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy. Defaults to the commit SHA of the selected ref."
        required: false
        type: string
      run_migrations:
        description: "Apply EF Core migrations before rolling the apps."
        required: false
        type: boolean
        default: false
      skip_build:
        description: "Skip build+push and deploy an already-published tag."
        required: false
        type: boolean
        default: false
      seed_handbook:
        description: "Seed the handbook knowledge base from this commit's markdown. Idempotent, but it embeds and upserts, so it costs an API round-trip per changed chunk."
        required: false
        type: boolean
        default: false

# Only ever one deployment at a time, and never cancel one mid-flight: a cancelled
# roll can leave the API on a half-applied revision.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Required for OIDC. Without it azure/login cannot exchange a token.
  id-token: write

env:
  ACR_NAME: ${{ vars.ACR_NAME || secrets.ACR_NAME }}
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP || secrets.RESOURCE_GROUP }}
  CONTAINER_APP_ENV: ${{ vars.CONTAINER_APP_ENV || secrets.CONTAINER_APP_ENV }}
  KEY_VAULT_NAME: kv-aveline-mw
  API_APP: aveline-api
  AGENT_APP: aveline-agent

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build and push both images
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build and push images
    if: ${{ !inputs.skip_build }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_SHA::7}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying tag: $TAG"

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to the registry
        run: az acr login --name "$ACR_NAME"

      - name: Build and push the API image
        run: |
          REG="${ACR_NAME}.azurecr.io"
          TAG="${{ steps.tag.outputs.tag }}"
          docker build -f Aveline.Api/Dockerfile -t "$REG/aveline-api:$TAG" -t "$REG/aveline-api:latest" Aveline.Api
          docker push "$REG/aveline-api:$TAG"
          docker push "$REG/aveline-api:latest"

      - name: Build and push the agent image
        run: |
          REG="${ACR_NAME}.azurecr.io"
          TAG="${{ steps.tag.outputs.tag }}"
          docker build -f agent-service/Dockerfile -t "$REG/aveline-agent:$TAG" -t "$REG/aveline-agent:latest" agent-service
          docker push "$REG/aveline-agent:$TAG"
          docker push "$REG/aveline-agent:latest"

  # ---------------------------------------------------------------------------
  # Job 2: Migrations
  #
  # Opt-in, because migrations are the only irreversible step here. They must run
  # BEFORE the new revision starts: Program.cs applies migrations only when
  # IsDevelopment(), so a Production deployment has no startup migration path at
  # all and nothing else in the repository applies them.
  #
  # Ordering caveat: the previous revision keeps serving during the migration, so
  # every migration must be backward compatible with the code still running.
  # ---------------------------------------------------------------------------
  migrate:
    name: Apply EF Core migrations
    needs: build-and-push
    if: ${{ inputs.run_migrations }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # `dotnet ef` builds the project, so it needs the NuGet assets file. Without
      # this the bundle step dies on NETSDK1004 - "project.assets.json not found" -
      # because `dotnet tool restore` restores the *tool*, not the project.
      - name: Restore dependencies
        run: dotnet restore Aveline.Api/Aveline.Api.sln

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build the migration bundle
        run: |
          dotnet tool restore
          dotnet ef migrations bundle \
            --project Aveline.Api --startup-project Aveline.Api \
            --configuration Release --output efbundle --force

      # Read from Key Vault rather than a GitHub secret: the vault is already the
      # source of truth, and this keeps the connection string out of Actions.
      #
      # NOTE: the *local* ambient environment must not be allowed to select the
      # in-memory provider. The API now refuses that in Production, but the
      # migration bundle reads ConnectionStrings__DefaultConnection directly.
      - name: Apply migrations
        run: |
          CONN=$(az keyvault secret show \
            --vault-name "$KEY_VAULT_NAME" \
            --name postgres-connection-string \
            --query value -o tsv)
          # Fail loudly on an empty string rather than migrating something local.
          if [ -z "$CONN" ]; then
            echo "::error::Empty connection string from Key Vault; refusing to migrate."
            exit 1
          fi
          ./efbundle --connection "$CONN"

  # ---------------------------------------------------------------------------
  # Job 3: Roll the applications
  #
  # `az containerapp update --image` creates a new revision and waits for it to
  # become ready. The agent is rolled FIRST so that when the API revision starts,
  # its dependency is already serving the matching code.
  # ---------------------------------------------------------------------------
  deploy:
    name: Roll Container Apps revisions
    # `migrate` is only in play when run_migrations is true, so this cannot be a
    # plain `needs`: a skipped job takes its dependents down with it. The condition
    # keeps the free-standing behaviour when migrations were not requested, and
    # refuses to roll new code onto an un-migrated database when they were
    # requested and failed - which is exactly what shipped against postgres on
    # 2026-09-26, when a failed migration job still let revision 0000007 reach
    # 100% of traffic and the API began failing with
    # "42703: column c0.Nickname does not exist". `always()` is what lets the
    # skipped case be evaluated at all.
    needs: [build-and-push, migrate]
    if: ${{ always() && needs.build-and-push.result == 'success' && (!inputs.run_migrations || needs.migrate.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve image tag
        id: tag
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_SHA::7}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Roll the agent
        run: |
          REG="${ACR_NAME}.azurecr.io"
          az containerapp update \
            --name "$AGENT_APP" --resource-group "$RESOURCE_GROUP" \
            --image "$REG/aveline-agent:${{ steps.tag.outputs.tag }}"

      - name: Roll the API
        run: |
          REG="${ACR_NAME}.azurecr.io"
          az containerapp update \
            --name "$API_APP" --resource-group "$RESOURCE_GROUP" \
            --image "$REG/aveline-api:${{ steps.tag.outputs.tag }}"

      # A revision reporting "Healthy" is NOT evidence the application works: an
      # Express environment once ran the placeholder quickstart image against a
      # healthy revision. Assert the two things that actually distinguish a live
      # deployment.
      - name: Verify the deployment
        run: |
          API_FQDN=$(az containerapp show \
            --name "$API_APP" --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)

          # 1. The revision must be running the image we just pushed.
          RUNNING=$(az containerapp show \
            --name "$API_APP" --resource-group "$RESOURCE_GROUP" \
            --query "properties.template.containers[0].image" -o tsv)
          echo "API is configured to run: $RUNNING"
          case "$RUNNING" in
            *"aveline-api:${{ steps.tag.outputs.tag }}"*) ;;
            *) echo "::error::API is not running the expected tag"; exit 1 ;;
          esac

          # 2. The application must actually answer, with its dependencies healthy.
          echo "Polling https://${API_FQDN}/health ..."
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/health.json -w '%{http_code}' -m 15 "https://${API_FQDN}/health" || true)
            if [ "$CODE" = "200" ]; then
              cat /tmp/health.json
              STATUS=$(python3 -c "import json;print(json.load(open('/tmp/health.json'))['status'])")
              if [ "$STATUS" = "Healthy" ]; then
                echo "Deployment verified: /health is Healthy."
                exit 0
              fi
            fi
            echo "  attempt $i: HTTP $CODE"
            sleep 20
          done
          echo "::error::API did not report Healthy within the timeout."
          exit 1

  # ---------------------------------------------------------------------------
  # Job 4: Seed the handbook knowledge base (opt-in)
  #
  # Nothing else seeds it. Without this job the handbook table exists, is migrated, and is empty -
  # so every question the agent should answer from the handbook is answered from nowhere, and
  # nothing about the deployment looks wrong while that is true. That is precisely the shape of
  # failure a checkbox is good at removing: the work is real, and it is easy to leave undone.
  #
  # Opt-in and last, because it runs against the revision this run has just rolled and it is the
  # only step here that writes content rather than images or revisions. Re-running is safe: the API
  # embeds each chunk and upserts it, so an unchanged source writes nothing.
  # ---------------------------------------------------------------------------
  seed-handbook:
    name: Seed the handbook
    needs: [build-and-push, deploy]
    # `always()` so that a skipped `migrate` job cannot silently skip this one too; the real gate
    # is that the roll actually succeeded.
    if: ${{ always() && inputs.seed_handbook && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install the seeder's dependencies
        working-directory: agent-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The token comes from Key Vault rather than a GitHub secret, for the same reason the
      # migration job reads the connection string there: the vault is already the source of truth,
      # and the token never has to be copied into a second place.
      - name: Seed the handbook
        working-directory: agent-service
        run: |
          TOKEN=$(az keyvault secret show \
            --vault-name "$KEY_VAULT_NAME" \
            --name agent-internal-token \
            --query value -o tsv)
          if [ -z "$TOKEN" ]; then
            echo "::error::Empty internal token from Key Vault; refusing to seed."
            exit 1
          fi

          FQDN=$(az containerapp show \
            --name "$API_APP" --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)

          python scripts/seed_handbook.py --base-url "https://${FQDN}" --token "$TOKEN"

      # A seed that "succeeds" while the handbook stays empty is the exact failure this job was
      # added to prevent, so it asserts the result rather than trusting the seeder's exit code.
      - name: Verify the handbook is not empty
        run: |
          FQDN=$(az containerapp show \
            --name "$API_APP" --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          TOKEN=$(az keyvault secret show \
            --vault-name "$KEY_VAULT_NAME" \
            --name agent-internal-token \
            --query value -o tsv)

          SOURCES=$(curl -sS -m 30 -H "X-Internal-Token: ${TOKEN}" \
            "https://${FQDN}/internal/handbook/sources")
          echo "Indexed sources: ${SOURCES}"

          case "$SOURCES" in
            '[]'|'')
              echo "::error::The handbook still reports no sources after seeding."
              exit 1
              ;;
          esac
