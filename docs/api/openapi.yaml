  # ---------------------------------------------------------------------------
  # API consumption statistics
  # ---------------------------------------------------------------------------
  /api/v1/orgs/{organizationId}/statistics/api/requests:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [API Statistics]
      summary: Read API request volume
      description: Phase 5. Requires `stats:view`.
      operationId: getApiRequestStatistics
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: groupBy
          in: query
          schema:
            type: string
            enum: [hour, day, routeTemplate, statusClass, apiKeyId, userId]
            default: hour
        - name: routeTemplate
          in: query
          schema: { type: string, maxLength: 200 }
        - name: statusClass
          in: query
          schema: { type: string, enum: ["1xx", "2xx", "3xx", "4xx", "5xx"] }
        - name: apiKeyId
          in: query
          schema: { type: string, format: uuid }
        - name: userId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Request statistics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiRequestStatisticsResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/statistics/api/errors:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [API Statistics]
      summary: Read API error and throttle rates
      description: |
        Phase 5. Requires `stats:view`. Throttle rejections (429) are reported
        separately from other 4xx so the UI can distinguish "you are being
        throttled" from "you sent a bad request".
      operationId: getApiErrorStatistics
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: groupBy
          in: query
          schema:
            type: string
            enum: [hour, day, routeTemplate, statusCode]
            default: hour
        - name: routeTemplate
          in: query
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          description: Error statistics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorStatisticsResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/statistics/api/latency:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [API Statistics]
      summary: Read API latency percentiles
      description: |
        Phase 5. Requires `stats:view`. Percentiles are interpolated from
        histogram buckets, so `precision` is `bucket-interpolated` — surface that
        in the UI rather than presenting the numbers as exact.
      operationId: getApiLatencyStatistics
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: groupBy
          in: query
          schema:
            type: string
            enum: [hour, day, routeTemplate, statusClass]
            default: routeTemplate
        - name: routeTemplate
          in: query
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          description: Latency statistics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiLatencyResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/statistics/api/endpoints:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [API Statistics]
      summary: Read per-endpoint usage
      description: Phase 5. Requires `stats:view`.
      operationId: getApiEndpointStatistics
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: sort
          in: query
          schema:
            type: string
            enum: [count, -count, errorRate, -errorRate]
            default: -count
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Endpoint usage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEndpointStatisticsResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/statistics/api/users:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [API Statistics]
      summary: Read per-user API usage
      description: Phase 5. Requires `stats:view`.
      operationId: getApiUserStatistics
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: groupBy
          in: query
          schema:
            type: string
            enum: [userId, day]
            default: userId
      responses:
        "200":
          description: User usage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiUserStatisticsResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/statistics/api/quota:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [API Statistics]
      summary: Read quota status for the current period
      description: Phase 5. Requires `stats:view`.
      operationId: getApiQuotaStatus
      responses:
        "200":
          description: Quota status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiQuotaStatusResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/statistics/api/slow-requests:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [API Statistics]
      summary: List the slowest individual requests
      description: |
        Phase 5. Requires `stats:view`. Returns a correlation `requestId` per row
        but never request or response bodies. Raw rows are retained 7 days.
      operationId: getApiSlowRequests
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: minDurationMs
          in: query
          schema: { type: integer, minimum: 0, default: 1000 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Slow requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/SlowRequest" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/statistics/api/billable:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [API Statistics]
      summary: Read billable request count for a period
      description: |
        Phase 5. Requires `billing:view`. Excludes health checks, OpenAPI
        documents, CORS preflight, and client-closed (499) requests.
      operationId: getApiBillableRequests
      parameters:
        - name: month
          in: query
          required: false
          schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" }
          description: Defaults to the current month
      responses:
        "200":
          description: Billable usage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiBillableResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/statistics/api-keys:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [API Statistics]
      summary: Read per-API-key consumption
      description: Phase 5. Requires `stats:view`.
      operationId: getApiKeyStatistics
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: groupBy
          in: query
          schema:
            type: string
            enum: [apiKeyId, day, endpoint]
            default: apiKeyId
      responses:
        "200":
          description: Key usage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyStatisticsResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

