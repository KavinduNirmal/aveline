name: Aveline CI

on:
  push:
    branches: [main, master, development]
  pull_request:
    branches: [main, master, development]
  # Manual runs only exist so the iOS job can be exercised without waiting for a
  # master push: dispatch with ios_build_only=true to build the IPA and upload it
  # as a workflow artifact. No GitHub Release is ever created outside master.
  workflow_dispatch:
    inputs:
      ios_build_only:
        description: "Build the iOS IPA and upload it as an artifact, without publishing a release."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Repository Hygiene (Locks, Env, Secrets)
  # ---------------------------------------------------------------------------
  hygiene:
    name: Repository Hygiene & Lockfile Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify only bun lockfile exists
        run: |
          echo "Checking for disallowed package manager lockfiles..."
          DISALLOWED=$(find . -name "package-lock.json" -o -name "yarn.lock" -o -name "pnpm-lock.yaml" -o -name "pnpm-lock.yml" -o -name "npm-shrinkwrap.json" | grep -v node_modules || true)
          if [ -n "$DISALLOWED" ]; then
            echo "::error::Disallowed lockfiles found in repository. Only bun.lock / bun.lockb is permitted:"
            echo "$DISALLOWED"
            exit 1
          fi
          echo "✓ Lockfile hygiene passed"

      - name: Verify no .env files committed
        run: |
          echo "Checking for committed .env files..."
          ENV_FILES=$(find . -name ".env" -o -name ".env.local" -o -name ".env.production" -o -name ".env.development" | grep -v "\.env\.example" || true)
          if [ -n "$ENV_FILES" ]; then
            echo "::error::Committed environment file(s) detected:"
            echo "$ENV_FILES"
            exit 1
          fi
          echo "✓ No .env files found"

      # The stage ordering is a contract, and this repository's ordering requirement is
      # explicit: file-based tests -> E2E -> k6 -> application builds. It is expressed
      # entirely with `needs:`, so a new build job that forgets one entry would look fine
      # and quietly ship an artifact from a run whose tests never passed. This step makes
      # the contract executable, and it runs before any test job is scheduled.
      - name: Verify the CI stage ordering contract
        run: python3 scripts/verify_ci_ordering.py

  # ---------------------------------------------------------------------------
  # Job 2: Test — ASP.NET Core API (file-based test stage)
  #
  # Split out of the old combined build-and-test job. The repository's CI ordering
  # contract is: file-based tests -> E2E integration -> k6 performance -> application
  # builds. Publishing a shippable API artifact is now its own job (`build-api`) that
  # `needs` every test stage, so a failing test can no longer be followed by a
  # publishable artifact from the same job.
  # ---------------------------------------------------------------------------
  test-api:
    name: Test API (.NET)
    runs-on: ubuntu-latest
    needs: hygiene

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Aveline.Api/Aveline.Api.sln

      # Compiling is a prerequisite for running the suite, not the application build
      # step the ordering contract talks about. The publishable artifact is produced
      # only in `build-api`, after every test stage has passed.
      - name: Build API (compile for test)
        run: dotnet build Aveline.Api/Aveline.Api.sln --no-restore -c Release

      # One run, not two. This used to be a plain `dotnet test` followed by an identical
      # `dotnet test` that only added `--collect`, so the entire suite executed twice to produce one
      # answer each time. That made this job the longest in the workflow by a wide margin - roughly
      # 50 minutes, of which about 48 were these two steps running the same 4,000 tests.
      #
      # Collecting on the single run keeps every downstream step working: the cobertura file below
      # is what the threshold check, ReportGenerator and the artefact all read, and `dotnet test`
      # still exits non-zero on a failing test whether or not coverage is being collected.
      - name: Test API and collect coverage
        run: dotnet test Aveline.Api/Aveline.Api.sln --no-build --no-restore -c Release --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Enforce coverage threshold (line >= 30%)
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          files = glob.glob('TestResults/**/coverage.cobertura.xml', recursive=True)
          assert files, 'No coverage file found'
          root = ET.parse(files[0]).getroot()
          covered = int(root.get('lines-covered')); valid = int(root.get('lines-valid'))
          rate = covered / valid if valid else 0
          print(f'Line coverage: {covered}/{valid} = {rate:.1%}')
          if rate < 0.30:
              print('::error::Line coverage below 30% threshold')
              raise SystemExit(1)
          EOF

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: reportgenerator -reports:TestResults/**/coverage.cobertura.xml -targetdir:coverage-report -reporttypes:Html

      - name: Upload API coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aveline-api-coverage
          path: coverage-report

  # ---------------------------------------------------------------------------
  # Job 2b (stage 4): Publish the API artifact - ONLY after every test stage passes
  # ---------------------------------------------------------------------------
  build-api:
    name: Publish API Artifact
    runs-on: ubuntu-latest
    needs: [test-api, e2e-integration, k6-performance]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Aveline.Api/Aveline.Api.sln

      - name: Publish API
        run: dotnet publish Aveline.Api/Aveline.Api.csproj -c Release --no-restore -o api-publish

      - name: Upload API artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aveline-api
          path: api-publish

  # ---------------------------------------------------------------------------
  # Job 4c (stage 4): Build the web dashboard - ONLY after every test stage passes
  # ---------------------------------------------------------------------------
  build-web:
    name: Build Web Dashboard Artifact
    runs-on: ubuntu-latest
    needs: [test-web, perf-web, e2e-integration, k6-performance]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: frontend/web

      - name: Build
        env:
          # Optional: enables a fully functional bundle when the secret is set.
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: bun run build
        working-directory: frontend/web

      - name: Upload web artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aveline-web
          path: frontend/web/dist

  # ---------------------------------------------------------------------------
  # Job 3: Lint & Test — Python Agent Service
  # ---------------------------------------------------------------------------
  test-python:
    name: Lint & Test Python Agent Service
    runs-on: ubuntu-latest
    needs: hygiene

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies & linter
        run: |
          python -m pip install --upgrade pip
          pip install -r agent-service/requirements.txt -r agent-service/requirements-dev.txt

      - name: Run Ruff Lint
        run: python -m ruff check --output-format=github app/
        working-directory: agent-service

      - name: Run Pytest (coverage gate >= 90%)
        run: python -m pytest tests/ --cov=app --cov-report=xml:coverage.xml --cov-report=term --cov-fail-under=90
        working-directory: agent-service

      # Gap A2. The chapter lists eight golden behaviour cases and records that nothing
      # aggregates them: eight named tests are a checklist, not a measurement. This step runs
      # exactly those node ids through the ``golden_behaviour`` marker and writes a pass-rate
      # report. It exits non-zero when a case fails **or** does not run, so it is a gate and not
      # a print statement; the JSON is the measurement a reviewer can cite.
      - name: Run the eight golden behaviour cases (scored report)
        run: python scripts/run_behaviour_cases.py --stdout
        working-directory: agent-service

      - name: Upload agent coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aveline-agent-coverage
          path: agent-service/coverage.xml

      - name: Upload the golden behaviour-case report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aveline-agent-behaviour-cases
          path: agent-service/reports/behaviour-cases.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Job 4: Build, Test & Lint — Vite Web Dashboard
  # ---------------------------------------------------------------------------
  test-web:
    name: Build, Test & Lint Web Dashboard
    runs-on: ubuntu-latest
    needs: hygiene

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: frontend/web

      - name: Lint
        run: bun run lint
        working-directory: frontend/web

      - name: "Test (coverage gate: lines >= 80%)"
        run: bun run test:coverage
        working-directory: frontend/web

      # The admin ratchet. It is its own run because the tenant gate's glob-scoped thresholds
      # deliberately exclude the admin subtree (C3), which meant the admin floor only ever bound on a
      # developer's laptop. This step is what makes it a gate.
      - name: "Test (admin coverage ratchet)"
        run: bun run test:coverage:admin
        working-directory: frontend/web

      # The tenant-dashboard ratchet (T7). The tenant subtree is excluded from the global run and
      # from the admin run, so before this step its floor bound nowhere in CI either. It is a third
      # run rather than a shared denominator because a tenant regression must never be blamed on the
      # console, and an admin slice must never move the tenant number.
      - name: "Test (tenant dashboard coverage ratchet)"
        run: bun run test:coverage:dashboard
        working-directory: frontend/web

      - name: Upload web coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aveline-web-coverage
          path: frontend/web/coverage

  # ---------------------------------------------------------------------------
  # Job 4b (stage 1): Bundle ratchets - the byte-level performance gate (gap N2)
  #
  # `tests/performance/budgets.spec.ts` carries five byte budgets and had no CI
  # job, so the row's "a real byte-level gate" claim was only true on a laptop.
  # This job builds a bundle, serves `dist` with the same compression and cache
  # headers Vercel uses (`tests/performance/serve.cjs`), and runs the budget spec
  # against it. The build here is a test fixture, not the shipped artifact:
  # `build-web` below is what publishes `frontend/web/dist`.
  # ---------------------------------------------------------------------------
  perf-web:
    name: Web Bundle Budgets (bytes)
    runs-on: ubuntu-latest
    needs: hygiene

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: frontend/web

      - name: Build the bundle under test
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: bun run build
        working-directory: frontend/web

      - name: Install Playwright Chromium
        run: bun run test:e2e:install
        working-directory: frontend/web

      - name: "Run bundle budget ratchets"
        # The package script sets NODE_PATH (so @playwright/test resolves from
        # frontend/web) and a writable HOME (Chrome writes its profile there).
        # Tests that need to actually paint the app skip themselves when headless
        # Chrome cannot mount it, so this job is a deterministic byte gate on CI.
        run: bun run test:perf
        working-directory: frontend/web

      - name: Upload bundle budget report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aveline-web-bundle-budgets
          path: |
            frontend/web/test-results
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Job 5: Analyze & Test — Flutter Mobile App
  # ---------------------------------------------------------------------------
  test-flutter:
    name: Analyze & Test Flutter App
    runs-on: ubuntu-latest
    needs: hygiene

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get
        working-directory: frontend/aveline_mobile

      - name: Analyze Flutter codebase
        run: flutter analyze --no-fatal-infos
        working-directory: frontend/aveline_mobile

      - name: Run Flutter tests (with coverage)
        run: flutter test --coverage
        working-directory: frontend/aveline_mobile

      # Gap M1. The suite ran coverage and gated nothing: the lcov file was uploaded and
      # never read. The floor below is a RATCHET set just under the rate measured on
      # 2026-10-01 with the full post-M5 suite: 15,773 hit of 19,364 found = 81.46%,
      # identical across two consecutive runs. Sum the LH/LF records and divide; do not
      # read a single record or a pre-computed TOTAL line, because lcov emits one block
      # per file and no summary.
      #
      # Note the number went DOWN from the 86.00% an earlier tree measured, and that is
      # instrumentation surface rather than lost coverage: `flutter test --coverage`
      # counts every library that gets loaded, and the new real-router test imports
      # app_router.dart, which imports every screen. That pulled ~14 previously
      # untested-and-uninstrumented files into the report (the largest,
      # owner_onboarding_screen.dart, is LF=321 LH=1). Raising the floor to 84 requires
      # testing those screens; it is not a wiring change.
      - name: "Enforce Flutter coverage floor (line >= 81%)"
        working-directory: frontend/aveline_mobile
        env:
          MOBILE_COVERAGE_FLOOR: "81"
        run: |
          python3 - <<'EOF'
          import os, re, sys

          FLOOR = float(os.environ["MOBILE_COVERAGE_FLOOR"])
          path = "coverage/lcov.info"
          try:
              text = open(path, encoding="utf-8").read()
          except FileNotFoundError:
              print(f"::error::{path} not found; did `flutter test --coverage` run?")
              raise SystemExit(1)

          found = sum(int(m) for m in re.findall(r"^LF:(\d+)", text, re.M))
          hit = sum(int(m) for m in re.findall(r"^LH:(\d+)", text, re.M))
          rate = (hit / found * 100) if found else 0.0
          print(f"Flutter line coverage: {hit}/{found} = {rate:.2f}% (floor {FLOOR:.2f}%)")
          if rate < FLOOR:
              print(f"::error::Flutter line coverage {rate:.2f}% is below the {FLOOR:.2f}% floor")
              raise SystemExit(1)
          EOF

      - name: Upload Flutter coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aveline-mobile-coverage
          path: frontend/aveline_mobile/coverage/lcov.info

  # ===========================================================================
  # STAGE 2 - E2E INTEGRATION
  #
  # Every job in this stage `needs` every stage-1 test job. GitHub Actions does
  # not schedule a job whose `needs` are unmet, so a failure anywhere in stage 1
  # means no E2E job is even started. That is the fail-fast half of the ordering
  # contract; the `needs` lists on the stage-4 build jobs are the other half.
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Job 10 (stage 2): the existing repository browser suite
  #
  # The plan's gap E2: `frontend/web/package.json` already carried `test:e2e` and
  # `test:e2e:install`, and no workflow invoked either of them. The specs live
  # above the web package, so the package script is the only correct entry point
  # (`NODE_PATH` is what lets `tests/e2e/**` resolve `@playwright/test`).
  # ---------------------------------------------------------------------------
  e2e-browser:
    name: "E2E (stage 2): browser suite"
    runs-on: ubuntu-latest
    needs: [test-api, test-python, test-web, test-flutter, perf-web]
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: frontend/web

      - name: Install Playwright Chromium
        run: bun run test:e2e:install
        working-directory: frontend/web

      # The SPA calls `clerkPublishableKey()` during its first render and throws
      # without it (frontend/web/src/lib/env.ts), so no spec — not even a
      # signed-out walk — can run without the key. Fork pull requests never
      # receive secrets, so the suite is skipped there with a warning rather than
      # failed for a reason that has nothing to do with the change; the same
      # convention build-flutter-apk already uses for the Firebase config.
      - name: Check for the Clerk publishable key
        id: clerk-key
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$VITE_CLERK_PUBLISHABLE_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::VITE_CLERK_PUBLISHABLE_KEY is not set, so the SPA cannot boot and the browser suite is skipped. This is expected on fork pull requests, where secrets are never provided."
          fi

      - name: Run the browser suite
        if: steps.clerk-key.outputs.available == 'true'
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          HOME: /tmp
        run: bun run test:e2e
        working-directory: frontend/web

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aveline-e2e-browser-report
          path: |
            frontend/web/playwright-report
            frontend/web/test-results
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Job 11 (stage 2): the cross-surface workflow - gap E1
  #
  # This is the test that closes the two `Not met` rows. It drives a real
  # composed stack: PostgreSQL, the real ASP.NET Core API process, the real
  # Python agent service and the real Redis event round-trip. Nothing about the
  # system under test is stubbed. The only non-production component is the
  # identity provider: the API validates a real RS256 bearer token against a
  # committed stub OIDC issuer, because the alternative is a human clicking
  # through Clerk's hosted sign-in page.
  # ---------------------------------------------------------------------------
  e2e-integration:
    name: "E2E (stage 2): cross-surface workflow"
    runs-on: ubuntu-latest
    needs: [test-api, test-python, test-web, test-flutter, perf-web]
    timeout-minutes: 45
    # Pinned so the retrieval evaluation below can authenticate against the API the
    # same script started. It must not be one of the agent's refused placeholders
    # (`_WEAK_INTERNAL_TOKENS` in agent-service/app/core/config.py).
    #
    # PSQL is pointed at the compose container rather than the runner's `psql`. The
    # seeder shells out to Postgres to insert the `Users` and `Customers` rows (the
    # org itself is created through the real `POST /api/v1/orgs`), and using the
    # container's own client removes a dependency on what the runner image happens to
    # ship. The seeder uses a custom PSQL command verbatim instead of appending
    # -h/-p/-U/-d, which is exactly what this form needs.
    env:
      E2E_INTERNAL_TOKEN: aveline-e2e-ci-internal-service-token
      PSQL: "docker exec -i aveline_postgres psql -U aveline -d aveline"
      # Job-level, not step-level, because two steps need it for different reasons: the boot
      # step's `bun run dev` inherits it (the SPA throws during its first render without it),
      # and the spec step reads it to decide whether the browser leg can run at all. Its
      # absence is the normal case for this repository, and the leg skips rather than fails --
      # the same convention the `e2e-browser` job uses. The cross-surface walk does not need it.
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install web dependencies
        run: bun install --frozen-lockfile
        working-directory: frontend/web

      - name: Install Playwright Chromium
        run: bun run test:e2e:install
        working-directory: frontend/web

      - name: Install agent-service dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent-service/requirements.txt

      # `up` starts Postgres + Redis in Docker and the stub issuer, API and agent
      # as host processes, then waits for readiness. `seed` creates the
      # organisation, the identity, the membership and the customer and writes a
      # state JSON. `web` starts the dashboard the browser leg loads.
      - name: Boot the composed stack and seed it
        env:
          AGENT_LLM_ENABLED: "false"
        run: |
          set -euo pipefail
          mkdir -p test-results
          scripts/e2e-composed-stack.sh up
          scripts/e2e-composed-stack.sh seed
          scripts/e2e-composed-stack.sh web
          echo "--- stack state ---"
          cat test-results/e2e-composed-stack/stack.env

      - name: Run the cross-surface workflow spec
        env:
          E2E_STATE_FILE: ${{ github.workspace }}/test-results/e2e-composed-stack/e2e-composed-stack.json
        run: |
          set -euo pipefail
          set -a; . test-results/e2e-composed-stack/stack.env; set +a
          # stack.env names the origins by role (`E2E_WEB_BASE_URL`), while the spec gates
          # on `E2E_BASE_URL` for the web origin and `E2E_API_BASE_URL` for the API. Both
          # must be present or the spec self-skips and the stage passes having tested
          # nothing -- which is exactly the failure mode a green E2E job must not have.
          export E2E_BASE_URL="${E2E_WEB_BASE_URL}"
          test -n "$E2E_BASE_URL" && test -n "$E2E_API_BASE_URL"
          cd frontend/web
          bun run test:e2e -- tests/e2e/integration/salon-cross-surface.spec.ts tests/e2e/integration/api-key-conversation-gap.spec.ts

      # Gap A3. The retrieval evaluation used to print and store nothing, so the
      # recall figures lived only in the ADR that quoted them. `--out` makes the
      # number a tracked artefact. It is only meaningful against a populated
      # handbook index served with an embeddings credential, so the step probes
      # the index first and records that it was skipped rather than writing a 0%
      # that means "not measured" rather than "retrieves badly".
      #
      # Both prerequisites are real and were observed, not assumed: a fresh CI
      # database has no `HandbookChunk` rows, and `POST /internal/handbook/search`
      # answers 500 `Embeddings:ApiKey is not configured.` when the key is absent
      # (even for `mode: lexical`). Provide `EMBEDDINGS_API_KEY` and seed the
      # handbook to turn this step into a tracked metric.
      - name: Handbook retrieval evaluation (tracked artefact)
        run: |
          set -euo pipefail
          set -a; . test-results/e2e-composed-stack/stack.env; set +a
          PROBE=$(curl -s -o /tmp/handbook-probe.json -w '%{http_code}' \
            -X POST "$E2E_API_BASE_URL/internal/handbook/search" \
            -H "X-Internal-Token: $E2E_INTERNAL_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"query":"handbook","mode":"lexical","audience":"staff","topK":1}' || true)
          if [ "$PROBE" != "200" ] || ! python3 -c "
          import json,sys
          data = json.load(open('/tmp/handbook-probe.json'))
          sys.exit(0 if isinstance(data, list) and len(data) > 0 else 1)
          " 2>/dev/null; then
            echo "::warning::the handbook index is empty or unreachable (probe HTTP $PROBE), so the retrieval evaluation is skipped rather than recording a misleading 0%. A 500 here means Embeddings:ApiKey is unset; otherwise seed the index with agent-service/scripts/seed_handbook.py."
            python3 - <<'EOF' || true
          import json
          try:
              body = json.load(open('/tmp/handbook-probe.json'))
              print('probe body:', json.dumps(body)[:300])
          except Exception as exc:
              print('probe body was not JSON:', exc)
          EOF
            exit 0
          fi
          cd agent-service
          python scripts/eval_handbook.py \
            --base-url "$E2E_API_BASE_URL" \
            --token "$E2E_INTERNAL_TOKEN" \
            --out reports/handbook-eval.json
          echo "--- tracked metric ---"
          cat reports/handbook-eval.json

      - name: Stop the composed stack
        if: always()
        run: scripts/e2e-composed-stack.sh down || true

      - name: Upload E2E integration report and service logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aveline-e2e-integration-report
          path: |
            frontend/web/playwright-report
            frontend/web/test-results
            test-results
            agent-service/reports/handbook-eval.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Job 12 (stage 2): the Flutter device run - gap M3
  #
  # `flutter test` runs widget tests in a headless Dart VM. `integration_test`
  # pumps the real application on a real device, which is the only thing that
  # would catch a response-shape change the widget suite cannot see. The plan
  # names the Android emulator as the CI path.
  # ---------------------------------------------------------------------------
  test-flutter-integration:
    name: "E2E (stage 2): Flutter integration test (emulator)"
    runs-on: ubuntu-latest
    needs: [test-api, test-python, test-web, test-flutter, perf-web]
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get
        working-directory: frontend/aveline_mobile

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the integration test on an Android emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          # The app is built once by the runner; `-d emulator-5554` pins the
          # device so a second attached device cannot make the run ambiguous.
          script: cd frontend/aveline_mobile && flutter test integration_test -d emulator-5554

      - name: Upload Flutter integration results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aveline-flutter-integration
          path: frontend/aveline_mobile/build/app/outputs/androidTest-results
          if-no-files-found: ignore

  # ===========================================================================
  # STAGE 3 - PERFORMANCE (k6)
  #
  # Runs only after both stage-2 jobs pass, and before any stage-4 build.
  # ===========================================================================
  k6-performance:
    name: "Performance (stage 3): k6 budgets"
    runs-on: ubuntu-latest
    needs: [e2e-browser, e2e-integration, test-flutter-integration]
    timeout-minutes: 35
    # Same reason as the E2E job: the seeder's SQL half runs through the compose
    # container's own psql, not whatever the runner image ships.
    env:
      PSQL: "docker exec -i aveline_postgres psql -U aveline -d aveline"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install agent-service dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent-service/requirements.txt

      # k6 does not need the dashboard, so this job boots the stack without `web`.
      # A pre-flight (SMOKE=1) is used on pull requests; a push to a stable
      # branch runs the full stages.
      - name: Boot the composed stack and seed it
        env:
          AGENT_LLM_ENABLED: "false"
        run: |
          set -euo pipefail
          mkdir -p test-results
          scripts/e2e-composed-stack.sh up
          scripts/e2e-composed-stack.sh seed
          cat test-results/e2e-composed-stack/e2e-composed-stack.json

      - name: Write the k6 credential environment
        run: |
          set -euo pipefail
          python3 - <<'EOF' > k6.env
          import json
          state = json.load(open('test-results/e2e-composed-stack/e2e-composed-stack.json'))
          print(f"ORG_ID={state['organizationId']}")
          print(f"AUTH_TOKEN={state['bearerToken']}")
          print("API_BASE_URL=http://127.0.0.1:5091")
          EOF
          # Never print the token; show only the keys that were written.
          cut -d= -f1 k6.env

      - name: "k6 gate 1: telemetry-middleware budget"
        run: |
          set -euo pipefail
          # --user is required, not cosmetic. The k6 image runs as uid 12345, the runner's
          # workspace is owned by uid 1001, and k6 writes `--out json=` plus its summary into
          # the mounted workspace: without this the run dies at startup with
          # `open /w/k6-results-telemetry.json: permission denied` and exits 255. Matching the
          # container's uid to the mount's owner is enough, and HOME is redirected because the
          # image's own /home/k6 belongs to the uid we are no longer using.
          docker run --rm --network host -v "$PWD:/w" -w /w \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            --env-file k6.env -e SMOKE="${{ github.event_name == 'pull_request' && '1' || '0' }}" \
            grafana/k6@sha256:e66db15b860113878fa74670e31f5e274830b7b6e42c8bff28b2f2d86a257603 \
            run --out json=/w/k6-results-telemetry.json tests/load/k6-telemetry-overhead.js

      - name: "k6 gate 2: critical endpoints and the salon workflow"
        run: |
          set -euo pipefail
          docker run --rm --network host -v "$PWD:/w" -w /w \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            --env-file k6.env -e SMOKE="${{ github.event_name == 'pull_request' && '1' || '0' }}" \
            grafana/k6@sha256:e66db15b860113878fa74670e31f5e274830b7b6e42c8bff28b2f2d86a257603 \
            run --out json=/w/k6-results-critical-workflows.json tests/load/k6-critical-workflows.js

      - name: Stop the composed stack
        if: always()
        run: scripts/e2e-composed-stack.sh down || true

      # Gap N3: the evidence index recorded k6 output as "Not retained". Both the
      # raw per-request series and the compact human-readable summary are attached
      # here, so a performance number exists to cite after the run.
      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aveline-k6-performance
          path: |
            k6-results-*.json
            k6-critical-workflows-summary.json
            k6.env
            test-results
          if-no-files-found: ignore

  # ===========================================================================
  # STAGE 4 - APPLICATION BUILDS
  #
  # Nothing below may start until every test stage has passed. Each build job's
  # `needs` list contains `e2e-integration` and `k6-performance`.
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Job 5b: Build the release Android APK
  #
  # Split out of the job above on purpose: the Gradle build is the slowest and
  # least reliable part of the pipeline, and while it lived in the test job a
  # stalled APK build reported the Flutter tests as failed and held back every
  # job that depends on them (including the iOS release below).
  # ---------------------------------------------------------------------------
  build-flutter-apk:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    # Stage 4: the APK is a shipped artifact, so it waits for every test stage -
    # file-based tests, E2E integration and k6 performance - not just the Flutter unit suite.
    needs: [test-flutter, e2e-integration, k6-performance]
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get
        working-directory: frontend/aveline_mobile

      # The Google Services Gradle plugin generates the Firebase string resources
      # (google_app_id, gcm_defaultSenderId, ...) from android/app/google-services.json.
      # That file is gitignored because it is per-project config, so CI supplies it from a
      # secret. The secret holds the file base64-encoded: GitHub preserves a multi-line value
      # but not its exact quoting, and a mangled JSON blob fails inside Gradle with an error
      # that says nothing about the secret.
      - name: Write google-services.json from secret
        working-directory: frontend/aveline_mobile/android/app
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            # A missing secret resolves to an empty string rather than failing, so this has to
            # be explicit. Fork pull requests never receive secrets.
            if [ "${{ github.event_name }}" != "pull_request" ]; then
              echo "::error::GOOGLE_SERVICES_JSON_BASE64 is not set, so this build would publish an APK without Firebase push notifications."
              exit 1
            fi
            echo "::notice::GOOGLE_SERVICES_JSON_BASE64 is not set (expected on fork PRs); building an APK without Firebase push."
            exit 0
          fi

          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > google-services.json
          head -c 1 google-services.json | grep -q '{' \
            || { echo "::error::google-services.json did not decode to JSON. Is the GOOGLE_SERVICES_JSON_BASE64 secret base64-encoded?"; exit 1; }
          echo "Wrote $(wc -c < google-services.json) bytes of Firebase config."

      # The committed android/gradle.properties sizes the Gradle and Kotlin JVMs for a
      # 15 GB development host with no swap, where a larger heap drew the kernel OOM
      # killer: -Xmx1280m with -XX:MaxMetaspaceSize=448m, plus
      # kotlin.compiler.execution.strategy=in-process, which runs Kotlin inside that
      # same JVM. Those caps also apply here, and on the runner AGP 9 plus Kotlin
      # exhausts 448m of metaspace and dies mid-build with
      # "java.lang.OutOfMemoryError: Metaspace".
      #
      # This runner has ~16 GB, so the limits are raised for CI only rather than in the
      # tracked file, which would put the developer's host back where it started.
      - name: Raise the Gradle JVM limits for this runner
        working-directory: frontend/aveline_mobile/android
        run: |
          set -euo pipefail
          sed -i \
            's|^org\.gradle\.jvmargs=.*|org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError|' \
            gradle.properties
          grep '^org.gradle.jvmargs=' gradle.properties

      - name: Build release APK
        # The --dart-define values are not optional. AppConfig reads every setting
        # from String.fromEnvironment at COMPILE time, so a build without them
        # bakes in the fallbacks: API_BASE_URL=http://10.0.2.2:5091 (the Android
        # EMULATOR's loopback alias, unreachable from a real device) and the
        # DEVELOPMENT Clerk instance. Every APK this job published before 0.2.0
        # was therefore inert - it installed, then could not reach any backend.
        # Read from Variables or Secrets so either location works.
        #
        # --build-number comes from the run number, so versionCode increases on every
        # release. pubspec pins it at 1, which means Android cannot tell build 200
        # from build 152 and will happily install the older one over the newer one.
        # This also keeps versionCode aligned with the `build.<run_number>` suffix
        # the release tag already carries.
        run: |
          flutter build apk --release \
            --build-number="${{ github.run_number }}" \
            --dart-define=API_BASE_URL="${{ vars.APK_API_BASE_URL || secrets.APK_API_BASE_URL }}" \
            --dart-define=CLERK_PUBLISHABLE_KEY="${{ vars.APK_CLERK_PUBLISHABLE_KEY || secrets.APK_CLERK_PUBLISHABLE_KEY }}" \
            --dart-define=AVELINE_WEB_BASE_URL="${{ vars.APK_WEB_BASE_URL || secrets.APK_WEB_BASE_URL }}"
        working-directory: frontend/aveline_mobile

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aveline-mobile-apk
          path: frontend/aveline_mobile/build/app/outputs/flutter-apk

  # ---------------------------------------------------------------------------
  # Job 6: Security & Dependency Scan
  # ---------------------------------------------------------------------------
  security-scan:
    name: Security & Dependency Scan
    runs-on: ubuntu-latest
    needs: hygiene
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Aveline.Api/Aveline.Api.sln

      - name: Scan .NET packages for vulnerabilities
        run: |
          dotnet list Aveline.Api/Aveline.Api.sln package --vulnerable --include-transitive > /tmp/dotnet-vuln.txt 2>&1
          cat /tmp/dotnet-vuln.txt
          if grep -q "has the following vulnerable packages" /tmp/dotnet-vuln.txt; then
            echo "::error::Vulnerable .NET packages found (see GHSA advisories above)"
            exit 1
          fi
          echo "✓ No vulnerable .NET packages"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Scan web dependencies
        working-directory: frontend/web
        run: bun audit --audit-level high

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: node_modules,.git,build,dist,.cache
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        # Best effort: requires "Code scanning" to be enabled in repo settings.
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

  # ---------------------------------------------------------------------------
  # Job 7: OWASP ZAP baseline scan against a locally booted API (best effort)
  # ---------------------------------------------------------------------------
  zap-baseline:
    name: ZAP Baseline Scan (Auth API)
    runs-on: ubuntu-latest
    needs: hygiene
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore & build API
        run: |
          dotnet restore Aveline.Api/Aveline.Api.sln
          dotnet build Aveline.Api/Aveline.Api.sln --no-restore -c Release

      - name: Start API
        env:
          # Development profile loads Clerk authority + agent config from
          # appsettings.Development.json; the env override is a safety net.
          ASPNETCORE_ENVIRONMENT: Development
          Clerk__Authority: https://inspired-warthog-8208.clerk.accounts.dev
        run: |
          nohup dotnet run --project Aveline.Api/Aveline.Api.csproj -c Release --no-build \
            --no-launch-profile --urls http://127.0.0.1:5091 > /tmp/api.log 2>&1 &
          UP=0
          for i in $(seq 1 45); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5091/api/v1/policies/associate || true)
            if [ "$code" != "000" ]; then
              echo "API is up (HTTP $code)"
              UP=1
              break
            fi
            sleep 2
          done
          if [ "$UP" != "1" ]; then
            echo "::error::API failed to start"
            tail -20 /tmp/api.log
            exit 1
          fi

      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://127.0.0.1:5091
          cmd_options: "-J results.json"

      - name: Upload ZAP report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: aveline-zap-baseline
          path: results.json

  # ---------------------------------------------------------------------------
  # Job 8: Publish versioned Android APK GitHub Release (master pushes only)
  # ---------------------------------------------------------------------------
  release-android:
    name: Publish Android APK Release
    # Only real pushes to the stable branch produce a release; PRs never do.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # Gated on the APK build (not just the tests) because this job publishes the
    # artifact that the build job uploads.
    needs: build-flutter-apk
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download APK artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aveline-mobile-apk
          path: apk

      - name: Derive app version from pubspec
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version: *\(.*\)/\1/p' frontend/aveline_mobile/pubspec.yaml | head -1)"
          if [ -z "$VERSION" ]; then
            echo "::error::Unable to read version from frontend/aveline_mobile/pubspec.yaml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "safe=${VERSION//+/.}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SAFE="${{ steps.version.outputs.safe }}"
          RUN_NUMBER="${{ github.run_number }}"
          TAG="v${SAFE}-build.${RUN_NUMBER}"
          APK="$(find apk -name '*.apk' -type f | head -1)"
          if [ -z "$APK" ]; then
            echo "::error::No APK found in the aveline-mobile-apk artifact."
            exit 1
          fi
          gh release create "$TAG" "$APK#aveline-mobile-${SAFE}-build.${RUN_NUMBER}.apk" \
            --repo "${{ github.repository }}" \
            --title "Aveline Mobile v${VERSION} (build #${RUN_NUMBER})" \
            --notes "Automated release from \`master\` at ${{ github.sha }}." \
            --target master

  # ---------------------------------------------------------------------------
  # Job 9: Publish unsigned iOS IPA GitHub Release (master pushes only)
  # ---------------------------------------------------------------------------
  release-ios:
    name: Publish iOS App Release
    # Same gate as the Android release: a real push to the stable branch, and only
    # after the Flutter analyze/test job in this run has succeeded. The manual
    # dispatch path is a dry run that uploads the artifact but never releases.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.ios_build_only == 'true')
    # iOS builds need a macOS runner. The repository is public, so macOS minutes are free.
    runs-on: macos-latest
    timeout-minutes: 60
    # Stage 4: same rule as the Android release - every test stage must pass first.
    needs: [test-flutter, e2e-integration, k6-performance]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get
        working-directory: frontend/aveline_mobile

      # firebase_core/firebase_messaging read ios/Runner/GoogleService-Info.plist at runtime, and
      # Runner.xcodeproj references it so it lands in the app bundle. It is per-project config, so
      # it is gitignored and CI supplies it from a secret - the same arrangement as Android's
      # google-services.json. The secret holds the file base64-encoded: GitHub preserves a
      # multi-line value but not its exact quoting, and a mangled plist fails inside Xcode with an
      # error that says nothing about the secret.
      #
      # A missing secret is a warning, not an error: fork pull requests never receive secrets, and
      # the app's NoopPushTokenSource fallback already handles FCM being unavailable.
      - name: Write GoogleService-Info.plist from secret
        working-directory: frontend/aveline_mobile/ios/Runner
        env:
          PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -z "$PLIST_B64" ]; then
            echo "::warning::GOOGLE_SERVICE_INFO_PLIST_BASE64 is not set, so Firebase cannot initialise on iOS and push notifications will not work in this build."
            exit 0
          fi

          printf '%s' "$PLIST_B64" | base64 --decode > GoogleService-Info.plist
          # A plist is XML. A binary blob or a truncated paste would otherwise fail much later,
          # inside Xcode, with an error that points nowhere near the secret.
          head -c 5 GoogleService-Info.plist | grep -q '<?xml' \
            || { echo "::error::GOOGLE_SERVICE_INFO_PLIST_BASE64 did not decode to an XML plist. Is the secret base64-encoded?"; exit 1; }
          echo "Wrote $(wc -c < GoogleService-Info.plist) bytes of iOS Firebase config."

      - name: Derive app version from pubspec
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version: *\(.*\)/\1/p' frontend/aveline_mobile/pubspec.yaml | head -1)"
          if [ -z "$VERSION" ]; then
            echo "::error::Unable to read version from frontend/aveline_mobile/pubspec.yaml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "safe=${VERSION//+/.}" >> "$GITHUB_OUTPUT"

      # --no-codesign because no Apple signing identity is available in CI: the tool
      # builds and archives the app but skips the export step, so the step below packages
      # the .ipa from the archive itself.
      - name: Build iOS archive
        # Same compile-time configuration as the APK. Without these the IPA carries
        # the emulator loopback API URL and the development Clerk instance, exactly
        # as the APK did before 0.2.0.
        run: |
          flutter build ipa --release --no-codesign \
            --dart-define=API_BASE_URL="${{ vars.APK_API_BASE_URL || secrets.APK_API_BASE_URL }}" \
            --dart-define=CLERK_PUBLISHABLE_KEY="${{ vars.APK_CLERK_PUBLISHABLE_KEY || secrets.APK_CLERK_PUBLISHABLE_KEY }}" \
            --dart-define=AVELINE_WEB_BASE_URL="${{ vars.APK_WEB_BASE_URL || secrets.APK_WEB_BASE_URL }}"
        working-directory: frontend/aveline_mobile

      - name: Package unsigned IPA
        working-directory: frontend/aveline_mobile
        env:
          SAFE_VERSION: ${{ steps.version.outputs.safe }}
          RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find build/ios/archive -type d -name 'Runner.app' -path '*Products/Applications*' | head -1)"
          if [ -z "$APP" ]; then
            echo "::error::flutter build ipa did not produce Runner.app inside build/ios/archive."
            exit 1
          fi

          ARCHIVE="$(cd "$(dirname "$APP")/../.." && pwd)"
          IPA_DIR="$(pwd)/build/ios/ipa"
          STAGE="$(pwd)/build/ios/unsigned-stage"
          BASE="aveline-mobile-${SAFE_VERSION}-build.${RUN_NUMBER}"

          rm -rf "$IPA_DIR" "$STAGE"
          mkdir -p "$STAGE/Payload" "$IPA_DIR"
          cp -R "$APP" "$STAGE/Payload/"
          (cd "$STAGE" && zip -qry "$IPA_DIR/${BASE}-unsigned.ipa" Payload)

          # dSYMs keep crash reports symbolicated and cost nothing to ship alongside.
          if [ -d "$ARCHIVE/dSYMs" ]; then
            (cd "$ARCHIVE/dSYMs" && zip -qry "$IPA_DIR/${BASE}-dSYMs.zip" .)
          fi

          ls -la "$IPA_DIR"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aveline-mobile-ios
          path: frontend/aveline_mobile/build/ios/ipa/*
          if-no-files-found: error

      - name: Publish GitHub Release
        # Never on the manual dry run, and never on pull requests.
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          SAFE="${{ steps.version.outputs.safe }}"
          RUN_NUMBER="${{ github.run_number }}"
          BASE="aveline-mobile-ios-${SAFE}-build.${RUN_NUMBER}"

          # An iOS-specific tag keeps this release from colliding with the Android one,
          # which the job above creates from the same master push.
          TAG="ios-v${SAFE}-build.${RUN_NUMBER}"
          IPA="$(find frontend/aveline_mobile/build/ios/ipa -name '*.ipa' -type f | head -1)"
          DSYMS="$(find frontend/aveline_mobile/build/ios/ipa -name '*.zip' -type f | head -1)"
          if [ -z "$IPA" ]; then
            echo "::error::No IPA found to release."
            exit 1
          fi

          NOTES_FILE="$RUNNER_TEMP/ios-release-notes.md"
          {
            echo "Automated **unsigned** iOS build from \`master\` at ${GITHUB_SHA}."
            echo
            echo "The IPA carries no Apple signing certificate, so it cannot be installed from"
            echo "the App Store or by tapping it on a device. Install it with a sideloading tool"
            echo "(AltStore, Sideloadly, or Xcode \`Devices and Simulators\`), or add signing"
            echo "secrets to the workflow for a distributable build."
            echo
            echo "Push notifications additionally need \`ios/Runner/GoogleService-Info.plist\`"
            echo "added to \`Runner.xcodeproj\`; the build logs a warning while it is missing."
          } > "$NOTES_FILE"

          ASSETS=("$IPA#${BASE}-unsigned.ipa")
          if [ -n "$DSYMS" ]; then
            ASSETS+=("$DSYMS#${BASE}-dSYMs.zip")
          fi

          gh release create "$TAG" "${ASSETS[@]}" \
            --repo "${{ github.repository }}" \
            --title "Aveline Mobile iOS v${VERSION} (build #${RUN_NUMBER})" \
            --notes-file "$NOTES_FILE" \
            --target master


  # ---------------------------------------------------------------------------
  # Job 8: Observability Configuration Validation (Prometheus + Grafana + collector)
  #
  # `promtool check config` and `check rules` are the validators Prometheus itself runs at
  # startup, so a green job means the container will boot. Note that `check config` STATS the
  # files it references, so the scrape-token file must exist even for a syntax check.
  # ---------------------------------------------------------------------------
  observability-config:
    name: Observability Config Validation
    runs-on: ubuntu-latest
    needs: hygiene

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Prometheus config and rules
        run: |
          # The token is gitignored; mount a placeholder so `check config` can stat it.
          mkdir -p observability/prometheus/secrets
          echo "ci-placeholder-scrape-token" > observability/prometheus/secrets/scrape_token
          docker run --rm -v "$PWD/observability/prometheus:/etc/prometheus" \
            --entrypoint promtool prom/prometheus:v3.13.3 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/observability/prometheus:/etc/prometheus" \
            --entrypoint promtool prom/prometheus:v3.13.3 \
            check rules /etc/prometheus/rules/aveline.yml

      - name: Validate compose, collector, env and Grafana provisioning
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/validate_observability_config.py
