version: 2
updates:
  # GitHub Actions — keep CI actions up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Web dashboard (Vite / React). Locked with bun.lock, so the npm ecosystem cannot
  # update it: Dependabot reports "Dependabot's npm_and_yarn ecosystem cannot update
  # bun.lock" and aborts every job for this directory.
  - package-ecosystem: "bun"
    directory: "/frontend/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Flutter mobile app (Dart / pub).
  - package-ecosystem: "pub"
    directory: "/frontend/aveline_mobile"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # ASP.NET Core Web API.
  - package-ecosystem: "nuget"
    directory: "/Aveline.Api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Python agent service.
  - package-ecosystem: "pip"
    directory: "/agent-service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
