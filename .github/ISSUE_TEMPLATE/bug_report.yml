name: Bug Report
description: Report a bug or defect in Aveline
title: "[Bug]: "
labels: ["bug", "gitflow:bugfix"]
body:
  - type: markdown
    attributes:
      value: |
        Please provide clear details to reproduce and fix this issue.
  - type: dropdown
    id: slice
    attributes:
      label: Affected Component / Slice
      description: Which area is affected?
      options:
        - "Backend (Aveline.Api)"
        - "Agent Subsystem (FastAPI / LangGraph)"
        - "Flutter Mobile App"
        - "Web Dashboard"
        - "Database / Migrations (PostgreSQL + pgvector)"
        - "CI/CD / Tooling"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Start API with 'dotnet run'
        2. Send POST request to '/api/customers'
        3. Observe error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen instead?
    validations:
      required: true
