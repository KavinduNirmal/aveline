  /api/v1/orgs/{organizationId}/approvals/{id}/decision:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Approvals]
      summary: Decide an approval by verb in the body
      description: |
        SHIPPED. `BoutiqueApprovalDecision` (`approvals:approve`).

        **The verb decides the permission (T6 / Q14).** `reject` cancels the order and `revise`
        rewrites its discount, total and margin, so a body carrying either is refused with
        `403 order-manage-required` unless the caller also holds `orders:manage`
        (`BoutiqueOrderManage`). A route-level policy alone would leave this door open, because the
        verb travels in the body.
      operationId: processApprovalDecision
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalDecisionRequest" }
      responses:
        "200":
          description: The updated entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalQueueResponseDto" }
        "400":
          description: Invalid body or state transition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Permission denied, including `403 order-manage-required` for a reject/revise body
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          $ref: "#/components/responses/NotFound"

