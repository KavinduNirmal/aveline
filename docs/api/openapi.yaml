  # ---------------------------------------------------------------------------
  # Invitations
  # ---------------------------------------------------------------------------
  /api/v1/orgs/{organizationId}/invitations:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      tags: [Invitations]
      summary: Create a staff invitation
      description: |
        SHIPPED. `BoutiqueTeamManage` (`team:manage`) — the eight team routes moved off
        `settings:manage` in T0a so a manager can manage staff without also reaching Integrations
        and its gateway credentials. The invitable roles are exactly `org:boutique_supervisor`,
        `org:boutique_manager`, and `org:boutique_staff`; the owner role is not invitable.

        **Requires `Idempotency-Key`** (T6): a retried invite would otherwise mint a duplicate staff
        code. `validityHours` is clamped to `[1,720]` and `sendSummaryToOwner` is answered with a
        three-valued status (`NotRequested` | `Dispatched` | `NotSent`) — a requested notice that
        was not sent is reported, never silently dropped.
      operationId: createInvitation
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [boutiqueRole]
              properties:
                boutiqueRole: { $ref: "#/components/schemas/BoutiqueRole" }
                recipientEmail:
                  type: string
                  format: email
                  maxLength: 254
                  nullable: true
                validityHours:
                  type: integer
                  minimum: 1
                  maximum: 720
                  default: 24
                  description: Clamped to [1,720]; reaches the invitation's `expiresAt`.
                sendSummaryToOwner:
                  type: boolean
                  default: false
                  description: Dispatch a summary notice to the acting user. The response says whether it was sent.
      responses:
        "200":
          description: Invitation created. The code is returned here and in the email.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateInvitationResponse" }
        "400":
          description: Not an invitable role, or a missing/malformed `Idempotency-Key`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The `Idempotency-Key` was already used with a different request body
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: Invitation code store unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    get:
      tags: [Invitations]
      summary: List pending invitations
      operationId: listInvitations
      responses:
        "200":
          description: Pending invitations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PendingInvitationDto" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/invitations/bulk:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      tags: [Invitations]
      summary: Mint several staff invitation codes in one call
      description: |
        SHIPPED (E-10 / S-none; F-4). `BoutiqueTeamManage` (`team:manage`).

        **Requires `Idempotency-Key`.** A retried bulk create would otherwise mint a duplicate batch
        of staff codes; a replay returns the stored body with `Idempotency-Replayed: true`.

        **`count` is clamped to `[1,10]`** and `validityHours` to `[1,720]`. The response reports
        `requestedCount`, `createdCount` and `effectiveValidityHours` side by side so the clamp is
        visible rather than silent. The clamp is the control; a per-organization limiter
        (`Invitations:CreateRateLimit`, default 10/min) is the backstop.

        The optional summary notice carries **no codes**, and its outcome is three-valued:
        `NotRequested` | `Dispatched` | `NotSent`.
      operationId: createBulkInvitations
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [boutiqueRole, count]
              properties:
                boutiqueRole: { $ref: "#/components/schemas/BoutiqueRole" }
                count:
                  type: integer
                  minimum: 1
                  maximum: 10
                  description: Clamped to [1,10]; the response reports the requested and created counts.
                validityHours:
                  type: integer
                  minimum: 1
                  maximum: 720
                  default: 24
                sendSummaryToOwner:
                  type: boolean
                  default: false
      responses:
        "200":
          description: The minted codes plus what the clamp and the notice actually did
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkCreateInvitationResponse" }
        "400":
          description: Not an invitable role, or a missing/malformed `Idempotency-Key`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The `Idempotency-Key` was already used with a different request body
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: Invitation code store unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/orgs/{organizationId}/invitations/{invitationId}/revoke:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: invitationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Invitations]
      summary: Revoke a pending invitation
      operationId: revokeInvitation
      responses:
        "204":
          description: Revoked
        "400":
          description: The invitation was already accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/invitations/accept:
    post:
      tags: [Invitations]
      summary: Accept a staff invitation
      description: Rate limited per client IP (default 10/minute, `Invitations:AcceptRateLimit`).
      operationId: acceptInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, minLength: 1 }
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcceptInvitationResponse" }
        "400":
          description: Not acceptable, or recipient mismatch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Membership already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          $ref: "#/components/responses/RateLimited"

