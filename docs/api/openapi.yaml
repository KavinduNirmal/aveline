    # --- pricing recompute & billing entitlement statistics -------------------
    PricingRecomputeResult:
      type: object
      properties:
        ruleId: { type: string, format: uuid }
        processedRecords: { type: integer }
        affectedOrganizations: { type: integer }
        totalDelta: { type: number }
        recomputedAt: { type: string, format: date-time }

    ActiveCustomersResponse:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        activeCount: { type: integer }
        totalCount: { type: integer }
        asOf: { type: string, format: date-time }
        inactivityThresholdDays: { type: integer }

    StaffSeatsResponse:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        activeSeats: { type: integer }
        allowedSeats: { type: integer }
        roleBreakdown:
          type: object
          additionalProperties: { type: integer }
        asOf: { type: string, format: date-time }
    HomeFeedCaps:
      type: object
      properties:
        canComplete: { type: boolean }
        canAssign: { type: boolean }

    HomeFeedItem:
      type: object
      required: [id, sourceKey, domain, title, detail, actionLabel, doneMessage, contentHash, caps]
      properties:
        id:
          type: string
          description: Stable, opaque docket id. Addresses the docket, not the fact behind it.
        sourceKey:
          type: string
          description: Stable identifier of the underlying fact (inventory item, customer event, agent run). This is what a dismissal is keyed to.
        domain:
          type: string
          enum: [patron, logistics, wardrobe, commerce]
        title: { type: string, maxLength: 120 }
        detail: { type: string, maxLength: 300 }
        dueAtUtc:
          type: string
          format: date-time
          nullable: true
          description: The source of truth for "next". The client formats the clock from this.
        timeLabel:
          type: string
          nullable: true
          description: Optional pre-formatted fallback. Prefer formatting from dueAtUtc.
        actionLabel: { type: string, maxLength: 24 }
        doneMessage: { type: string, maxLength: 160 }
        contentHash:
          type: string
          description: Server hash of the docket's content. Echo only; the server recomputes it on dismissal.
        caps: { $ref: "#/components/schemas/HomeFeedCaps" }

    HomeFeedWindow:
      type: object
      properties:
        localDate: { type: string, format: date }
        timeZone: { type: string, description: The IANA zone the day was derived in. }

    HomeFeedDataQuality:
      type: object
      properties:
        wardrobeAvailable: { type: boolean }
        patronAvailable: { type: boolean }
        commerceAvailable: { type: boolean, description: False when the caller's role lacks stats:view:agent or no run is paused. }
        logisticsAvailable: { type: boolean, description: False until a delivery/intake writer exists. }

    HomeFeedCounts:
      type: object
      properties:
        total: { type: integer }
        overdue: { type: integer }
        byDomain:
          type: object
          additionalProperties: { type: integer }

    HomeFeed:
      type: object
      required: [generatedAt, window, dataQuality, items, counts]
      properties:
        generatedAt: { type: string, format: date-time }
        window: { $ref: "#/components/schemas/HomeFeedWindow" }
        dataQuality: { $ref: "#/components/schemas/HomeFeedDataQuality" }
        items:
          type: array
          items: { $ref: "#/components/schemas/HomeFeedItem" }
        counts: { $ref: "#/components/schemas/HomeFeedCounts" }

    DismissFocusTaskRequest:
      type: object
      required: [sourceKey, domain, decision]
      properties:
        sourceKey: { type: string, maxLength: 200 }
        domain: { type: string, enum: [patron, logistics, wardrobe, commerce] }
        decision: { type: string, enum: [acknowledge, approve, reject, markReady, signOff] }
        contentHash: { type: string, nullable: true, description: Echoed for audit; the server recomputes it. }
        note: { type: string, maxLength: 500, nullable: true }

    FocusDismissalResponse:
      type: object
      properties:
        dismissalId: { type: string, format: uuid }
        sourceKey: { type: string }
        domain: { type: string }
        decision: { type: string }
        dismissedAtUtc: { type: string, format: date-time }
        counts: { $ref: "#/components/schemas/HomeFeedCounts" }

    CustomerBookItem:
      type: object
      required: [customerId, status, phoneNumber]
      properties:
        customerId: { type: string, format: uuid }
        fullName: { type: string, nullable: true }
        nickname: { type: string, nullable: true }
        level:
          type: string
          nullable: true
          enum: [vip, level3, level2, level1, null]
          description: The boutique's own grade, or null when nobody has graded this client.
        status: { type: string, enum: [new, returning, vip, dormant] }
        phoneNumber: { type: string }
        lastVisitAtUtc: { type: string, format: date-time, nullable: true }
        visitCount: { type: integer }
        totalSpent: { type: number }

    CustomerBookResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CustomerBookItem" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    CustomerHighlight:
      type: object
      required: [customerId, name, activity]
      properties:
        customerId: { type: string, format: uuid }
        name: { type: string }
        level: { type: string, nullable: true, enum: [vip, level3, level2, level1, null] }
        activity: { type: string, maxLength: 160, description: Generated from a real Customer_Interactions row. }
        lastActivityAtUtc: { type: string, format: date-time, nullable: true }

    CustomerHighlightsResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CustomerHighlight" }

    CreateWalkInCustomerRequest:
      type: object
      required: [fullName]
      properties:
        fullName: { type: string, maxLength: 200 }
        phoneNumber: { type: string, maxLength: 50, nullable: true, description: Optional; without one the client cannot be de-duplicated against a future identify. }
        nickname: { type: string, nullable: true, description: Stored as a customer preference. }
        source: { type: string, enum: [counter_walkin, phone, whatsapp, instagram], default: counter_walkin }

    ErrorEnvelope:
      type: object
      description: |
        The house error body: a human-readable `message`, plus a machine-readable `code` on the
        routes that state one.
      properties:
        message: { type: string }
        code: { type: string }
      required: [message]

    TenantTakings:
      type: object
      description: |
        The reduced takings read (E-13). Exactly two money figures, and the field set is a contract:
        a test enumerates the serialised names and fails if anything else appears.
      properties:
        window: { type: string }
        windowFrom: { type: string, format: date-time }
        windowTo: { type: string, format: date-time }
        generatedAt: { type: string, format: date-time }
        currency: { type: string }
        collected:
          type: number
          format: decimal
          nullable: true
          description: Verified money minus refunds.
        billedUnconfirmed:
          type: number
          format: decimal
          nullable: true
          description: Derived billed value, with no evidence that money moved.
        paymentRowsPresent: { type: boolean }
        ledgerBackfilled: { type: boolean }
        dataQuality: { $ref: "#/components/schemas/TenantDashboardDataQuality" }

    TenantDashboardDataQuality:
      type: object
      description: The tenant dashboard's own data-quality vocabulary — the seventh in the API.
      properties:
        paymentRowsPresent: { type: boolean }
        orderCostsComplete: { type: boolean }
        incomeLedgerBackfilled: { type: boolean }
        usageMetricsAvailable: { type: boolean }
        refundAndOutstandingExcludedFromCollected: { type: boolean }
        checkedAt: { type: string, format: date-time }
        notes:
          type: array
          items: { type: string }

    TenantSalesKpis:
      type: object
      description: |
        Billed value, not cash: these come from orders, which say what was sold rather than what was
        collected. Every absent measure is `null`, never `0`.
      properties:
        grossOrderValue: { type: number, format: decimal, nullable: true }
        orderCount: { type: integer }
        averageOrderValue: { type: number, format: decimal, nullable: true, description: "Null when no order exists; an average over nothing does not exist." }
        discountTotal: { type: number, format: decimal, nullable: true }
        marginAmount: { type: number, format: decimal, nullable: true }
        marginPercent: { type: number, format: decimal, nullable: true, description: "Null when gross is zero." }
        marginCostsComplete:
          type: boolean
          description: |
            False when any contributing order carries a zero `WholesaleCost`. That cost is
            caller-supplied rather than read from the inventory record, so the margin is only as
            trustworthy as what somebody typed.

    TenantCashKpis:
      type: object
      description: Three separate figures, so an expiring request is never a receivable and a refund is never netted invisibly.
      properties:
        collected: { type: number, format: decimal, nullable: true }
        outstanding: { type: number, format: decimal, nullable: true }
        refunded: { type: number, format: decimal, nullable: true }
        refundCount: { type: integer }

    TenantCustomerKpis:
      type: object
      properties:
        activeCount: { type: integer }
        totalCount: { type: integer }
        newInWindow: { type: integer }
        repeatCount: { type: integer, description: "Clients with two or more recorded visits." }
        inactivityThresholdDays: { type: integer, description: "90, per ADR-010." }

    TenantCatalogKpis:
      type: object
      properties:
        itemCount: { type: integer }
        lowStockCount: { type: integer }
        outOfStockCount: { type: integer }
        stockValueAtCost: { type: number, format: decimal, nullable: true, description: "Labelled at cost, never retail value." }

    TenantTeamKpis:
      type: object
      properties:
        activeSeats: { type: integer }
        allowedSeats: { type: integer, description: "Deliberately 0 in this aggregate; the allowance lives on the entitlements surface." }
        pendingInvitations: { type: integer }
        roleBreakdown:
          type: object
          additionalProperties: { type: integer }

    TenantUsageKpis:
      type: object
      properties:
        blossomUsed: { type: number, format: decimal, nullable: true }
        monthlyBlossomLimit: { type: number, format: decimal, nullable: true }
        blossomRemaining: { type: number, format: decimal, nullable: true }
        percentUsed: { type: number, format: decimal, nullable: true, description: "Null when the limit is zero." }

    TenantOperationsKpis:
      type: object
      properties:
        pendingApprovals: { type: integer }
        openConversations: { type: integer }
        scheduledDeliveries: { type: integer }

    TenantDashboardSummary:
      type: object
      properties:
        window: { type: string }
        windowFrom: { type: string, format: date-time }
        windowTo: { type: string, format: date-time }
        generatedAt: { type: string, format: date-time }
        currency: { type: string }
        sales: { $ref: "#/components/schemas/TenantSalesKpis" }
        cash: { $ref: "#/components/schemas/TenantCashKpis" }
        customers: { $ref: "#/components/schemas/TenantCustomerKpis" }
        catalog: { $ref: "#/components/schemas/TenantCatalogKpis" }
        team: { $ref: "#/components/schemas/TenantTeamKpis" }
        usage: { $ref: "#/components/schemas/TenantUsageKpis" }
        operations: { $ref: "#/components/schemas/TenantOperationsKpis" }
        dataQuality: { $ref: "#/components/schemas/TenantDashboardDataQuality" }

    TenantRevenueBucket:
      type: object
      properties:
        bucketStart: { type: string, format: date-time }
        grossOrderValue: { type: number, format: decimal, nullable: true, description: "Null when no order exists, so the client renders a gap." }
        collected: { type: number, format: decimal, nullable: true }
        refunded: { type: number, format: decimal, nullable: true }
        isPartial: { type: boolean }

    TenantRevenueSeries:
      type: object
      properties:
        bucket: { type: string, enum: [day, week, month] }
        windowFrom: { type: string, format: date-time }
        windowTo: { type: string, format: date-time }
        windowCapped: { type: boolean }
        points:
          type: array
          items: { $ref: "#/components/schemas/TenantRevenueBucket" }

    TenantTopItem:
      type: object
      properties:
        itemName: { type: string }
        quantity: { type: integer }
        revenue: { type: number, format: decimal, nullable: true }

    TenantTopItems:
      type: object
      properties:
        windowFrom: { type: string, format: date-time }
        windowTo: { type: string, format: date-time }
        limit: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/TenantTopItem" }

    BillingPeriod:
      type: object
      description: |
        E-12 / S-62. One billing period: the Blossom account, its plan and the top-ups inside it.

        `planListPriceLkr` is `null` — never `0` — whenever no price is configured, because
        `OrganizationSubscription.PriceLkr` is never assigned in the product and a rendered zero would
        be a fabricated plan price rather than a free plan.
      properties:
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        isClosed: { type: boolean }
        planTier:
          type: [string, "null"]
          description: From the day's subscription snapshot, or the live row for the current period.
        hasSubscriptionRow: { type: boolean }
        monthlyBlossomLimit: { type: number, format: decimal }
        blossomGranted: { type: number, format: decimal }
        blossomAdjusted: { type: number, format: decimal }
        blossomUsed: { type: number, format: decimal }
        blossomRemaining: { type: number, format: decimal }
        planListPriceLkr:
          type: [number, "null"]
          format: decimal
          description: Null whenever the stored price is zero, which today is every subscription.
        subscriptionPricesConfigured: { type: boolean }
        topUpBlossoms: { type: number, format: decimal }
        topUpCount: { type: integer }

    TopUpPack:
      type: object
      description: E-11 / S-63. A purchasable Blossom top-up pack from the price book.
      properties:
        skuCode: { type: string }
        blossomQuantity: { type: number, format: decimal }
        priceLkr: { type: number, format: decimal, description: The published LKR list price. No provider is connected, so a purchase records a grant, not a charge. }
        currency: { type: string, description: Always `LKR`; the price book stores LKR and no currency column exists. }

    BoutiqueIncomeWindow:
      type: object
      properties:
        from: { type: string, format: date-time, description: The effective window start, after any cap. }
        to: { type: string, format: date-time }
        generatedAt: { type: string, format: date-time }

    BoutiqueIncomeDataQuality:
      type: object
      description: |
        The tenant income surface's own data-quality vocabulary — the sixth in the API, deliberately
        not a reuse of the revenue family's.
      properties:
        paymentRowsPresent:
          type: boolean
          description: |
            False when the boutique has no `Payment` rows at all, which is the single most likely
            reason a real shop's cash figures read zero. Stated rather than left for the owner to
            read as a measurement of zero.
        orderCostsComplete: { type: boolean }
        incomeLedgerBackfilled:
          type: boolean
          description: True while the register contains only rows the reconciliation job repaired.
        refundAndOutstandingExcludedFromCollected: { type: boolean }
        checkedAt: { type: string, format: date-time }
        notes:
          type: array
          items: { type: string }

    BoutiqueIncomeTotals:
      type: object
      description: Window totals over the whole window, not the page. Each kind stated separately.
      properties:
        saleTotal: { type: number, format: decimal }
        paymentTotal: { type: number, format: decimal }
        refundTotal: { type: number, format: decimal }
        adjustmentTotal: { type: number, format: decimal }

    BoutiqueIncomeReconciliation:
      type: object
      description: |
        The two-basis reconciliation. `derivedTotal` and `verifiedTotal` are never summed into one
        unlabelled figure: a derived total is billed value with no evidence of collection, a verified
        total is money taken, and `unverifiedGap` is the distance between them.
      properties:
        verifiedTotal: { type: number, format: decimal }
        derivedTotal: { type: number, format: decimal }
        refundTotal: { type: number, format: decimal }
        netVerified: { type: number, format: decimal, description: "verifiedTotal − refundTotal" }
        unverifiedGap: { type: number, format: decimal, description: "Equal to derivedTotal. The headline honesty number, not an error." }
        isReconciled: { type: boolean, description: "True only when derivedTotal is zero." }

    BoutiqueIncomeEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [Sale, PaymentReceived, Refund, Adjustment] }
        sourceKind: { type: string, enum: [CounterWalkIn, OrderPayment, OrderSettlement, Refund, System] }
        sourceRef: { type: string, nullable: true, description: "The dedup identity, unique per organization within its source kind." }
        chargeBasis: { type: string, enum: [Derived, Verified] }
        status: { type: string, enum: [Recorded, Voided] }
        currency: { type: string, maxLength: 3 }
        amount: { type: number, format: decimal, description: "Always positive; the sign is applied by the reader from `kind`." }
        reason: { type: string, maxLength: 500 }
        occurredAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
        orderId: { type: string, format: uuid, nullable: true }
        customerId: { type: string, format: uuid, nullable: true }
        paymentId: { type: string, format: uuid, nullable: true }
        recordedByUserId:
          type: string
          format: uuid
          nullable: true
          description: |
            Who recorded the entry. Null only for the flow-written sources (`OrderPayment`,
            `OrderSettlement`) and `System`: the counter sources always name a person.

    BoutiqueIncomeLedgerPage:
      type: object
      properties:
        window: { $ref: "#/components/schemas/BoutiqueIncomeWindow" }
        items:
          type: array
          items: { $ref: "#/components/schemas/BoutiqueIncomeEntry" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        windowCapped: { type: boolean }
        totals: { $ref: "#/components/schemas/BoutiqueIncomeTotals" }
        reconciliation: { $ref: "#/components/schemas/BoutiqueIncomeReconciliation" }
        currency: { type: string }
        dataQuality: { $ref: "#/components/schemas/BoutiqueIncomeDataQuality" }

    BoutiqueIncomeKindTotal:
      type: object
      properties:
        kind: { type: string }
        total: { type: number, format: decimal }
        count: { type: integer }

    BoutiqueIncomePaymentMethodTotal:
      type: object
      properties:
        paymentMethod: { type: string }
        total: { type: number, format: decimal }
        count: { type: integer }

    BoutiqueIncomeAccounts:
      type: object
      properties:
        window: { $ref: "#/components/schemas/BoutiqueIncomeWindow" }
        items:
          type: array
          items: { $ref: "#/components/schemas/BoutiqueIncomeKindTotal" }
        byPaymentMethod:
          type: array
          items: { $ref: "#/components/schemas/BoutiqueIncomePaymentMethodTotal" }
        reconciliation: { $ref: "#/components/schemas/BoutiqueIncomeReconciliation" }
        currency: { type: string }
        dataQuality: { $ref: "#/components/schemas/BoutiqueIncomeDataQuality" }

    TenantCustomerDetail:
      type: object
      description: |
        The tenant-safe client record (E-6). Deliberately not the internal customer shape: no
        memory, no extracted AI context and no internal-token field reaches a staff device.
      properties:
        customerId: { type: string, format: uuid }
        fullName: { type: string, nullable: true }
        nickname: { type: string, nullable: true, description: Stored as a customer preference. }
        phoneNumber: { type: string, nullable: true }
        email: { type: string, nullable: true }
        level: { type: string, nullable: true, enum: [vip, level3, level2, level1, null] }
        status: { type: string, description: Derived by CustomerLoyaltyService from spend, visits and recency. }
        totalSpent: { type: number, format: decimal }
        visitCount: { type: integer }
        lastVisitAtUtc: { type: string, format: date-time, nullable: true }
        loyaltyTierIsDerived:
          type: integer
          const: 1
          description: |
            Always `1`. Present so the client cannot render an editable tier control: the tier is
            derived server-side, never authored by the UI.
        createdAtUtc: { type: string, format: date-time }
        updatedAtUtc: { type: string, format: date-time, nullable: true }
        interactionCount: { type: integer }
        tags:
          type: array
          items: { type: string }

    UpdateCustomerRequest:
      type: object
      description: |
        The writable subset of a client's record (E-7). `status` is deliberately absent: it is
        derived by the loyalty rule, so a client-supplied value is ignored rather than honoured.
      properties:
        fullName: { type: string, maxLength: 200, nullable: true }
        nickname: { type: string, nullable: true }
        phoneNumber:
          type: string
          nullable: true
          description: |
            Normalised to E.164. A number that is not a recognised Sri Lankan form is `400`; one
            another client in the same organization holds is `409 customer-phone-conflict`.
        email: { type: string, maxLength: 255, nullable: true }
        level: { type: string, maxLength: 16, nullable: true, description: An empty string clears the grade. }

    CustomerInteractionItem:
      type: object
      properties:
        interactionId: { type: string, format: uuid }
        occurredAtUtc: { type: string, format: date-time }
        channel: { type: string, enum: [in_person, phone, whatsapp, instagram] }
        direction: { type: string, enum: [inbound, outbound] }
        note: { type: string, nullable: true }
        countedAsVisit:
          type: boolean
          description: True only for an inbound, in-person interaction.

    CustomerInteractionPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CustomerInteractionItem" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    CustomerCreated:
      type: object
      properties:
        customerId: { type: string, format: uuid }
        fullName: { type: string, nullable: true }
        level: { type: string, nullable: true, enum: [vip, level3, level2, level1, null] }
        status: { type: string, enum: [new, returning, vip, dormant] }
        consentStatus: { type: string, enum: [pending, granted, revoked, unknown] }
        createdAtUtc: { type: string, format: date-time }
        duplicateOfCustomerId:
          type: string
          format: uuid
          nullable: true
          description: Set when the server matched an existing record instead of creating one.

    RecordCustomerInteractionRequest:
      type: object
      required: [occurredAtUtc, channel]
      properties:
        occurredAtUtc: { type: string, format: date-time }
        channel: { type: string, enum: [in_person, phone, whatsapp, instagram] }
        direction: { type: string, enum: [inbound, outbound], default: inbound }
        note: { type: string, maxLength: 4000, nullable: true }
        purchaseTotal: { type: number, nullable: true, minimum: 0, description: When present, feeds TotalSpent and the loyalty rule. }

    VisitReceipt:
      type: object
      properties:
        visitId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        occurredAtUtc: { type: string, format: date-time }
        channel: { type: string }
        countedAsVisit: { type: boolean }
        visitCountAfter: { type: integer }
        lastVisitAtUtcAfter: { type: string, format: date-time, nullable: true }
        tierAfter: { type: string, enum: [new, returning, vip, dormant] }
        blossomsCharged: { type: number, description: Always 0; a visit is not billable. }
