openapi: 3.0.3

info:
  title: Aveline API
  version: "1.0.0"
  description: |
    Aveline's public HTTP API — a boutique concierge platform covering billing,
    entitlements, statistics, users, and organizations.

    ## Versioning
    All user-facing routes are prefixed `/api/v1`. There is no versioning library:
    the prefix is a literal route group. Additive changes do not bump the version;
    clients MUST ignore unknown fields.

    ## Authentication
    Three schemes:
    - `bearerAuth` — Clerk JWT. Default for every user-facing route.
    - `internalToken` — `X-Internal-Token` shared secret. `/internal/**` only. NOT for frontend clients.
    - `apiKeyAuth` — `X-Api-Key`. Customer server-to-server integrations on the Rose plan.

    A route uses exactly one scheme.

    ## Authorization
    Two layers, failing closed:
    1. A named policy for the required permission or role.
    2. For any route containing `{organizationId}`, an `Active` OrganizationMembership
       whose boutique role grants the required permission. A stale JWT cannot cross organizations.

    ## Errors
    A single global exception handler (`GlobalExceptionHandler`, registered as the
    outermost middleware at `Program.cs:99`) turns every unhandled exception into a
    stable `{ status, message, traceId }` `500` body. The shapes are:
    - `400` field validation -> `ValidationProblemDetails`
    - `400`/`404`/`409`/`502`/`503` -> `ErrorResponse` (`{ message }`)
    - `401` -> empty body
    - `403` -> empty body, or `ProblemDetails` for the account-state gate
    - `429` -> `ErrorResponse`, or a `QuotaExceededError` for quota rejections
    - `500` -> `{ status, message, traceId }` (the detail is log-only)

    ## Pagination
    `page` (default 1, minimum 1) and `pageSize` (default 50, 1..200). Responses use
    the envelope `{ items, total, page, pageSize }`. The property is `total`, not `totalCount`.

    ## Idempotency
    Money-shaped POSTs require an `Idempotency-Key` header. A replay with the same key
    and body returns the original response with `Idempotency-Replayed: true`. A replay
    with a different body returns `409` with `code: idempotency-key-reuse`. Concurrent
    requests carrying the same key are serialised: the first executes and the rest replay
    its response, or receive `409` with `code: idempotency-key-in-flight` if the original
    is still running when the wait budget expires.

    ## Statistics data quality
    Several statistics depend on instrumentation that is not yet complete. Every
    statistics response carries a `dataQuality` object. A client MUST NOT render a
    metric whose corresponding flag is `false` as if it were a real zero.
  contact:
    name: Aveline backend
  license:
    name: Proprietary

servers:
  - url: http://localhost:5091
    description: Local development
  - url: https://api.aveline.app
    description: Production

tags:
  - name: Auth
    description: Claims introspection.
  - name: Users
    description: The caller's own profile, devices, and sessions.
  - name: Admin Users
    description: Cross-organization user administration. Aveline team only.
  - name: Organizations
    description: Boutique CRUD, settings, and membership.
  - name: Invitations
    description: Staff invitation lifecycle.
  - name: Onboarding
    description: Six-step owner onboarding wizard.
  - name: Notifications
    description: Per-user notifications.
  - name: Conversations
    description: The Salon — unified agent-to-staff conversation inbox.
  - name: Integrations
    description: Per-organization integration credentials and health.
  - name: Billing
    description: Blossom balance, statement, top-ups, and plan.
  - name: Admin Billing
    description: Blossom credit, debit, revoke, and statement. Aveline team only.
  - name: Admin Organizations
    description: Cross-organization administration search and entitlement overrides. Aveline team only.
  - name: Pricing
    description: Blossom conversion rules and the LKR price book. Aveline team only.
  - name: API Keys
    description: Customer API key management.
  - name: Agent Statistics
    description: Agentic workflow statistics.
  - name: API Statistics
    description: API consumption statistics.
  - name: System Statistics
    description: Platform health, metrics, and alerts. Aveline team only.
  - name: Audit
    description: Audit log. Aveline team only.
  - name: Health
    description: Liveness, readiness, and metrics.

security:
  - bearerAuth: []

paths:

  # ---------------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------------
  /api/v1/auth/claims:
    get:
      tags: [Auth]
      summary: Read the caller's raw Clerk claims and resolved Aveline state
      description: |
        Returns the raw JWT claims plus the authoritative `accountState`, `userRole`,
        and `organizationRole` resolved server-side from the Aveline read model.
        Use this to debug authorization; do not gate UI on client-decoded JWT claims.
      operationId: getAuthClaims
      responses:
        "200":
          description: Claims resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthClaimsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------------------------------------------------------------------------
  # Users
  # ---------------------------------------------------------------------------
  /api/v1/users/me:
    get:
      tags: [Users]
      summary: Read the caller's Aveline user record
      operationId: getCurrentUser
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Users]
      summary: Update the caller's profile
      description: Phase 3. Only the supplied fields are changed.
      operationId: updateCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDto"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Users]
      summary: Delete the caller's account (soft delete)
      description: |
        Phase 3. Sets `deletedAt`, `isActive=false`, `accountState=Suspended`,
        revokes all memberships and API keys, and invalidates the cached
        authorization snapshot. Telemetry rows are retained but de-identified.
      operationId: deleteCurrentUser
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/users/me/devices:
    post:
      tags: [Users]
      summary: Register a push notification device token
      operationId: registerDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform]
              properties:
                token:
                  type: string
                  minLength: 1
                platform:
                  $ref: "#/components/schemas/DevicePlatform"
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  platform: { $ref: "#/components/schemas/DevicePlatform" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/users/me/devices/{token}:
    delete:
      tags: [Users]
      summary: Unregister a push notification device token
      operationId: unregisterDevice
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Unregistered
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/users/me/sessions:
    get:
      tags: [Users]
      summary: List the caller's active sessions
      description: Phase 3. Proxied from the Clerk Backend API. Aveline does not store sessions.
      operationId: listSessions
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SessionSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/users/me/sessions/revoke-all:
    post:
      tags: [Users]
      summary: Revoke all sessions except optionally the current one
      description: Phase 3.
      operationId: revokeAllSessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                exceptCurrent: { type: boolean, default: true }
      responses:
        "204":
          description: Revoked
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------------------------------------------------------------------------
  # Admin users
  # ---------------------------------------------------------------------------
  /api/v1/admin/users:
    get:
      tags: [Admin Users]
      summary: Search users across organizations
      description: Phase 3. Requires `admin:users:read`.
      operationId: adminListUsers
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
          description: Matches email, name, or username, case-insensitively
        - name: accountState
          in: query
          schema: { $ref: "#/components/schemas/AccountState" }
        - name: organizationId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/users/{userId}/state:
    patch:
      tags: [Admin Users]
      summary: Change a user's account state
      description: Phase 3. Requires `admin:users:manage`. Invalidates the auth cache immediately.
      operationId: adminSetUserState
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountState]
              properties:
                accountState:
                  type: string
                  enum: [OnboardingPending, Active, Suspended]
                reason:
                  type: string
                  description: Optional justification persisted on the audit row.
                  minLength: 10
                  maxLength: 500
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDto"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Admin access requests (existing)
  # ---------------------------------------------------------------------------
  /api/v1/admin/requests:
    get:
      tags: [Admin Users]
      summary: List pending administrator access requests
      description: |
        SHIPPED. Requires the `AdminReview` policy (`moderator`, `admin`, or
        `owner`). Backs the admin sign-up review flow from issue #59.
      operationId: listAdminRequests
      responses:
        "200":
          description: Pending requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminApprovalRequestSummary" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Admin Users]
      summary: Submit an administrator access request
      description: |
        SHIPPED. Requires authentication only; the identity is read from the JWT,
        not the body. Approval by an existing administrator grants the `admin`
        role through the Clerk Backend API.
      operationId: submitAdminRequest
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminApprovalRequestSummary" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/admin/requests/{requestId}/approve:
    parameters:
      - $ref: "#/components/parameters/AdminRequestId"
    post:
      tags: [Admin Users]
      summary: Approve an administrator access request
      description: SHIPPED. Requires the `AdminReview` policy. Grants the `admin` role via Clerk.
      operationId: approveAdminRequest
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminApprovalRequestSummary" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The request was already decided
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "502":
          description: The Clerk Backend API call failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/admin/requests/{requestId}/reject:
    parameters:
      - $ref: "#/components/parameters/AdminRequestId"
    post:
      tags: [Admin Users]
      summary: Reject an administrator access request
      description: SHIPPED. Requires the `AdminReview` policy.
      operationId: rejectAdminRequest
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminApprovalRequestSummary" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The request was already decided
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ---------------------------------------------------------------------------
  # Organizations
  # ---------------------------------------------------------------------------
  /api/v1/orgs:
    post:
      tags: [Organizations]
      summary: Create a boutique
      description: |
        `clerkOrgId` is deliberately NOT accepted — it is derived server-side from
        the JWT `org_id` claim so a caller cannot bind a boutique to a Clerk
        organization they do not control.
      operationId: createOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 200 }
                slug: { type: string, maxLength: 100, nullable: true }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrganizationResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          description: User record does not exist in the Aveline database
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Slug already in use
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/orgs/my:
    get:
      tags: [Organizations]
      summary: List the caller's organization memberships
      operationId: listMyOrganizations
      responses:
        "200":
          description: Memberships
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrganizationMembershipView" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/by-slug/{slug}:
    get:
      tags: [Organizations]
      summary: Resolve a boutique by slug
      description: |
        Returns `404` both when the slug does not exist and when the caller is not a
        member, deliberately, to prevent boutique-existence enumeration.
      operationId: getOrganizationBySlug
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Boutique and the caller's membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationProfileWithMembershipDto"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{organizationId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Organizations]
      summary: Read a boutique profile
      operationId: getOrganization
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationProfileDto" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Organizations]
      summary: Update boutique settings
      description: |
        Phase 3. Requires `settings:manage` on the organization. The AI-context
        fields (`brandVoice`, `businessRules`, `preferredColorsFabrics`,
        `customerPreferences`) are additionally gated by the plan entitlement
        `ai.customContext`.
      operationId: updateOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationProfileDto" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Slug collision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/orgs/{organizationId}/settings:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Organizations]
      summary: Read boutique settings and resolved entitlements
      description: Phase 3. Requires `settings:manage`.
      operationId: getOrganizationSettings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationSettingsResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/members:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Organizations]
      summary: List organization members
      description: Phase 3. Requires `settings:manage`.
      operationId: listOrganizationMembers
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/MembershipStatus" }
        - name: role
          in: query
          schema: { $ref: "#/components/schemas/BoutiqueRole" }
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberPage" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/UserId"
    patch:
      tags: [Organizations]
      summary: Change a member's boutique role
      description: |
        Phase 3. Requires `settings:manage`. Guards:
        - a user may not change their own role (`409 self-role-change`);
        - only `org:boutique_owner` may grant or revoke `org:boutique_owner` (`403 owner-role-requires-owner`);
        - the last active owner may not be demoted (`409 last-owner`).
      operationId: changeMemberRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [boutiqueRole]
              properties:
                boutiqueRole: { $ref: "#/components/schemas/BoutiqueRole" }
      responses:
        "200":
          description: Updated membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipView" }
        "400":
          description: Invalid role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Role change blocked by a guard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      tags: [Organizations]
      summary: Remove a member from the organization
      operationId: removeMember
      responses:
        "204":
          description: Removed
        "400":
          description: Cannot manage the owner's own membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{organizationId}/members/{userId}/suspend:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [Organizations]
      summary: Suspend a member
      operationId: suspendMember
      responses:
        "200":
          description: Updated membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipView" }
        "400":
          description: Cannot manage the owner's own membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{organizationId}/members/{userId}/activate:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [Organizations]
      summary: Activate a member
      operationId: activateMember
      responses:
        "200":
          description: Updated membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipView" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Invitations
  # ---------------------------------------------------------------------------
  /api/v1/orgs/{organizationId}/invitations:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      tags: [Invitations]
      summary: Create a staff invitation
      description: |
        Requires `settings:manage`. The invitable roles are exactly
        `org:boutique_supervisor`, `org:boutique_manager`, and `org:boutique_staff`;
        the owner role is not invitable.
      operationId: createInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [boutiqueRole]
              properties:
                boutiqueRole: { $ref: "#/components/schemas/BoutiqueRole" }
                recipientEmail:
                  type: string
                  format: email
                  maxLength: 254
                  nullable: true
      responses:
        "200":
          description: Invitation created. The code is returned here and in the email.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateInvitationResponse" }
        "400":
          description: Not an invitable role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Invitation code store unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    get:
      tags: [Invitations]
      summary: List pending invitations
      operationId: listInvitations
      responses:
        "200":
          description: Pending invitations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PendingInvitationDto" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/invitations/{invitationId}/revoke:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: invitationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Invitations]
      summary: Revoke a pending invitation
      operationId: revokeInvitation
      responses:
        "204":
          description: Revoked
        "400":
          description: The invitation was already accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/invitations/accept:
    post:
      tags: [Invitations]
      summary: Accept a staff invitation
      description: Rate limited per client IP (default 10/minute, `Invitations:AcceptRateLimit`).
      operationId: acceptInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, minLength: 1 }
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcceptInvitationResponse" }
        "400":
          description: Not acceptable, or recipient mismatch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Membership already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          $ref: "#/components/responses/RateLimited"

  # ---------------------------------------------------------------------------
  # Onboarding
  # ---------------------------------------------------------------------------
  /api/v1/onboarding/status:
    get:
      tags: [Onboarding]
      summary: Read onboarding progress
      operationId: getOnboardingStatus
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingStatusResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/onboarding/owner:
    post:
      tags: [Onboarding]
      summary: Submit boutique details (step 3)
      operationId: saveBoutiqueDetails
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveBoutiqueDetailsRequest" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingOrganizationDto" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/onboarding/plan:
    post:
      tags: [Onboarding]
      summary: Select a subscription plan (step 4)
      description: Demo mode — no payment is taken.
      operationId: selectPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planTier]
              properties:
                planTier: { $ref: "#/components/schemas/PlanTier" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingOrganizationDto" }
        "400":
          description: Boutique details must be submitted first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/onboarding/customize:
    post:
      tags: [Onboarding]
      summary: Save AI context (step 5, tier-gated)
      operationId: saveAiCustomization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveAiCustomizationRequest" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingOrganizationDto" }
        "400":
          description: A field is not available on the selected plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/onboarding/complete:
    post:
      tags: [Onboarding]
      summary: Complete onboarding (step 6)
      description: |
        Activates the organization and user, provisions the `UsageAccount` Blossom
        allowance for the current period, and warms up the agent service. Agent
        warm-up failure is non-fatal and reported as `agentWarmedUp: false`.
      operationId: completeOnboarding
      responses:
        "200":
          description: Completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompleteOnboardingResponse" }
        "400":
          description: Prerequisite steps incomplete
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------------------------------------------------------------------------
  # Notifications
  # ---------------------------------------------------------------------------
  /api/v1/notifications:
    get:
      tags: [Notifications]
      summary: List the caller's notifications
      operationId: listNotifications
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: unreadOnly
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPage" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Count unread notifications
      operationId: getUnreadNotificationCount
      responses:
        "200":
          description: Count
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer, minimum: 0 }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/notifications/{id}:
    parameters:
      - $ref: "#/components/parameters/NotificationId"
    get:
      tags: [Notifications]
      summary: Read one notification
      operationId: getNotification
      responses:
        "200":
          description: Notification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserNotificationDto" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Notifications]
      summary: Dismiss a notification
      operationId: dismissNotification
      responses:
        "204":
          description: Dismissed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/notifications/{id}/read:
    parameters:
      - $ref: "#/components/parameters/NotificationId"
    patch:
      tags: [Notifications]
      summary: Mark a notification as read (idempotent)
      operationId: markNotificationRead
      responses:
        "204":
          description: Marked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark all notifications as read (idempotent)
      operationId: markAllNotificationsRead
      responses:
        "200":
          description: Marked
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------------------------------------------------------------------------
  # Conversations
  # ---------------------------------------------------------------------------
  /api/v1/orgs/{organizationId}/conversations:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Conversations]
      summary: List conversations
      operationId: listConversations
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationPage" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Conversations]
      summary: Create a conversation
      operationId: createConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customerId: { type: string, format: uuid, nullable: true }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationDto" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/conversations/{conversationId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/ConversationId"
    get:
      tags: [Conversations]
      summary: Read a conversation
      operationId: getConversation
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationDto" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{organizationId}/conversations/{conversationId}/messages:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/ConversationId"
    get:
      tags: [Conversations]
      summary: List messages
      operationId: listMessages
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: around
          in: query
          schema: { type: string, format: uuid, nullable: true }
          description: Deep-link anchor; returns a window centred on this message id
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessagePage" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Conversations]
      summary: Send a staff message
      operationId: sendMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1 }
      responses:
        "200":
          description: Message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageDto" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{organizationId}/conversations/{conversationId}/select-customer:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/ConversationId"
    post:
      tags: [Conversations]
      summary: Bind a customer to a conversation
      operationId: selectConversationCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId]
              properties:
                customerId: { type: string, format: uuid }
                query: { type: string, nullable: true }
      responses:
        "200":
          description: Bound
        "400":
          description: A customerId is required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{organizationId}/conversations/{conversationId}/messages/{messageId}/sign-off:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/ConversationId"
      - name: messageId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Conversations]
      summary: Decide a sign-off request
      description: |
        The `contentHash` must match the hash of the message as the approver saw it.
        A mismatch is rejected so an approval cannot be applied to edited content.
      operationId: decideSignOff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved, contentHash]
              properties:
                approved: { type: boolean }
                contentHash: { type: string, minLength: 1 }
      responses:
        "200":
          description: Decided
        "400":
          description: Content hash missing or mismatched
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Integrations
  # ---------------------------------------------------------------------------
  /api/v1/orgs/{organizationId}/integrations:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Integrations]
      summary: List integrations and their health
      operationId: listIntegrations
      responses:
        "200":
          description: Integrations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationListResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/integrations/{type}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: type
        in: path
        required: true
        schema: { $ref: "#/components/schemas/IntegrationType" }
    put:
      tags: [Integrations]
      summary: Configure an integration
      description: |
        Credentials are encrypted at rest with AES-256-GCM (ADR-011) and are never
        returned by any read endpoint.
      operationId: configureIntegration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: { type: string }
              description: Provider-specific credential fields
      responses:
        "200":
          description: Configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationView" }
        "400":
          description: Unknown integration type
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [Integrations]
      summary: Remove an integration
      operationId: deleteIntegration
      responses:
        "204":
          description: Removed
        "400":
          description: Unknown integration type
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/integrations/{type}/test:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: type
        in: path
        required: true
        schema: { $ref: "#/components/schemas/IntegrationType" }
    post:
      tags: [Integrations]
      summary: Test an integration's connectivity
      operationId: testIntegration
      responses:
        "200":
          description: Health result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationView" }
        "400":
          description: Unknown integration type
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ---------------------------------------------------------------------------
  # Billing — existing
  # ---------------------------------------------------------------------------
  /api/v1/orgs/{organizationId}/usage:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Billing]
      summary: Read the current period Blossom usage summary
      description: |
        SHIPPED. Requires `catalog:view` via the `BoutiqueAccess` policy (the
        balance is not yet gated by a dedicated `billing:view` permission).

        KNOWN DEFECT: `monthlyBlossomLimit` is always created as the Seed tier value
        (150) regardless of the organization's actual plan, and is not updated on a
        plan change. Fixed in Phase 2.
      operationId: getUsageSummary
      responses:
        "200":
          description: Usage summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageSummary" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ---------------------------------------------------------------------------
  # Billing — new
  # ---------------------------------------------------------------------------
  /api/v1/orgs/{organizationId}/blossoms/balance:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Billing]
      summary: Read the authoritative Blossom balance
      description: |
        Phase 2. Requires `billing:view`. Do not cache this value client-side; it is
        the most correctness-sensitive read in the product.
      operationId: getBlossomBalance
      responses:
        "200":
          description: Balance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlossomBalance" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{organizationId}/blossoms/usage:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Billing]
      summary: Read Blossom consumption over a window
      description: Phase 2. Requires `billing:view`.
      operationId: getBlossomUsage
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: groupBy
          in: query
          schema:
            type: string
            enum: [day, provider, model, workflowId]
            default: day
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Usage series
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlossomUsageResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/blossoms/statement:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Billing]
      summary: Read the statement of account
      description: |
        Phase 2. Requires `billing:view`. Includes a `reconciliation` block that
        compares the projected balance with the ledger-derived balance. A non-zero
        `drift` is a Critical condition and must be surfaced, never hidden.
      operationId: getBlossomStatement
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: entryType
          in: query
          schema:
            type: string
            enum: [all, entitlement, consumption]
            default: all
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Statement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlossomStatementResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/blossoms/top-ups:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      tags: [Billing]
      summary: Purchase a Blossom pack
      description: Phase 2. Requires `billing:manage`. Requires `Idempotency-Key`.
      operationId: purchaseBlossomTopUp
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skuCode]
              properties:
                skuCode:
                  type: string
                  maxLength: 64
                  example: blossom_pack_500
                blossomQuantity: { type: number, nullable: true }
                paymentReference: { type: string, maxLength: 128, nullable: true }
      responses:
        "201":
          description: Top-up granted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlossomLedgerEntryResponse" }
        "400":
          description: Validation failure or unknown SKU
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Period closed, or idempotency key reuse
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ---------------------------------------------------------------------------
  # Admin billing
  # ---------------------------------------------------------------------------
  /api/v1/admin/orgs/{organizationId}/blossoms/credit:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      tags: [Admin Billing]
      summary: Credit Blossoms to an organization
      description: Phase 2. Requires `billing:adjust`. Requires `Idempotency-Key`.
      operationId: adminCreditBlossoms
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminBlossomAdjustmentRequest" }
      responses:
        "201":
          description: Ledger entry written
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlossomLedgerEntryResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Period closed, or idempotency key reuse
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/admin/orgs/{organizationId}/blossoms/debit:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      tags: [Admin Billing]
      summary: Debit Blossoms from an organization
      description: Phase 2. Requires `billing:adjust`. Requires `Idempotency-Key`.
      operationId: adminDebitBlossoms
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, reason]
              properties:
                amount: { $ref: "#/components/schemas/BlossomAmount" }
                reason: { $ref: "#/components/schemas/AdjustmentReason" }
                allowNegative: { type: boolean, default: false }
      responses:
        "201":
          description: Ledger entry written
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlossomLedgerEntryResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Insufficient balance, period closed, or idempotency key reuse
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InsufficientBalanceError" }

  /api/v1/admin/orgs/{organizationId}/blossoms/revoke:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      tags: [Admin Billing]
      summary: Revoke a granted top-up
      description: Phase 2. Requires `billing:adjust`. Requires `Idempotency-Key`. Full reversal only.
      operationId: adminRevokeBlossomGrant
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ledgerEntryId, reason]
              properties:
                ledgerEntryId: { type: string, format: uuid }
                reason: { $ref: "#/components/schemas/AdjustmentReason" }
      responses:
        "201":
          description: Revocation entry written
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlossomLedgerEntryResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The grant is not revocable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/admin/orgs/{organizationId}/blossoms/statement:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Admin Billing]
      summary: Read any organization's statement of account
      description: Phase 2. Requires `billing:adjust`.
      operationId: adminGetBlossomStatement
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Statement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlossomStatementResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/orgs:
    get:
      tags: [Admin Organizations]
      summary: Search organizations across the platform
      description: Phase 3. Requires the team-only `admin:orgs:read` permission (FR-4.8).
      operationId: adminSearchOrganizations
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
          description: Matches name or slug, case-insensitively
        - name: isActive
          in: query
          schema: { type: boolean }
        - name: planTier
          in: query
          schema: { $ref: "#/components/schemas/PlanTier" }
      responses:
        "200":
          description: Organizations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrganizationPage" }
        "400":
          description: Invalid `planTier`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/orgs/{organizationId}/entitlement-overrides:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    patch:
      tags: [Admin Organizations]
      summary: Set per-organization entitlement overrides
      description: |
        Phase 3. Requires `billing:adjust`. Applies one or more overrides together
        (FR-4.9), upserting each on `(organizationId, key, effectiveFrom)`, then
        returns the organization's resolved entitlements. Used for Enterprise
        contracts.
      operationId: adminSetEntitlementOverrides
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetEntitlementOverridesRequest" }
      responses:
        "200":
          description: Resolved entitlements after the overrides were applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntitlementOverridesResponse" }
        "400":
          description: No overrides supplied, or an unknown key / valueType / mismatched value
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Unknown organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ---------------------------------------------------------------------------
  # Subscription and entitlements
  # ---------------------------------------------------------------------------
  /api/v1/orgs/{organizationId}/subscription:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Billing]
      summary: Read the current subscription
      description: |
        Phase 2. Requires `billing:view`. If no subscription row exists yet, returns
        `200` with `status: "None"` and the tier derived from the organization, so a
        valid organization never produces a 404 here.
      operationId: getSubscription
      responses:
        "200":
          description: Subscription
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{organizationId}/subscription/change-plan:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      tags: [Billing]
      summary: Upgrade or downgrade the plan
      description: |
        Phase 2. Requires `billing:manage`. Requires `Idempotency-Key`.

        An upgrade takes effect immediately and writes a `PlanUpgradeProration`
        ledger entry. A downgrade defaults to the next period and is blocked with
        `409 plan-limit-violation` when current usage exceeds any target limit.
      operationId: changePlan
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePlanRequest" }
      responses:
        "200":
          description: Plan changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangePlanResponse" }
        "400":
          description: No-op plan change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Plan limit violation, or idempotency key reuse
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanLimitViolationError" }

  /api/v1/orgs/{organizationId}/subscription/cancel:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      tags: [Billing]
      summary: Cancel at the end of the current period
      description: Phase 2. Requires `billing:manage`.
      operationId: cancelSubscription
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Already cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/orgs/{organizationId}/entitlements:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Billing]
      summary: Read resolved entitlements for the organization
      description: |
        Phase 2. Requires `billing:view`. Frontends should drive ALL plan gating
        from this endpoint rather than hardcoding a plan matrix.
      operationId: getEntitlements
      responses:
        "200":
          description: Entitlements
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntitlementListResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/entitlements/usage:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Billing]
      summary: Read observed usage against each limited entitlement
      description: Phase 2. Requires `billing:view`.
      operationId: getEntitlementUsage
      responses:
        "200":
          description: Entitlement usage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntitlementUsageResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ---------------------------------------------------------------------------
  # API keys
  # ---------------------------------------------------------------------------
  /api/v1/orgs/{organizationId}/api-keys:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [API Keys]
      summary: List API keys
      description: Phase 3. Requires `apikeys:view`. The secret and its hash are never returned.
      operationId: listApiKeys
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ApiKeyStatus" }
      responses:
        "200":
          description: API keys
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyPage" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [API Keys]
      summary: Create an API key
      description: |
        Phase 3. Requires `apikeys:manage` and the `api.access` entitlement
        (Rose and Enterprise only). The plaintext `secret` is returned **exactly
        once** in this response and can never be retrieved again.
      operationId: createApiKey
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApiKeyRequest" }
      responses:
        "201":
          description: Created. Store the secret immediately.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyCreatedResponse" }
        "400":
          description: Validation failure, or a scope that cannot be delegated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Missing permission, or the plan does not include `api.access`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/orgs/{organizationId}/api-keys/{keyId}/revoke:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/ApiKeyId"
    post:
      tags: [API Keys]
      summary: Revoke an API key
      description: Phase 3. Requires `apikeys:manage`. Effective within 60 seconds on all instances.
      operationId: revokeApiKey
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 300 }
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKey" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Already revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/orgs/{organizationId}/api-keys/{keyId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/ApiKeyId"
    delete:
      tags: [API Keys]
      summary: Delete an unused API key
      description: Phase 3. Requires `apikeys:manage`. Only permitted when the key has never been used.
      operationId: deleteApiKey
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The key has been used and cannot be hard-deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ---------------------------------------------------------------------------
  # Pricing — admin
  # ---------------------------------------------------------------------------
  /api/v1/admin/pricing/rules:
    get:
      tags: [Pricing]
      summary: List Blossom conversion rules
      description: Phase 1. Requires the team-only `PricingAdminRead` policy (Admin or Owner). Never available to boutique roles.
      operationId: listPricingRules
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: scopeKind
          in: query
          schema: { $ref: "#/components/schemas/PricingScopeKind" }
        - name: provider
          in: query
          schema: { type: string, maxLength: 64 }
        - name: model
          in: query
          schema: { type: string, maxLength: 128 }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/PricingRuleStatus" }
        - name: activeAt
          in: query
          schema: { type: string, format: date-time }
          description: Return the rule that would price usage at this instant
      responses:
        "200":
          description: Rules
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingRulePage" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Pricing]
      summary: Create a Blossom conversion rule
      description: |
        Phase 1. Requires `pricing:manage`. A past `effectiveFrom` additionally
        requires `pricing:backdate`. The rule is created as `Draft`.
      operationId: createPricingRule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePricingRuleRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingRule" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Missing `pricing:manage`, or a past effective date without `pricing:backdate`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: The effective window overlaps an existing rule for the same scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/admin/pricing/rules/{ruleId}:
    parameters:
      - $ref: "#/components/parameters/PricingRuleId"
    get:
      tags: [Pricing]
      summary: Read one conversion rule
      description: Phase 1. Requires the team-only `PricingAdminRead` policy (Admin or Owner).
      operationId: getPricingRule
      responses:
        "200":
          description: Rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingRule" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Pricing]
      summary: Edit a draft conversion rule
      description: |
        Phase 1. Requires `pricing:manage`. Only permitted while `status = Draft`.
        A past `effectiveFrom` additionally requires `pricing:backdate` (403 otherwise).
      operationId: updatePricingRule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePricingRuleRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingRule" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The rule is not a `Draft` (`code: rule-immutable`). Only a `Draft`
            rule may be edited; supersede it with a new rule instead.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/admin/pricing/rules/{ruleId}/activate:
    parameters:
      - $ref: "#/components/parameters/PricingRuleId"
    post:
      tags: [Pricing]
      summary: Activate a conversion rule
      description: |
        Phase 1. Requires `pricing:manage`. Atomically trims the predecessor's
        `effectiveTo` to this rule's `effectiveFrom` and marks the predecessor
        `Superseded`. A past `effectiveFrom` in the body additionally requires
        `pricing:backdate` (403 otherwise).
      operationId: activatePricingRule
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                effectiveFrom: { type: string, format: date-time, nullable: true }
      responses:
        "200":
          description: Activated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingRule" }
        "400":
          description: The rule is not a Draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The effective window overlaps an existing rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/admin/pricing/rules/{ruleId}/cancel:
    parameters:
      - $ref: "#/components/parameters/PricingRuleId"
    post:
      tags: [Pricing]
      summary: Cancel a draft conversion rule
      description: Phase 1. Requires `pricing:manage`.
      operationId: cancelPricingRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { $ref: "#/components/schemas/AdjustmentReason" }
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingRule" }
        "400":
          description: |
            `code: rule-priced` when the rule is already `Active` and has priced
            usage (activate a superseding rule instead); `code: validation` for a
            bad reason.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/pricing/rules/{ruleId}/recompute:
    parameters:
      - $ref: "#/components/parameters/PricingRuleId"
    post:
      tags: [Pricing]
      summary: Re-price already-recorded usage affected by a rule
      description: |
        Requires `pricing:backdate`. **Not implemented yet:** the compensating-ledger
        recompute job is not scheduled, so the handler always returns `501`, even
        though the ledger itself has shipped. The intended behaviour is to write
        compensating ledger entries and never mutate `AiUsageRecord`; when it ships,
        the intended body is `{ asOf, dryRun }` and the intended `200` body is
        `PricingRecomputeResult`. Always run it with `dryRun: true` first. The
        handler ignores the request body today.
      operationId: recomputePricingRule
      responses:
        "501":
          description: Recompute is not available until the compensating-ledger job ships
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ---------------------------------------------------------------------------
  # Price book
  # ---------------------------------------------------------------------------
  /api/v1/admin/pricing/price-book:
    get:
      tags: [Pricing]
      summary: List price-book entries
      description: |
        Phase 1. Requires the team-only `PricingAdminRead` policy (Admin or Owner).

        Returns a **bare array of entries — there is no `page`/`pageSize` and no
        `{ items, total }` envelope** (finding M-8, a deliberate deviation from the
        §A.4 pagination convention).
      operationId: listPricingPriceEntries
      parameters:
        - name: skuKind
          in: query
          schema: { $ref: "#/components/schemas/PricingSkuKind" }
        - name: planTier
          in: query
          schema: { $ref: "#/components/schemas/PlanTier" }
        - name: organizationId
          in: query
          schema: { type: string, format: uuid }
          description: |
            Filter to this organization's override; omit to list global entries only.
      responses:
        "200":
          description: Price-book entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PricingPriceEntry" }
        "400":
          description: Invalid `skuKind` or `planTier` filter
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Pricing]
      summary: Create a price-book entry
      description: Phase 1. Requires `pricing:manage`. Created as `Draft`.
      operationId: createPricingPriceEntry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePriceEntryRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingPriceEntry" }
        "400":
          description: Field validation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/pricing/price-book/{entryId}:
    parameters:
      - $ref: "#/components/parameters/PricingEntryId"
    get:
      tags: [Pricing]
      summary: Read one price-book entry
      description: |
        Phase 1. Requires the team-only `PricingAdminRead` policy (Admin or Owner).
        A global entry (no `organizationId`) is always readable; a per-organization
        override is readable only when the caller passes that same `organizationId`.
      operationId: getPricingPriceEntry
      parameters:
        - name: organizationId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Price-book entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingPriceEntry" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Pricing]
      summary: Edit a price-book entry
      description: Phase 1. Requires `pricing:manage`.
      operationId: updatePricingPriceEntry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePriceEntryRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingPriceEntry" }
        "400":
          description: Field validation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Pricing]
      summary: Retire a price-book entry
      description: |
        Phase 1. Requires `pricing:manage`. Sets the entry's status to `Cancelled`;
        returns `204 No Content`.
      operationId: deletePricingPriceEntry
      responses:
        "204":
          description: Retired
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Agent statistics
  # ---------------------------------------------------------------------------
  /api/v1/orgs/{organizationId}/statistics/agents/runs:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Agent Statistics]
      summary: List agent workflow runs
      description: Phase 4. Requires `stats:view:agent` (owner and above).
      operationId: listAgentRuns
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/AgentRunStatus" }
        - name: agentKey
          in: query
          schema: { $ref: "#/components/schemas/AgentKey" }
        - name: triggerKind
          in: query
          schema: { $ref: "#/components/schemas/AgentTriggerKind" }
        - name: customerId
          in: query
          schema: { type: string, format: uuid }
        - name: conversationId
          in: query
          schema: { type: string, format: uuid }
        - name: sort
          in: query
          schema:
            type: string
            enum: [startedAt, -startedAt, durationMs, -durationMs]
            default: -startedAt
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRunPage" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

