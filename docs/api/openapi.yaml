  /api/v1/orgs/{organizationId}/catalog/images/upload:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      tags: [Catalog & Visual Intelligence]
      summary: Upload an image through the configured media provider and return its row
      operationId: catalogUploadImage
      description: |
        Stores one catalog image through the selected `IInventoryImageStore` and returns the
        row's id, URL and metadata. The response shape is unchanged from the database tier; only
        the meaning of `url` changes with the provider: the database tier returns the relative
        Aveline catalog route, the Cloudinary tier returns the **absolute CDN delivery URL**
        carrying `w_{Media:CatalogDisplayWidth},f_auto,q_auto`.

        The catalog cap is `Media:CatalogMaxFileBytes` (2 MB default), tighter than the 5 MB
        attachment cap, and it is checked on **both** the multipart and the base64-JSON branch
        before anything is written. An over-cap or empty body is a `400` and stores nothing.

        Accepts `multipart/form-data` with a `file` field, or JSON with `imageData` (raw base64
        or a `data:` URL). The content type is normalised to the image allow-list.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
          application/json:
            schema:
              type: object
              required: [imageData]
              properties:
                imageData: { type: string }
                fileName: { type: string, nullable: true }
                contentType: { type: string, nullable: true }
      responses:
        "200":
          description: The stored image row
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogImage" }
        "400":
          description: No data, or a body over `Media:CatalogMaxFileBytes`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/catalog/images/{imageId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: imageId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Catalog & Visual Intelligence]
      summary: "Retrieve a catalog image: 302 to the CDN for a Cloudinary row, bytes for a database row"
      operationId: catalogGetImage
      description: |
        **Deliberately anonymous** (F-7/Q4): catalog imagery is public, so this route overrides
        the group's member-level policy on purpose. The GUID is unguessable but not secret.

        **Per-row dispatch** (strategy §3.3). A row whose `StorageProvider` is `cloudinary` with
        an absolute `imageUrl` answers **`302`** to the absolute CDN delivery URL. A database
        row streams its bytes exactly as before, with
        `Cache-Control: public, max-age=31536000, immutable` and `X-Content-Type-Options: nosniff`.
        A row with neither is a `404`, never a `500`.

        **The `302` is a success, not a failure.** Support and log readers must treat it as the
        documented Cloudinary-tier response; the redirect target is the CDN and is not served by
        this process. The delivery URL carries exactly one `w_{Media:CatalogDisplayWidth}`,
        `f_auto` and `q_auto` (risk R21).
      responses:
        "200":
          description: The image bytes (database tier)
          content:
            image/*:
              schema: { type: string, format: binary }
        "302":
          description: |
            The absolute CDN delivery URL for a Cloudinary-backed row. The `Location` header is
            the catalog delivery URL built by `CatalogDeliveryUrl` from the row's storage key.
          headers:
            Location:
              description: The absolute Cloudinary delivery URL.
              schema: { type: string, format: uri }
        "404":
          description: No image row, or a row with neither a CDN URL nor stored bytes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ---------------------------------------------------------------------------
  # Protected media
  # ---------------------------------------------------------------------------
  /api/v1/media/{token}:
    get:
      tags: [Media]
      summary: Stream a protected media asset named by a minted, expiring Aveline token
      operationId: serveMediaToken
      security: []
      description: |
        **Anonymous by design: the token *is* the credential.** The route verifies the token in a
        fixed order — MAC then `exp` then scope then single-use nonce — and then streams the
        bytes server-side.

        **It never redirects.** A `302` to a permanent signed Cloudinary URL would make
        "time-limited" decorative, because the caller keeps the redirect target and replays it
        after `exp`. The proxy is the only place `exp` can be re-checked.

        Accepted scopes are `attachment.view` and `vision.analyze`; `vision.analyze` tokens are
        single-use. The response is always `private, no-store`, including failures; a success also
        carries `X-Content-Type-Options: nosniff` and `Content-Disposition: inline`. The token is
        never logged: the audit middleware, the global exception handler and the OpenTelemetry
        span exporter all resolve the path through `RequestPathRedaction`.

        The failure body is deliberately uninformative, so an attacker cannot distinguish a wrong
        key from an expired token from a missing asset.
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
          description: The opaque media token (`base64url(payload).base64url(hmac)`).
      responses:
        "200":
          description: The asset bytes
          headers:
            Cache-Control:
              schema: { type: string }
              description: Always `private, no-store`.
          content:
            image/*:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        "401":
          description: Malformed token, bad MAC, expired token, or a replayed nonce
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "403":
          description: The token is valid but its scope is not one this route serves
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "404":
          description: The token verifies but the row does not exist for its organisation
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "502":
          description: The media provider failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaProviderError" }
        "503":
          description: The nonce store is unavailable, or the provider is rate-limited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaProviderError" }
        "504":
          description: The media provider timed out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaProviderError" }

  /internal/visual/media-token:
    post:
      tags: [Media]
      summary: Mint a single-use `vision.analyze` token for a referenced asset
      operationId: mintMediaToken
      security:
        - internalToken: []
      description: |
        The internal (service-to-service) mint, consumed by the Python agent service over the
        `X-Internal-Token` channel. It is also mapped at `/api/internal/visual/media-token`.

        The scope this route may request is exactly `vision.analyze`: a caller cannot obtain an
        `attachment.view` grant here (`403`), or an `asset.public` grant at all. The referenced
        row is resolved against `organizationId`; a cross-tenant or unknown reference is `404`,
        never a token. `imageRefKind` must be `attachment` or `inventoryImage` (`externalUrl` is
        not tokenised).

        The returned `publicId` exists so the analysis cache can key on `{orgId}:{publicId}`
        instead of the ever-changing token URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationId, imageRefKind, imageRefId]
              properties:
                organizationId: { type: string, format: uuid }
                imageRefKind:
                  type: string
                  enum: [attachment, inventoryImage]
                imageRefId: { type: string, format: uuid }
                scope:
                  type: string
                  enum: [vision.analyze]
                  description: Optional; the only scope this route serves.
      responses:
        "200":
          description: The minted token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaTokenResponse" }
        "400":
          description: A missing or malformed field, or an unknown scope name
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The requested scope is not `vision.analyze`
        "404":
          description: The referenced media was not found for this organisation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/orgs/{organizationId}/conversations/{conversationId}/attachments/{attachmentId}/media-token:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/ConversationId"
      - $ref: "#/components/parameters/AttachmentId"
    post:
      tags: [Conversations]
      summary: Mint an `attachment.view` token for one attachment of one conversation
      operationId: mintConversationAttachmentMediaToken
      description: |
        The member's mint. It serves `attachment.view` only: naming any other scope in the body
        is a `403` before the row is read. Visibility is resolved on the conversation and the row
        is tenant-scoped, so a cross-org or invisible attachment is a `404` and never mints.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: string
                  enum: [attachment.view]
                  description: Optional; the only scope this route serves.
      responses:
        "200":
          description: The minted token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaTokenResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The requested scope is not `attachment.view`
        "404":
          description: The attachment was not found, or is not visible to the caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

