        projectedExhaustionAt: { type: string, format: date-time, nullable: true }
        confidence: { type: string, enum: [low, medium, high] }
        sampleDays: { type: integer }

    # --- subscription and entitlements ---------------------------------------
    Subscription:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        planTier: { $ref: "#/components/schemas/PlanTier" }
        billingCycle: { type: string, enum: [Monthly, Annual] }
        status: { type: string, enum: [None, Trialing, Active, PastDue, Cancelled, Expired] }
        currentPeriodStart: { type: string, format: date-time }
        currentPeriodEnd: { type: string, format: date-time }
        seatsIncluded: { type: integer }
        priceLkr: { type: number }
        currency: { type: string }
        cancelAtPeriodEnd: { type: boolean }
        cancelledAt: { type: string, format: date-time, nullable: true }
        externalProvider: { type: string, nullable: true }
    ChangePlanRequest:
      type: object
      required: [planTier]
      properties:
        planTier: { $ref: "#/components/schemas/PlanTier" }
        effective:
          type: string
          enum: [immediate, nextPeriod]
          description: Defaults to `immediate` for an upgrade and `nextPeriod` for a downgrade.
        reason: { type: string, maxLength: 500, nullable: true }
    ChangePlanResponse:
      type: object
      properties:
        subscription: { $ref: "#/components/schemas/Subscription" }
        previousPlanTier: { $ref: "#/components/schemas/PlanTier" }
        blossomDelta: { type: number }
        newBalance: { type: number }
    EntitlementListResponse:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        planTier: { $ref: "#/components/schemas/PlanTier" }
        items:
          type: array
          items: { $ref: "#/components/schemas/Entitlement" }
        generatedAt: { type: string, format: date-time }
    Entitlement:
      type: object
      properties:
        key: { type: string }
        valueType: { type: string, enum: [Integer, Decimal, Boolean, String] }
        value: {}
        source: { type: string, enum: [Plan, Override] }
        effectiveFrom: { type: string, format: date-time }
    EntitlementUsageResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              observed: { type: number }
              allowed: { type: number, nullable: true }
              percentUsed: { type: number, nullable: true }
              hardLimit: { type: boolean }
        materialisedAt: { type: string, format: date-time }
        dataQuality: { $ref: "#/components/schemas/DataQuality" }
    EntitlementOverrideInput:
      type: object
      description: One per-organization entitlement override (FR-4.9).
      required: [key, valueType, value, reason]
      properties:
        key: { type: string, maxLength: 64 }
        valueType: { type: string, enum: [Integer, Decimal, Boolean, String] }
        value: {}
        reason: { type: string, minLength: 1, maxLength: 500 }
        effectiveFrom: { type: string, format: date-time, nullable: true }
        effectiveTo: { type: string, format: date-time, nullable: true }
    SetEntitlementOverridesRequest:
      type: object
      required: [overrides]
      properties:
        overrides:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/EntitlementOverrideInput" }
    EntitlementOverridesResponse:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        entitlements:
          type: array
          items: { $ref: "#/components/schemas/Entitlement" }

    # --- API keys ------------------------------------------------------------
    CreateApiKeyRequest:
      type: object
      required: [name, scopes]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        scopes:
          type: array
          minItems: 1
          items: { type: string }
          description: |
            Subset of the permission catalog. `pricing:*`, `billing:adjust`, and
            `admin:*` cannot be delegated to a key.
        environment: { type: string, enum: [live, test], default: live }
        expiresAt: { type: string, format: date-time, nullable: true }
    ApiKey:
      type: object
      description: A key as returned by read endpoints. The secret and its hash are never included.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string }
        scopes:
          type: array
          items: { type: string }
        environment: { type: string, enum: [live, test] }
        status: { $ref: "#/components/schemas/ApiKeyStatus" }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
        revokedReason: { type: string, nullable: true }
        requestCount: { type: integer }
    ApiKeyCreatedResponse:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: Returned exactly once. Never retrievable again.
              example: "avl_live_7Qk2mZpX9rT4vBnL6sW1cYhJ3dF8gAeU"
            warning: { type: string }
    ApiKeyPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/ApiKey" }

    # --- pricing -------------------------------------------------------------
    CreatePricingRuleRequest:
      type: object
      required: [scopeKind, unitsPerBlossom, effectiveFrom, changeReason]
      properties:
        scopeKind: { $ref: "#/components/schemas/PricingScopeKind" }
        provider: { type: string, maxLength: 64, nullable: true }
        model: { type: string, maxLength: 128, nullable: true }
        unitsPerBlossom: { type: integer, minimum: 1, maximum: 10000000, default: 1000 }
        minimumChargeBlossoms: { type: number, minimum: 0, default: 0.1 }
        roundingMode: { $ref: "#/components/schemas/RoundingMode" }
        roundingDecimals: { type: integer, minimum: 0, maximum: 6, default: 1 }
        effectiveFrom: { type: string, format: date-time }
        changeReason: { $ref: "#/components/schemas/AdjustmentReason" }
    UpdatePricingRuleRequest:
      type: object
      description: Any subset of the create fields except `scopeKind`. Only permitted while the rule is a Draft.
      properties:
        unitsPerBlossom: { type: integer, minimum: 1, maximum: 10000000 }
        minimumChargeBlossoms: { type: number, minimum: 0 }
        roundingMode: { $ref: "#/components/schemas/RoundingMode" }
        roundingDecimals: { type: integer, minimum: 0, maximum: 6 }
        effectiveFrom: { type: string, format: date-time }
        changeReason: { $ref: "#/components/schemas/AdjustmentReason" }
    PricingRule:
      type: object
      properties:
        id: { type: string, format: uuid }
        scopeKind: { $ref: "#/components/schemas/PricingScopeKind" }
        provider: { type: string, nullable: true }
        model: { type: string, nullable: true }
        unitsPerBlossom: { type: integer }
        minimumChargeBlossoms: { type: number }
        roundingMode: { $ref: "#/components/schemas/RoundingMode" }
        roundingDecimals: { type: integer }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: string, format: date-time, nullable: true }
        status: { $ref: "#/components/schemas/PricingRuleStatus" }
        version: { type: integer }
        changeReason: { type: string }
        createdByUserId: { type: string, format: uuid }
        approvedByUserId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PricingRulePage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/PricingRule" }
    PricingSkuKind:
      type: string
      enum: [PlanAllowance, TopUpPack, OverageUsage]
    PricingPriceEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        planTier: { type: string, nullable: true }
        organizationId: { type: string, format: uuid, nullable: true }
        skuKind: { $ref: "#/components/schemas/PricingSkuKind" }
        skuCode: { type: string, nullable: true }
        blossomQuantity: { type: number }
        priceLkr: { type: number }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: string, format: date-time, nullable: true }
        status: { $ref: "#/components/schemas/PricingRuleStatus" }
        changeReason: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreatePriceEntryRequest:
      type: object
      required: [skuKind, blossomQuantity, priceLkr, effectiveFrom, changeReason]
      properties:
        planTier: { $ref: "#/components/schemas/PlanTier" }
        organizationId: { type: string, format: uuid, nullable: true }
        skuKind: { $ref: "#/components/schemas/PricingSkuKind" }
        skuCode: { type: string, maxLength: 64, nullable: true }
        blossomQuantity: { type: number, minimum: 0, description: Must be greater than zero }
        priceLkr: { type: number, minimum: 0 }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: string, format: date-time, nullable: true }
        changeReason: { $ref: "#/components/schemas/AdjustmentReason" }
    UpdatePriceEntryRequest:
      type: object
      properties:
        blossomQuantity: { type: number, minimum: 0, description: Must be greater than zero }
        priceLkr: { type: number, minimum: 0 }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: string, format: date-time, nullable: true }
        changeReason: { $ref: "#/components/schemas/AdjustmentReason" }
        status: { $ref: "#/components/schemas/PricingRuleStatus" }

