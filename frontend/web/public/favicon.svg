<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    :root {
      --blossom-base: #8b2e42;
      --blossom-top: #a84056;
      --blossom-center: #8b2e42;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --blossom-base: #ffb4c3;
        --blossom-top: #ffcdd5;
        --blossom-center: #ffb4c3;
      }
    }
  </style>
  <g opacity="0.92">
    <ellipse cx="12" cy="5.4" rx="3.1" ry="5.3" fill="var(--blossom-base)" transform="rotate(0 12 12)" />
    <ellipse cx="12" cy="5.4" rx="3.1" ry="5.3" fill="var(--blossom-base)" transform="rotate(90 12 12)" />
    <ellipse cx="12" cy="5.4" rx="3.1" ry="5.3" fill="var(--blossom-base)" transform="rotate(180 12 12)" />
    <ellipse cx="12" cy="5.4" rx="3.1" ry="5.3" fill="var(--blossom-base)" transform="rotate(270 12 12)" />
  </g>
  <g opacity="0.98">
    <ellipse cx="12" cy="5.4" rx="2.95" ry="5.1" fill="var(--blossom-top)" transform="rotate(45 12 12)" />
    <ellipse cx="12" cy="5.4" rx="2.95" ry="5.1" fill="var(--blossom-top)" transform="rotate(135 12 12)" />
    <ellipse cx="12" cy="5.4" rx="2.95" ry="5.1" fill="var(--blossom-top)" transform="rotate(225 12 12)" />
    <ellipse cx="12" cy="5.4" rx="2.95" ry="5.1" fill="var(--blossom-top)" transform="rotate(315 12 12)" />
  </g>
  <circle cx="12" cy="12" r="2.3" fill="var(--blossom-center)" opacity="0.95" />
</svg>