name: Aveline CI

on:
  push:
    branches: [main, master, development]
  pull_request:
    branches: [main, master, development]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Repository Hygiene (Locks, Env, Secrets)
  # ---------------------------------------------------------------------------
  hygiene:
    name: Repository Hygiene & Lockfile Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify only bun lockfile exists
        run: |
          echo "Checking for disallowed package manager lockfiles..."
          DISALLOWED=$(find . -name "package-lock.json" -o -name "yarn.lock" -o -name "pnpm-lock.yaml" -o -name "pnpm-lock.yml" -o -name "npm-shrinkwrap.json" | grep -v node_modules || true)
          if [ -n "$DISALLOWED" ]; then
            echo "::error::Disallowed lockfiles found in repository. Only bun.lock / bun.lockb is permitted:"
            echo "$DISALLOWED"
            exit 1
          fi
          echo "✓ Lockfile hygiene passed"

      - name: Verify no .env files committed
        run: |
          echo "Checking for committed .env files..."
          ENV_FILES=$(find . -name ".env" -o -name ".env.local" -o -name ".env.production" -o -name ".env.development" | grep -v "\.env\.example" || true)
          if [ -n "$ENV_FILES" ]; then
            echo "::error::Committed environment file(s) detected:"
            echo "$ENV_FILES"
            exit 1
          fi
          echo "✓ No .env files found"

  # ---------------------------------------------------------------------------
  # Job 2: Build, Test & Publish — ASP.NET Core API
  # ---------------------------------------------------------------------------
  build-api:
    name: Build, Test & Publish API
    runs-on: ubuntu-latest
    needs: hygiene

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Aveline.Api/Aveline.Api.sln

      - name: Build API
        run: dotnet build Aveline.Api/Aveline.Api.sln --no-restore -c Release

      - name: Test API
        run: dotnet test Aveline.Api/Aveline.Api.sln --no-build --no-restore -c Release

      - name: Publish API
        run: dotnet publish Aveline.Api/Aveline.Api.csproj -c Release --no-restore -o api-publish

      - name: Upload API artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aveline-api
          path: api-publish

  # ---------------------------------------------------------------------------
  # Job 3: Lint & Test — Python Agent Service
  # ---------------------------------------------------------------------------
  test-python:
    name: Lint & Test Python Agent Service
    runs-on: ubuntu-latest
    needs: hygiene

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies & linter
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest -r agnet-service/requirements.txt

      - name: Run Ruff Lint
        run: ruff check agnet-service/app/

      - name: Run Pytest
        run: pytest agnet-service/tests/ -q

  # ---------------------------------------------------------------------------
  # Job 4: Build, Test & Lint — Vite Web Dashboard
  # ---------------------------------------------------------------------------
  test-web:
    name: Build, Test & Lint Web Dashboard
    runs-on: ubuntu-latest
    needs: hygiene

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: frontend/web

      - name: Lint
        run: bun run lint
        working-directory: frontend/web

      - name: Test
        run: bun run test
        working-directory: frontend/web

      - name: Build
        env:
          # Optional: enables a fully functional bundle when the secret is set.
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: bun run build
        working-directory: frontend/web

      - name: Upload web artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aveline-web
          path: frontend/web/dist

  # ---------------------------------------------------------------------------
  # Job 5: Analyze, Test & Build — Flutter Mobile App
  # ---------------------------------------------------------------------------
  test-flutter:
    name: Analyze, Test & Build Flutter App
    runs-on: ubuntu-latest
    needs: hygiene

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get
        working-directory: frontend/aveline_mobile

      - name: Analyze Flutter codebase
        run: flutter analyze --no-fatal-infos
        working-directory: frontend/aveline_mobile

      - name: Run Flutter tests
        run: flutter test
        working-directory: frontend/aveline_mobile

      - name: Build release APK
        run: flutter build apk --release
        working-directory: frontend/aveline_mobile

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aveline-mobile-apk
          path: frontend/aveline_mobile/build/app/outputs/flutter-apk

  # ---------------------------------------------------------------------------
  # Job 6: Security & Dependency Scan
  # ---------------------------------------------------------------------------
  security-scan:
    name: Security & Dependency Scan
    runs-on: ubuntu-latest
    needs: hygiene
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Aveline.Api/Aveline.Api.sln

      - name: Scan .NET packages for vulnerabilities
        run: |
          dotnet list Aveline.Api/Aveline.Api.sln package --vulnerable --include-transitive > /tmp/dotnet-vuln.txt 2>&1
          cat /tmp/dotnet-vuln.txt
          if grep -q "has the following vulnerable packages" /tmp/dotnet-vuln.txt; then
            echo "::error::Vulnerable .NET packages found (see GHSA advisories above)"
            exit 1
          fi
          echo "✓ No vulnerable .NET packages"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Scan web dependencies
        working-directory: frontend/web
        run: bun audit --audit-level high

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: node_modules,.git,build,dist
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@a35ac6e6798d72df5475948b28efb89edc2e19ca # v4.37.9
        if: always()
        with:
          sarif_file: trivy-results.sarif
