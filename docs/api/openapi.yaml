    # --- billing -------------------------------------------------------------
    UsageSummary:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        monthlyBlossomLimit: { type: number }
        blossomUsed: { type: number }
        blossomRemaining: { type: number }
        status: { type: string, enum: [Active, Suspended, Closed] }
    BlossomBalance:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        periodIsClosed: { type: boolean }
        planTier: { $ref: "#/components/schemas/PlanTier" }
        monthlyBlossomLimit: { type: number }
        blossomGranted: { type: number }
        blossomAdjusted: { type: number }
        blossomUsed: { type: number }
        blossomRemaining: { type: number }
        percentUsed: { type: number }
        lowBalanceThresholdPercent: { type: number }
        status: { type: string, enum: [Active, Suspended, Closed] }
        nextExpiringGrant:
          type: object
          nullable: true
          properties:
            blossomDelta: { type: number }
            expiresAt: { type: string, format: date-time }
        asOf: { type: string, format: date-time }
    BlossomUsageResponse:
      type: object
      properties:
        window: { $ref: "#/components/schemas/TimeWindow" }
        totalBlossoms: { type: number }
        totalNormalizedUnits: { type: integer }
        series:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              blossoms: { type: number }
              normalizedUnits: { type: integer }
              workflowCount: { type: integer }
        generatedAt: { type: string, format: date-time }
    BlossomStatementResponse:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            organizationId: { type: string, format: uuid }
            periodStart: { type: string, format: date-time }
            periodEnd: { type: string, format: date-time }
            openingBalance: { type: number }
            closingBalance: { type: number }
            items:
              type: array
              items: { $ref: "#/components/schemas/BlossomStatementItem" }
            reconciliation:
              type: object
              properties:
                projectedBalance: { type: number }
                ledgerDerivedBalance: { type: number }
                drift: { type: number }
                isConsistent: { type: boolean }
            generatedAt: { type: string, format: date-time }
    BlossomStatementItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        kind: { type: string, enum: [Entitlement, Consumption] }
        entryType: { $ref: "#/components/schemas/BlossomLedgerEntryType", nullable: true }
        blossomDelta: { type: number }
        balanceAfter: { type: number }
        reason: { type: string }
        sourceKind: { type: string, nullable: true }
        sourceRef: { type: string, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        createdByUserId: { type: string, format: uuid, nullable: true }
    AdminBlossomAdjustmentRequest:
      type: object
      required: [amount, reason]
      properties:
        amount: { $ref: "#/components/schemas/BlossomAmount" }
        reason: { $ref: "#/components/schemas/AdjustmentReason" }
        expiresAt: { type: string, format: date-time, nullable: true }
        sourceKind:
          type: string
          enum: [Admin, PaymentProvider, PlanChange, Expiry, System]
          nullable: true
        sourceRef: { type: string, maxLength: 128, nullable: true }
    BlossomLedgerEntryResponse:
      type: object
      properties:
        ledgerEntryId: { type: string, format: uuid }
        entryType: { $ref: "#/components/schemas/BlossomLedgerEntryType" }
        blossomDelta: { type: number }
        balanceAfter: { type: number }
        expiresAt: { type: string, format: date-time, nullable: true }
        reason: { type: string }
        skuCode: { type: string, nullable: true }
        priceLkr: { type: number, nullable: true }
        paymentReference: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    BlossomBurnRateResponse:
      type: object
      properties:
        window: { type: string }
        burnRatePerDay: { type: number }
        availableBlossoms: { type: number }
        projectedExhaustionAt: { type: string, format: date-time, nullable: true }
        confidence: { type: string, enum: [low, medium, high] }
        sampleDays: { type: integer }

    # --- subscription and entitlements ---------------------------------------
    Subscription:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        planTier: { $ref: "#/components/schemas/PlanTier" }
        billingCycle: { type: string, enum: [Monthly, Annual] }
        status: { type: string, enum: [None, Trialing, Active, PastDue, Cancelled, Expired] }
        currentPeriodStart: { type: string, format: date-time }
        currentPeriodEnd: { type: string, format: date-time }
        seatsIncluded: { type: integer }
        priceLkr: { type: number }
        currency: { type: string }
        cancelAtPeriodEnd: { type: boolean }
        cancelledAt: { type: string, format: date-time, nullable: true }
        externalProvider: { type: string, nullable: true }
    ChangePlanRequest:
      type: object
      required: [planTier]
      properties:
        planTier: { $ref: "#/components/schemas/PlanTier" }
        effective:
          type: string
          enum: [immediate, nextPeriod]
          description: Defaults to `immediate` for an upgrade and `nextPeriod` for a downgrade.
        reason: { type: string, maxLength: 500, nullable: true }
    ChangePlanResponse:
      type: object
      properties:
        subscription: { $ref: "#/components/schemas/Subscription" }
        previousPlanTier: { $ref: "#/components/schemas/PlanTier" }
        blossomDelta: { type: number }
        newBalance: { type: number }
    EntitlementListResponse:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        planTier: { $ref: "#/components/schemas/PlanTier" }
        items:
          type: array
          items: { $ref: "#/components/schemas/Entitlement" }
        generatedAt: { type: string, format: date-time }
    Entitlement:
      type: object
      properties:
        key: { type: string }
        valueType: { type: string, enum: [Integer, Decimal, Boolean, String] }
        value: {}
        source: { type: string, enum: [Plan, Override] }
        effectiveFrom: { type: string, format: date-time }
    EntitlementUsageResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              observed: { type: number }
              allowed: { type: number, nullable: true }
              percentUsed: { type: number, nullable: true }
              hardLimit: { type: boolean }
        materialisedAt: { type: string, format: date-time }
        dataQuality: { $ref: "#/components/schemas/DataQuality" }
    EntitlementOverrideInput:
      type: object
      description: One per-organization entitlement override (FR-4.9).
      required: [key, valueType, value, reason]
      properties:
        key: { type: string, maxLength: 64 }
        valueType: { type: string, enum: [Integer, Decimal, Boolean, String] }
        value: {}
        reason: { type: string, minLength: 1, maxLength: 500 }
        effectiveFrom: { type: string, format: date-time, nullable: true }
        effectiveTo: { type: string, format: date-time, nullable: true }
    SetEntitlementOverridesRequest:
      type: object
      required: [overrides]
      properties:
        overrides:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/EntitlementOverrideInput" }
    EntitlementOverridesResponse:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        entitlements:
          type: array
          items: { $ref: "#/components/schemas/Entitlement" }

    # --- API keys ------------------------------------------------------------
    CreateApiKeyRequest:
      type: object
      required: [name, scopes]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        scopes:
          type: array
          minItems: 1
          items: { type: string }
          description: |
            Subset of the permission catalog. `pricing:*`, `billing:adjust`, and
            `admin:*` cannot be delegated to a key.
        environment: { type: string, enum: [live, test], default: live }
        expiresAt: { type: string, format: date-time, nullable: true }
    ApiKey:
      type: object
      description: A key as returned by read endpoints. The secret and its hash are never included.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string }
        scopes:
          type: array
          items: { type: string }
        environment: { type: string, enum: [live, test] }
        status: { $ref: "#/components/schemas/ApiKeyStatus" }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
        revokedReason: { type: string, nullable: true }
        requestCount: { type: integer }
    ApiKeyCreatedResponse:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: Returned exactly once. Never retrievable again.
              example: "avl_live_7Qk2mZpX9rT4vBnL6sW1cYhJ3dF8gAeU"
            warning: { type: string }
    ApiKeyPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/ApiKey" }

    # --- pricing -------------------------------------------------------------
    CreatePricingRuleRequest:
      type: object
      required: [scopeKind, unitsPerBlossom, effectiveFrom, changeReason]
      properties:
        scopeKind: { $ref: "#/components/schemas/PricingScopeKind" }
        provider: { type: string, maxLength: 64, nullable: true }
        model: { type: string, maxLength: 128, nullable: true }
        unitsPerBlossom: { type: integer, minimum: 1, maximum: 10000000, default: 1000 }
        minimumChargeBlossoms: { type: number, minimum: 0, default: 0.1 }
        roundingMode: { $ref: "#/components/schemas/RoundingMode" }
        roundingDecimals: { type: integer, minimum: 0, maximum: 6, default: 1 }
        effectiveFrom: { type: string, format: date-time }
        changeReason: { $ref: "#/components/schemas/AdjustmentReason" }
    UpdatePricingRuleRequest:
      type: object
      description: Any subset of the create fields except `scopeKind`. Only permitted while the rule is a Draft.
      properties:
        unitsPerBlossom: { type: integer, minimum: 1, maximum: 10000000 }
        minimumChargeBlossoms: { type: number, minimum: 0 }
        roundingMode: { $ref: "#/components/schemas/RoundingMode" }
        roundingDecimals: { type: integer, minimum: 0, maximum: 6 }
        effectiveFrom: { type: string, format: date-time }
        changeReason: { $ref: "#/components/schemas/AdjustmentReason" }
    PricingRule:
      type: object
      properties:
        id: { type: string, format: uuid }
        scopeKind: { $ref: "#/components/schemas/PricingScopeKind" }
        provider: { type: string, nullable: true }
        model: { type: string, nullable: true }
        unitsPerBlossom: { type: integer }
        minimumChargeBlossoms: { type: number }
        roundingMode: { $ref: "#/components/schemas/RoundingMode" }
        roundingDecimals: { type: integer }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: string, format: date-time, nullable: true }
        status: { $ref: "#/components/schemas/PricingRuleStatus" }
        version: { type: integer }
        changeReason: { type: string }
        createdByUserId: { type: string, format: uuid }
        approvedByUserId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PricingRulePage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/PricingRule" }
    PricingRecomputeResult:
      type: object
      properties:
        asOf: { type: string, format: date-time }
        dryRun: { type: boolean }
        affectedProviders:
          type: array
          items: { type: string }
        affectedModels:
          type: array
          items: { type: string }
        recordCount: { type: integer }
        currentBlossomTotal: { type: number }
        recomputedBlossomTotal: { type: number }
        deltaBlossoms: { type: number }
        organizationsAffected: { type: integer }
        ledgerEntriesWritten: { type: integer }
    PricingSkuKind:
      type: string
      enum: [PlanAllowance, TopUpPack, OverageUsage]
    PricingPriceEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        planTier: { type: string, nullable: true }
        organizationId: { type: string, format: uuid, nullable: true }
        skuKind: { $ref: "#/components/schemas/PricingSkuKind" }
        skuCode: { type: string, nullable: true }
        blossomQuantity: { type: number }
        priceLkr: { type: number }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: string, format: date-time, nullable: true }
        status: { $ref: "#/components/schemas/PricingRuleStatus" }
        changeReason: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreatePriceEntryRequest:
      type: object
      required: [skuKind, blossomQuantity, priceLkr, effectiveFrom, changeReason]
      properties:
        planTier: { $ref: "#/components/schemas/PlanTier" }
        organizationId: { type: string, format: uuid, nullable: true }
        skuKind: { $ref: "#/components/schemas/PricingSkuKind" }
        skuCode: { type: string, maxLength: 64, nullable: true }
        blossomQuantity: { type: number, minimum: 0, description: Must be greater than zero }
        priceLkr: { type: number, minimum: 0 }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: string, format: date-time, nullable: true }
        changeReason: { $ref: "#/components/schemas/AdjustmentReason" }
    UpdatePriceEntryRequest:
      type: object
      properties:
        blossomQuantity: { type: number, minimum: 0, description: Must be greater than zero }
        priceLkr: { type: number, minimum: 0 }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: string, format: date-time, nullable: true }
        changeReason: { $ref: "#/components/schemas/AdjustmentReason" }
        status: { $ref: "#/components/schemas/PricingRuleStatus" }

    # --- agent statistics ----------------------------------------------------
    AgentWorkflowRun:
      type: object
      properties:
        id: { type: string, format: uuid }
        workflowId: { type: string }
        requestId: { type: string, nullable: true }
        triggerKind: { $ref: "#/components/schemas/AgentTriggerKind" }
        conversationId: { type: string, format: uuid, nullable: true }
        customerId: { type: string, format: uuid, nullable: true }
        initiatedByUserId: { type: string, format: uuid, nullable: true }
        status: { $ref: "#/components/schemas/AgentRunStatus" }
        agentsInvolved:
          type: array
          items: { $ref: "#/components/schemas/AgentKey" }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
        durationMs: { type: integer, nullable: true }
        approvalWaitMs: { type: integer, nullable: true }
        stepCount: { type: integer }
        toolCallCount: { type: integer }
        retryCount: { type: integer }
        inputTokens: { type: integer }
        outputTokens: { type: integer }
        cachedTokens: { type: integer }
        actualCostUsd: { type: number }
        blossomUnits: { type: number }
        errorCode: { type: string, nullable: true }
        errorMessage: { type: string, nullable: true }
        isUnattributed: { type: boolean }
    AgentRunPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/AgentWorkflowRun" }
            dataQuality: { $ref: "#/components/schemas/DataQuality" }
            generatedAt: { type: string, format: date-time }
    AgentStepRun:
      type: object
      properties:
        id: { type: string, format: uuid }
        stepIndex: { type: integer }
        agentKey: { $ref: "#/components/schemas/AgentKey" }
        nodeName: { type: string }
        stepKind: { $ref: "#/components/schemas/AgentStepKind" }
        toolName: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/AgentStepStatus" }
        attemptNumber: { type: integer }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
        durationMs: { type: integer, nullable: true }
        provider: { type: string, nullable: true }
        model: { type: string, nullable: true }
        inputTokens: { type: integer }
        outputTokens: { type: integer }
        cachedTokens: { type: integer }
        actualCostUsd: { type: number }
        argsHash:
          type: string
          nullable: true
