# Tuned down from -Xmx3G: this host has 15G RAM, no swap, and the kernel was
# OOM-killing the Gradle daemon (see ~/.gradle/daemon logs). Keep the build JVM
# plus the Kotlin daemon well inside available memory.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=448m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.daemon=false
org.gradle.vfs.watch=false
# Compile Kotlin inside the Gradle JVM instead of forking a second multi-hundred-MB
# Kotlin daemon; the host has no swap and the kernel OOM-kills the build otherwise.
kotlin.compiler.execution.strategy=in-process
# Deliberately no `org.gradle.java.home` here.
#
# AGP 9 cannot run on a JDK newer than 21, so a host whose default `java` is
# newer needs a supported JDK. That path is machine-specific, and Gradle reads
# this property before any build script runs: if the path does not exist, the
# whole build dies with "Java home supplied is invalid" instead of falling back.
# A committed absolute path therefore breaks every CI runner and every other
# developer, which is exactly what it did.
#
# Select the JDK out of band instead, one of:
#   flutter config --jdk-dir=/path/to/jdk-21   (Flutter exports JAVA_HOME to Gradle)
#   JAVA_HOME=/path/to/jdk-21                  (for a shell or a CI step)
#   org.gradle.java.home=/path/to/jdk-21       (in ~/.gradle/gradle.properties,
#                                               the machine's own file, never here)
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
