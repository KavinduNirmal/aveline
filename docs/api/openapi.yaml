        "200":
          description: Health result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationView" }
        "400":
          description: Unknown integration type
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ---------------------------------------------------------------------------
  # Billing — existing
  # ---------------------------------------------------------------------------
  /api/v1/orgs/{organizationId}/usage:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Billing]
      summary: Read the current period Blossom usage summary
      description: |
        SHIPPED. Requires `catalog:view` via the `BoutiqueAccess` policy (the
        balance is not yet gated by a dedicated `billing:view` permission).

        KNOWN DEFECT: `monthlyBlossomLimit` is always created as the Seed tier value
        (150) regardless of the organization's actual plan, and is not updated on a
        plan change. Fixed in Phase 2.
      operationId: getUsageSummary
      responses:
        "200":
          description: Usage summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageSummary" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ---------------------------------------------------------------------------
  # Billing — new
  # ---------------------------------------------------------------------------
  /api/v1/orgs/{organizationId}/blossoms/balance:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Billing]
      summary: Read the authoritative Blossom balance
      description: |
        Phase 2. Requires the self-service balance read `billing:view:self`, held by
        every organization role (`boutique_staff`, `boutique_manager`,
        `boutique_supervisor`, `boutique_owner`), on an active membership for the
        organization in the route. It is deliberately **not** `billing:view`: that is
        the management read, which reaches usage statements and burn-rate and is held
        only by managers and owners. Do not cache this value client-side; it is the
        most correctness-sensitive read in the product.
      operationId: getBlossomBalance
      responses:
        "200":
          description: Balance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlossomBalance" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{organizationId}/blossoms/usage:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Billing]
      summary: Read Blossom consumption over a window
      description: Phase 2. Requires `billing:view`.
      operationId: getBlossomUsage
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: groupBy
          in: query
          schema:
            type: string
            enum: [day, provider, model, workflowId]
            default: day
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Usage series
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlossomUsageResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/blossoms/statement:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Billing]
      summary: Read the statement of account
      description: |
        Phase 2. Requires `billing:view`. Includes a `reconciliation` block that
        compares the projected balance with the ledger-derived balance. A non-zero
        `drift` is a Critical condition and must be surfaced, never hidden.
      operationId: getBlossomStatement
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: kind
          in: query
          description: Entitlement rows, consumption rows, or both.
          schema:
            type: string
            enum: [all, entitlement, consumption]
            default: all
        - name: entryType
          in: query
          description: |
            Restricts entitlement rows to one ledger entry type. A ledger concept, so supplying it
            excludes consumption rows entirely.
          schema:
            $ref: "#/components/schemas/BlossomLedgerEntryType"
        - name: sourceKind
          in: query
          description: Restricts entitlement rows to one source.
          schema:
            $ref: "#/components/schemas/BlossomSourceKind"
        - name: q
          in: query
          description: |
            Substring match over the reason or source reference; for consumption rows, over the
            workflow id, provider or model.
          schema: { type: string }
        - name: minAmount
          in: query
          description: |
            Inclusive lower bound on the signed ledger movement. A ledger concept, so supplying it
            excludes consumption rows entirely.
          schema: { type: number, format: decimal }
        - name: maxAmount
          in: query
          description: Inclusive upper bound on the signed ledger movement.
          schema: { type: number, format: decimal }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Statement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlossomStatementResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/customers:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Customers]
      summary: Read the boutique's client book
      description: |
        Requires an active membership for the organization in the route that
        grants `customers:view` (`BoutiqueCustomerAccess`). One call returns the
        whole narrowing, because the alphabet index has to reach every letter it
        offers. `level` is the boutique's own grade and is **nullable**: the server
        stores no grade until the shop sets one, and a default would invent a grade
        for every client.
      operationId: getCustomerBook
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: level
          in: query
          schema: { type: string, enum: [vip, level3, level2, level1] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        "200":
          description: The book
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerBookResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Customers]
      summary: Create a counter walk-in
      description: |
        A name is enough to start a profile. The walk-in de-duplicates on the name
        (the counter may not have a phone number), and a duplicate is reported with
        `duplicateOfCustomerId` and `200` rather than creating a second client.
        Requires `Idempotency-Key`.
      operationId: createWalkInCustomer
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWalkInCustomerRequest" }
      responses:
        "201":
          description: The client was created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerCreated" }
        "200":
          description: The client already existed; `duplicateOfCustomerId` names them
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerCreated" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: The idempotency lease store is unreachable; the request was refused, not applied.

  /api/v1/orgs/{organizationId}/customers/{customerId}/interactions:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: customerId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Customers]
      summary: Record a counter interaction (and a visit)
      description: |
        The write path behind Home's `Log a visit`. An interaction is recorded on
        every call; the customer's counters move only for an **inbound in-person**
        interaction, because a WhatsApp reply is not someone at the counter. A
        visit is **not billable**: consumption is an `AiUsageRecord` written after a
        completed agent workflow, so `blossomsCharged` is always `0`. The counter
        increment is a single atomic statement on a relational provider, so two
        concurrent visits cannot lose one. Requires `Idempotency-Key`.
      operationId: recordCustomerInteraction
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordCustomerInteractionRequest" }
      responses:
        "201":
          description: The interaction was recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisitReceipt" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: The idempotency lease store is unreachable; the request was refused, not applied.

  /api/v1/orgs/{organizationId}/customers/highlights:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Customers]
      summary: Read the clients with something happening right now
      description: |
        Home's `Direct client link` row, the `See all` sheet and the status ticker.
        The `activity` sentence is generated server-side from a real
        `Customer_Interactions` row, not authored prose. There is deliberately **no**
        read/unread flag: the schema has no per-user marker, and a dot that can
        never clear is worse than no dot.
      operationId: getCustomerHighlights
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: activitySince
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: The highlights
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerHighlightsResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/stats/home:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Home]
      summary: Read the derived focus deck for the organization's local day
      description: |
        Home's focus deck. Requires an active membership for the organization in
        the route that grants `catalog:view` (`BoutiqueAccess`), so every staff
        role can read the floor's work. The feed is **derived**, not stored:
        `wardrobe` comes from inventory at or below the reorder line, `patron` from
        upcoming customer events, and `commerce` from agent runs paused for a human
        decision — the last only when the caller's role holds `stats:view:agent`,
        which `dataQuality.commerceAvailable` reports. `logistics` has no writer in
        the product yet and is reported unavailable rather than counted as zero.
        The day comes from `Organization.TimeZone`, never from the device, and the
        window actually used is echoed back. Do not assume the caller's order is
        preserved: the deck is free to reorder locally.
      operationId: getHomeFeed
      responses:
        "200":
          description: The focus feed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeFeed" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/focus/dismissals:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      tags: [Home]
      summary: Record a human decision about one derived focus docket
      description: |
        The only persisted part of the focus deck. A dismissal is keyed by the
        docket's `sourceKey` (the underlying fact, not the docket id) and is bound
        to a server-computed hash of the docket's content, so a dismissal of
        "reorder the raw silk" does not silently suppress a later, different
        low-stock docket for the same item. Idempotent by nature: dismissing the
        same fact twice is the same end state, so a repeat is a replay rather than
        a conflict. The docket must be present in the caller's own feed; a docket
        from another organization is therefore indistinguishable from one that does
        not exist. Requires `Idempotency-Key`.
      operationId: dismissFocusTask
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DismissFocusTaskRequest" }
      responses:
        "200":
          description: The decision and the caller's refreshed counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FocusDismissalResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: The idempotency lease store is unreachable; the request was refused, not applied.

  /api/v1/orgs/{organizationId}/blossoms/top-ups:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      tags: [Billing]
      summary: Purchase a Blossom pack
      description: Phase 2. Requires `billing:manage`. Requires `Idempotency-Key`.
      operationId: purchaseBlossomTopUp
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skuCode]
              properties:
                skuCode:
                  type: string
                  maxLength: 64
                  example: blossom_pack_500
                blossomQuantity: { type: number, nullable: true }
                paymentReference: { type: string, maxLength: 128, nullable: true }
      responses:
        "201":
          description: Top-up granted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlossomLedgerEntryResponse" }
        "400":
          description: Validation failure or unknown SKU
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Period closed, or idempotency key reuse
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ---------------------------------------------------------------------------
  # Admin billing
  # ---------------------------------------------------------------------------
  /api/v1/admin/orgs/{organizationId}/blossoms/credit:
