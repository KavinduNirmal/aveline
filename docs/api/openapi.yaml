              key: { type: string }
              actualCostUsd: { type: number }
              blossomsCharged: { type: number }
              costPerBlossomUsd: { type: number, nullable: true }
              revenueLkr: { type: number, nullable: true }
              marginLkr: { type: number, nullable: true }
              runCount: { type: integer }
        dataQuality: { $ref: "#/components/schemas/DataQuality" }
        generatedAt: { type: string, format: date-time }
    OrgUsageRankingResponse:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            window: { type: string }
            items:
              type: array
              items:
                type: object
                properties:
                  rank: { type: integer }
                  organizationId: { type: string, format: uuid }
                  organizationName: { type: string }
                  planTier: { $ref: "#/components/schemas/PlanTier" }
                  blossomUsed: { type: number }
                  blossomLimit: { type: number, nullable: true }
                  percentUsed: { type: number, nullable: true }
    AdjustmentActivityResponse:
      type: object
      properties:
        series:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              entryType: { $ref: "#/components/schemas/BlossomLedgerEntryType" }
              count: { type: integer }
              totalBlossoms: { type: number }
        byActor:
          type: array
          items:
            type: object
            properties:
              actorUserId: { type: string, format: uuid, nullable: true }
              count: { type: integer }
              totalBlossoms: { type: number }
        generatedAt: { type: string, format: date-time }
    PlanChangeHistoryResponse:
      type: object
      properties:
        series:
          type: array
          items:
            type: object
            properties:
              day: { type: string, format: date }
              upgradeCount: { type: integer }
              downgradeCount: { type: integer }
              blossomDelta: { type: number }
        items:
          type: array
          items:
            type: object
            properties:
              organizationId: { type: string, format: uuid }
              fromTier: { $ref: "#/components/schemas/PlanTier" }
              toTier: { $ref: "#/components/schemas/PlanTier" }
              occurredAt: { type: string, format: date-time }
              blossomDelta: { type: number }
        generatedAt: { type: string, format: date-time }
    DowngradeStatisticsResponse:
      type: object
      properties:
        attempted: { type: integer }
        blocked: { type: integer }
        blockedRate: { type: number }
        byViolatedKey:
          type: object
          additionalProperties: { type: integer }
        generatedAt: { type: string, format: date-time }

    # --- audit ---------------------------------------------------------------
    AuditLogEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        organizationId: { type: string, format: uuid, nullable: true }
        actorKind: { type: string, enum: [User, ApiKey, InternalService, System] }
        actorUserId: { type: string, format: uuid, nullable: true }
        actorRef: { type: string, nullable: true }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: string }
        reason: { type: string, nullable: true }
        requestId: { type: string, nullable: true }
        before: { nullable: true }
        after: { nullable: true }
    AuditPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/AuditLogEntry" }

    # --- pricing recompute & billing entitlement statistics -------------------
    PricingRecomputeResult:
      type: object
      properties:
        ruleId: { type: string, format: uuid }
        processedRecords: { type: integer }
        affectedOrganizations: { type: integer }
        totalDelta: { type: number }
        recomputedAt: { type: string, format: date-time }

    ActiveCustomersResponse:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        activeCount: { type: integer }
        totalCount: { type: integer }
        asOf: { type: string, format: date-time }
        inactivityThresholdDays: { type: integer }

    StaffSeatsResponse:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        activeSeats: { type: integer }
        allowedSeats: { type: integer }
        roleBreakdown:
          type: object
          additionalProperties: { type: integer }
        asOf: { type: string, format: date-time }
    HomeFeedCaps:
      type: object
      properties:
        canComplete: { type: boolean }
        canAssign: { type: boolean }

    HomeFeedItem:
      type: object
      required: [id, sourceKey, domain, title, detail, actionLabel, doneMessage, contentHash, caps]
      properties:
        id:
          type: string
          description: Stable, opaque docket id. Addresses the docket, not the fact behind it.
        sourceKey:
          type: string
          description: Stable identifier of the underlying fact (inventory item, customer event, agent run). This is what a dismissal is keyed to.
        domain:
          type: string
          enum: [patron, logistics, wardrobe, commerce]
        title: { type: string, maxLength: 120 }
        detail: { type: string, maxLength: 300 }
        dueAtUtc:
          type: string
          format: date-time
          nullable: true
          description: The source of truth for "next". The client formats the clock from this.
        timeLabel:
          type: string
          nullable: true
          description: Optional pre-formatted fallback. Prefer formatting from dueAtUtc.
        actionLabel: { type: string, maxLength: 24 }
        doneMessage: { type: string, maxLength: 160 }
        contentHash:
          type: string
          description: Server hash of the docket's content. Echo only; the server recomputes it on dismissal.
        caps: { $ref: "#/components/schemas/HomeFeedCaps" }

    HomeFeedWindow:
      type: object
      properties:
        localDate: { type: string, format: date }
        timeZone: { type: string, description: The IANA zone the day was derived in. }

    HomeFeedDataQuality:
      type: object
      properties:
        wardrobeAvailable: { type: boolean }
        patronAvailable: { type: boolean }
        commerceAvailable: { type: boolean, description: False when the caller's role lacks stats:view:agent or no run is paused. }
        logisticsAvailable: { type: boolean, description: False until a delivery/intake writer exists. }

    HomeFeedCounts:
      type: object
      properties:
        total: { type: integer }
        overdue: { type: integer }
        byDomain:
          type: object
          additionalProperties: { type: integer }

    HomeFeed:
      type: object
      required: [generatedAt, window, dataQuality, items, counts]
      properties:
        generatedAt: { type: string, format: date-time }
        window: { $ref: "#/components/schemas/HomeFeedWindow" }
        dataQuality: { $ref: "#/components/schemas/HomeFeedDataQuality" }
        items:
          type: array
          items: { $ref: "#/components/schemas/HomeFeedItem" }
        counts: { $ref: "#/components/schemas/HomeFeedCounts" }

    DismissFocusTaskRequest:
      type: object
      required: [sourceKey, domain, decision]
      properties:
        sourceKey: { type: string, maxLength: 200 }
        domain: { type: string, enum: [patron, logistics, wardrobe, commerce] }
        decision: { type: string, enum: [acknowledge, approve, reject, markReady, signOff] }
        contentHash: { type: string, nullable: true, description: Echoed for audit; the server recomputes it. }
        note: { type: string, maxLength: 500, nullable: true }

    FocusDismissalResponse:
      type: object
      properties:
        dismissalId: { type: string, format: uuid }
        sourceKey: { type: string }
        domain: { type: string }
        decision: { type: string }
        dismissedAtUtc: { type: string, format: date-time }
        counts: { $ref: "#/components/schemas/HomeFeedCounts" }

    CustomerBookItem:
      type: object
      required: [customerId, status, phoneNumber]
      properties:
        customerId: { type: string, format: uuid }
        fullName: { type: string, nullable: true }
        nickname: { type: string, nullable: true }
        level:
          type: string
          nullable: true
          enum: [vip, level3, level2, level1, null]
          description: The boutique's own grade, or null when nobody has graded this client.
        status: { type: string, enum: [new, returning, vip, dormant] }
        phoneNumber: { type: string }
        lastVisitAtUtc: { type: string, format: date-time, nullable: true }
        visitCount: { type: integer }
        totalSpent: { type: number }

    CustomerBookResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CustomerBookItem" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    CustomerHighlight:
      type: object
      required: [customerId, name, activity]
      properties:
        customerId: { type: string, format: uuid }
        name: { type: string }
        level: { type: string, nullable: true, enum: [vip, level3, level2, level1, null] }
        activity: { type: string, maxLength: 160, description: Generated from a real Customer_Interactions row. }
        lastActivityAtUtc: { type: string, format: date-time, nullable: true }

    CustomerHighlightsResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CustomerHighlight" }

    CreateWalkInCustomerRequest:
      type: object
      required: [fullName]
      properties:
        fullName: { type: string, maxLength: 200 }
        phoneNumber: { type: string, maxLength: 50, nullable: true, description: Optional; without one the client cannot be de-duplicated against a future identify. }
        nickname: { type: string, nullable: true, description: Stored as a customer preference. }
        source: { type: string, enum: [counter_walkin, phone, whatsapp, instagram], default: counter_walkin }

    CustomerCreated:
      type: object
      properties:
        customerId: { type: string, format: uuid }
        fullName: { type: string, nullable: true }
        level: { type: string, nullable: true, enum: [vip, level3, level2, level1, null] }
        status: { type: string, enum: [new, returning, vip, dormant] }
        consentStatus: { type: string, enum: [pending, granted, revoked, unknown] }
        createdAtUtc: { type: string, format: date-time }
        duplicateOfCustomerId:
          type: string
          format: uuid
          nullable: true
          description: Set when the server matched an existing record instead of creating one.

    RecordCustomerInteractionRequest:
      type: object
      required: [occurredAtUtc, channel]
      properties:
        occurredAtUtc: { type: string, format: date-time }
        channel: { type: string, enum: [in_person, phone, whatsapp, instagram] }
        direction: { type: string, enum: [inbound, outbound], default: inbound }
        note: { type: string, maxLength: 4000, nullable: true }
        purchaseTotal: { type: number, nullable: true, minimum: 0, description: When present, feeds TotalSpent and the loyalty rule. }

    VisitReceipt:
      type: object
      properties:
        visitId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        occurredAtUtc: { type: string, format: date-time }
        channel: { type: string }
        countedAsVisit: { type: boolean }
        visitCountAfter: { type: integer }
        lastVisitAtUtcAfter: { type: string, format: date-time, nullable: true }
        tierAfter: { type: string, enum: [new, returning, vip, dormant] }
        blossomsCharged: { type: number, description: Always 0; a visit is not billable. }
