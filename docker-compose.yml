# =============================================================================
# Aveline — local development infrastructure.
#
# PRODUCTION HARDENING: the `ports:` mappings on `postgres`, `redis` and the
# `otel-collector`/`jaeger` services expose those containers to the host for
# local development only. In production, remove the `ports:` blocks (or set them
# to `[]`) so PostgreSQL/Redis are reachable only inside the compose network, and
# front the API with a reverse proxy. The agent service is intentionally never
# exposed to the host (it is reached only via http://agent:8000 internally).
# =============================================================================
services:
  # ---------------------------------------------------------------------------
  # PostgreSQL with pgvector extension
  # ---------------------------------------------------------------------------
  postgres:
    # No official alpine variant of pgvector exists; bookworm (Debian 12) is the
    # smallest stable base published. The generic `pg16` tag tracks `trixie`.
    image: pgvector/pgvector:pg16-bookworm
    container_name: aveline_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aveline}
      POSTGRES_USER: ${POSTGRES_USER:-aveline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aveline}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis — caching layer
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: aveline_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # ASP.NET Core Web API
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./Aveline.Api
      dockerfile: Dockerfile
    container_name: aveline_api
    restart: unless-stopped
    # Host port 5091 matches the web client default (VITE_API_BASE_URL=http://localhost:5091)
    # and the local `dotnet run` port, so the frontend reaches the backend in either mode.
    ports:
      - "${API_PORT:-5091}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Bind to 0.0.0.0:8080 inside the container so the published API is reachable on the
      # port the container EXPOSEs / that compose forwards to.
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-aveline};
        Username=${POSTGRES_USER:-aveline};Password=${POSTGRES_PASSWORD}
      Redis__ConnectionString: redis:6379
      # Event types the API consumes from the agent service.
      Eventing__SubscribeEventTypes__0: ${EVENTING_SUBSCRIBE_EVENT_TYPES_0:-}
      Eventing__SubscribeEventTypes__1: ${EVENTING_SUBSCRIBE_EVENT_TYPES_1:-}
      Eventing__SubscribeEventTypes__2: ${EVENTING_SUBSCRIBE_EVENT_TYPES_2:-}
      AgentService__BaseUrl: http://agent:8000
      AgentService__InternalToken: ${INTERNAL_API_TOKEN:-change-me-internal-token}
      # AES-256-GCM key for tenant integration credentials (base64, 32 bytes).
      Credentials__EncryptionKey: ${CREDENTIALS_ENCRYPTION_KEY:?CREDENTIALS_ENCRYPTION_KEY is required}
      # WhatsApp (Meta) integration gateway — base URL + API version (defaults used if unset).
      WhatsApp__BaseUrl: ${WHATSAPP_BASE_URL:-https://graph.facebook.com}
      WhatsApp__ApiVersion: ${WHATSAPP_API_VERSION:-v21.0}
      # Optional Meta webhook IP allow-list (comma-separated). Empty = any IP (HMAC still enforced).
      Webhook__AllowedIps: ${WEBHOOK_ALLOWED_IPS:-}
      # Public base URL used to build staff-invitation links.
      App__BaseUrl: ${APP_BASE_URL:-http://localhost:5173}
      # Browser origin allowed to call the API. Defaults to the Vite dev server.
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:-http://localhost:5173}
      # Firebase Cloud Messaging (push). ProjectId is also in appsettings.json; the
      # credentials path points at the mounted service-account key (see volumes below).
      Firebase__ProjectId: ${FIREBASE_PROJECT_ID:-aveline-e35a5}
      Firebase__CredentialsPath: /run/secrets/firebase-service-account.json
      # Add other env vars here (Clerk, WhatsApp, payment gateway keys, etc.)
    volumes:
      # Service-account key for FCM push. Create it in the Firebase console
      # (Project settings > Service accounts > Generate new private key) and save it as
      # ./firebase-service-account.json (gitignored).
      - ./firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Python Agent Service (FastAPI + LangGraph)
  # ---------------------------------------------------------------------------
  agent:
    build:
      context: ./agnet-service
      dockerfile: Dockerfile
    container_name: aveline_agent
    restart: unless-stopped
    # NOTE: intentionally NOT exposed to the host — the agent is only reachable
    # within the compose network via http://agent:8000 (service-to-service auth).
    expose:
      - "8000"
    environment:
      DATABASE_URL: >-
        postgresql+asyncpg://${POSTGRES_USER:-aveline}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aveline}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-change-me-internal-token}
      # Redis Pub/Sub event bus (ADR-014). The agent subscribes to aveline:*:<event_type>.
      REDIS_URL: redis://redis:6379/0
      # Event types this service consumes from the API (empty until a consumer lands).
      SUBSCRIBE_EVENT_TYPES: ${SUBSCRIBE_EVENT_TYPES:-}
      # LLM provider (openai | deepseek), switched at runtime.
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      # Observability (OpenTelemetry) — export traces to the otel-collector.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: aveline-agent-service
      # Set to "false" in production to strip prompt/completion content from spans.
      OTEL_TRACE_CONTENT: ${OTEL_TRACE_CONTENT:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started

  # ---------------------------------------------------------------------------
  # OpenTelemetry Collector — receives OTLP traces from the agent service.
  # ---------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: aveline_otel_collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4318:4318" # OTLP HTTP receiver
    depends_on:
      - jaeger

  # ---------------------------------------------------------------------------
  # Jaeger — trace visualization UI (localhost:16686).
  # ---------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: aveline_jaeger
    restart: unless-stopped
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317" # OTLP gRPC receiver (collector forwards here)

volumes:
  postgres_data:
    driver: local
