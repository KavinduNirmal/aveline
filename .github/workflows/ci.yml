name: Aveline CI

on:
  push:
    branches: [main, master, development]
  pull_request:
    branches: [main, master, development]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Repository Hygiene (Locks, Env, Secrets)
  # ---------------------------------------------------------------------------
  hygiene:
    name: Repository Hygiene & Lockfile Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify only bun lockfile exists
        run: |
          echo "Checking for disallowed package manager lockfiles..."
          DISALLOWED=$(find . -name "package-lock.json" -o -name "yarn.lock" -o -name "pnpm-lock.yaml" -o -name "pnpm-lock.yml" -o -name "npm-shrinkwrap.json" | grep -v node_modules || true)
          if [ -n "$DISALLOWED" ]; then
            echo "::error::Disallowed lockfiles found in repository. Only bun.lock / bun.lockb is permitted:"
            echo "$DISALLOWED"
            exit 1
          fi
          echo "✓ Lockfile hygiene passed"

      - name: Verify no .env files committed
        run: |
          echo "Checking for committed .env files..."
          ENV_FILES=$(find . -name ".env" -o -name ".env.local" -o -name ".env.production" -o -name ".env.development" | grep -v "\.env\.example" || true)
          if [ -n "$ENV_FILES" ]; then
            echo "::error::Committed environment file(s) detected:"
            echo "$ENV_FILES"
            exit 1
          fi
          echo "✓ No .env files found"

  # ---------------------------------------------------------------------------
  # Job 2: Build, Test & Publish — ASP.NET Core API
  # ---------------------------------------------------------------------------
  build-api:
    name: Build, Test & Publish API
    runs-on: ubuntu-latest
    needs: hygiene

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Aveline.Api/Aveline.Api.sln

      - name: Build API
        run: dotnet build Aveline.Api/Aveline.Api.sln --no-restore -c Release

      - name: Test API
        run: dotnet test Aveline.Api/Aveline.Api.sln --no-build --no-restore -c Release

      - name: Collect code coverage
        run: dotnet test Aveline.Api/Aveline.Api.sln -c Release --no-build --no-restore --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Enforce coverage threshold (line >= 30%)
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          files = glob.glob('TestResults/**/coverage.cobertura.xml', recursive=True)
          assert files, 'No coverage file found'
          root = ET.parse(files[0]).getroot()
          covered = int(root.get('lines-covered')); valid = int(root.get('lines-valid'))
          rate = covered / valid if valid else 0
          print(f'Line coverage: {covered}/{valid} = {rate:.1%}')
          if rate < 0.30:
              print('::error::Line coverage below 30% threshold')
              raise SystemExit(1)
          EOF

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: reportgenerator -reports:TestResults/**/coverage.cobertura.xml -targetdir:coverage-report -reporttypes:Html

      - name: Upload API coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aveline-api-coverage
          path: coverage-report

      - name: Publish API
        run: dotnet publish Aveline.Api/Aveline.Api.csproj -c Release --no-restore -o api-publish

      - name: Upload API artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aveline-api
          path: api-publish

  # ---------------------------------------------------------------------------
  # Job 3: Lint & Test — Python Agent Service
  # ---------------------------------------------------------------------------
  test-python:
    name: Lint & Test Python Agent Service
    runs-on: ubuntu-latest
    needs: hygiene

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies & linter
        run: |
          python -m pip install --upgrade pip
          pip install -r agnet-service/requirements.txt -r agnet-service/requirements-dev.txt

      - name: Run Ruff Lint
        run: ruff check agnet-service/app/

      - name: Run Pytest (coverage gate >= 90%)
        run: pytest tests/ --cov=app --cov-report=xml:coverage.xml --cov-report=term --cov-fail-under=90
        working-directory: agnet-service

      - name: Upload agent coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aveline-agent-coverage
          path: agnet-service/coverage.xml

  # ---------------------------------------------------------------------------
  # Job 4: Build, Test & Lint — Vite Web Dashboard
  # ---------------------------------------------------------------------------
  test-web:
    name: Build, Test & Lint Web Dashboard
    runs-on: ubuntu-latest
    needs: hygiene

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: frontend/web

      - name: Lint
        run: bun run lint
        working-directory: frontend/web

      - name: "Test (coverage gate: lines >= 80%)"
        run: bun run test:coverage
        working-directory: frontend/web

      - name: Upload web coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aveline-web-coverage
          path: frontend/web/coverage

      - name: Build
        env:
          # Optional: enables a fully functional bundle when the secret is set.
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: bun run build
        working-directory: frontend/web

      - name: Upload web artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aveline-web
          path: frontend/web/dist

  # ---------------------------------------------------------------------------
  # Job 5: Analyze, Test & Build — Flutter Mobile App
  # ---------------------------------------------------------------------------
  test-flutter:
    name: Analyze, Test & Build Flutter App
    runs-on: ubuntu-latest
    needs: hygiene

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get
        working-directory: frontend/aveline_mobile

      - name: Analyze Flutter codebase
        run: flutter analyze --no-fatal-infos
        working-directory: frontend/aveline_mobile

      - name: Run Flutter tests (with coverage)
        run: flutter test --coverage
        working-directory: frontend/aveline_mobile

      - name: Upload Flutter coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aveline-mobile-coverage
          path: frontend/aveline_mobile/coverage/lcov.info

      - name: Build release APK
        run: flutter build apk --release
        working-directory: frontend/aveline_mobile

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aveline-mobile-apk
          path: frontend/aveline_mobile/build/app/outputs/flutter-apk

  # ---------------------------------------------------------------------------
  # Job 6: Security & Dependency Scan
  # ---------------------------------------------------------------------------
  security-scan:
    name: Security & Dependency Scan
    runs-on: ubuntu-latest
    needs: hygiene
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Aveline.Api/Aveline.Api.sln

      - name: Scan .NET packages for vulnerabilities
        run: |
          dotnet list Aveline.Api/Aveline.Api.sln package --vulnerable --include-transitive > /tmp/dotnet-vuln.txt 2>&1
          cat /tmp/dotnet-vuln.txt
          if grep -q "has the following vulnerable packages" /tmp/dotnet-vuln.txt; then
            echo "::error::Vulnerable .NET packages found (see GHSA advisories above)"
            exit 1
          fi
          echo "✓ No vulnerable .NET packages"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Scan web dependencies
        working-directory: frontend/web
        run: bun audit --audit-level high

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: node_modules,.git,build,dist
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        # Best effort: requires "Code scanning" to be enabled in repo settings.
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

  # ---------------------------------------------------------------------------
  # Job 7: OWASP ZAP baseline scan against a locally booted API (best effort)
  # ---------------------------------------------------------------------------
  zap-baseline:
    name: ZAP Baseline Scan (Auth API)
    runs-on: ubuntu-latest
    needs: hygiene
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore & build API
        run: |
          dotnet restore Aveline.Api/Aveline.Api.sln
          dotnet build Aveline.Api/Aveline.Api.sln --no-restore -c Release

      - name: Start API
        env:
          # Development profile loads Clerk authority + agent config from
          # appsettings.Development.json; the env override is a safety net.
          ASPNETCORE_ENVIRONMENT: Development
          Clerk__Authority: https://inspired-warthog-8208.clerk.accounts.dev
        run: |
          nohup dotnet run --project Aveline.Api/Aveline.Api.csproj -c Release --no-build \
            --no-launch-profile --urls http://127.0.0.1:5091 > /tmp/api.log 2>&1 &
          UP=0
          for i in $(seq 1 45); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5091/api/v1/policies/associate || true)
            if [ "$code" != "000" ]; then
              echo "API is up (HTTP $code)"
              UP=1
              break
            fi
            sleep 2
          done
          if [ "$UP" != "1" ]; then
            echo "::error::API failed to start"
            tail -20 /tmp/api.log
            exit 1
          fi

      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@6c5a007541891231cd9e0ddec25d4f25c59c9874 # v0.15.0
        with:
          target: http://127.0.0.1:5091
          cmd_options: "-J results.json"

      - name: Upload ZAP report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: aveline-zap-baseline
          path: results.json

  # ---------------------------------------------------------------------------
  # Job 8: Publish versioned Android APK GitHub Release (master pushes only)
  # ---------------------------------------------------------------------------
  release-android:
    name: Publish Android APK Release
    # Only real pushes to the stable branch produce a release; PRs never do.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: test-flutter
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download APK artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: aveline-mobile-apk
          path: apk

      - name: Derive app version from pubspec
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version: *\(.*\)/\1/p' frontend/aveline_mobile/pubspec.yaml | head -1)"
          if [ -z "$VERSION" ]; then
            echo "::error::Unable to read version from frontend/aveline_mobile/pubspec.yaml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "safe=${VERSION//+/.}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SAFE="${{ steps.version.outputs.safe }}"
          RUN_NUMBER="${{ github.run_number }}"
          TAG="v${SAFE}-build.${RUN_NUMBER}"
          APK="$(find apk -name '*.apk' -type f | head -1)"
          if [ -z "$APK" ]; then
            echo "::error::No APK found in the aveline-mobile-apk artifact."
            exit 1
          fi
          gh release create "$TAG" "$APK#aveline-mobile-${SAFE}-build.${RUN_NUMBER}.apk" \
            --repo "${{ github.repository }}" \
            --title "Aveline Mobile v${VERSION} (build #${RUN_NUMBER})" \
            --notes "Automated release from \`master\` at ${{ github.sha }}." \
            --target master
