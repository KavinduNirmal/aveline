  # ---------------------------------------------------------------------------
  # Billing — new
  # ---------------------------------------------------------------------------
  /api/v1/orgs/{organizationId}/blossoms/balance:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Billing]
      summary: Read the authoritative Blossom balance
      description: |
        Phase 2. Requires the self-service balance read `billing:view:self`, held by
        every organization role (`boutique_staff`, `boutique_manager`,
        `boutique_supervisor`, `boutique_owner`), on an active membership for the
        organization in the route. It is deliberately **not** `billing:view`: that is
        the management read, which reaches usage statements and burn-rate and is held
        only by managers and owners. Do not cache this value client-side; it is the
        most correctness-sensitive read in the product.
      operationId: getBlossomBalance
      responses:
        "200":
          description: Balance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlossomBalance" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{organizationId}/blossoms/usage:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Billing]
      summary: Read Blossom consumption over a window
      description: Phase 2. Requires `billing:view`.
      operationId: getBlossomUsage
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: groupBy
          in: query
          schema:
            type: string
            enum: [day, provider, model, workflowId]
            default: day
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Usage series
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlossomUsageResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/blossoms/statement:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Billing]
      summary: Read the statement of account
      description: |
        Phase 2. Requires `billing:view`. Includes a `reconciliation` block that
        compares the projected balance with the ledger-derived balance. A non-zero
        `drift` is a Critical condition and must be surfaced, never hidden.
      operationId: getBlossomStatement
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: kind
          in: query
          description: Entitlement rows, consumption rows, or both.
          schema:
            type: string
            enum: [all, entitlement, consumption]
            default: all
        - name: entryType
          in: query
          description: |
            Restricts entitlement rows to one ledger entry type. A ledger concept, so supplying it
            excludes consumption rows entirely.
          schema:
            $ref: "#/components/schemas/BlossomLedgerEntryType"
        - name: sourceKind
          in: query
          description: Restricts entitlement rows to one source.
          schema:
            $ref: "#/components/schemas/BlossomSourceKind"
        - name: q
          in: query
          description: |
            Substring match over the reason or source reference; for consumption rows, over the
            workflow id, provider or model.
          schema: { type: string }
        - name: minAmount
          in: query
          description: |
            Inclusive lower bound on the signed ledger movement. A ledger concept, so supplying it
            excludes consumption rows entirely.
          schema: { type: number, format: decimal }
        - name: maxAmount
          in: query
          description: Inclusive upper bound on the signed ledger movement.
          schema: { type: number, format: decimal }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Statement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlossomStatementResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/customers:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Customers]
      summary: Read the boutique's client book
      description: |
        Requires an active membership for the organization in the route that
        grants `customers:view` (`BoutiqueCustomerAccess`). One call returns the
        whole narrowing, because the alphabet index has to reach every letter it
        offers. `level` is the boutique's own grade and is **nullable**: the server
        stores no grade until the shop sets one, and a default would invent a grade
        for every client.
      operationId: getCustomerBook
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: level
          in: query
          schema: { type: string, enum: [vip, level3, level2, level1] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        "200":
          description: The book
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerBookResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Customers]
      summary: Create a counter walk-in
      description: |
        A name is enough to start a profile. The walk-in de-duplicates on the name
        (the counter may not have a phone number), and a duplicate is reported with
        `duplicateOfCustomerId` and `200` rather than creating a second client.
        Requires `Idempotency-Key`.
      operationId: createWalkInCustomer
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWalkInCustomerRequest" }
      responses:
        "201":
          description: The client was created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerCreated" }
        "200":
          description: The client already existed; `duplicateOfCustomerId` names them
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerCreated" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: |
            `customer-phone-conflict` — another client in this organization already holds that
            phone number. The unique `(OrganizationId, PhoneNumber)` index used to surface as an
            unmapped `DbUpdateException` and therefore a `500`; a pre-check in the service makes the
            collision a typed outcome on every provider.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, const: customer-phone-conflict }
                  message: { type: string }
        "503":
          description: The idempotency lease store is unreachable; the request was refused, not applied.

  # ---------------------------------------------------------------------------
  # Tenant customer CRUD — read one, patch, delete (E-6…E-9)
  #
  # E-6 repairs a dangling contract: `POST …/interactions` already emitted
  # `Location: …/customers/{customerId}` and that GET did not exist until this route.
  # ---------------------------------------------------------------------------
  /api/v1/orgs/{organizationId}/customers/{customerId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: customerId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Customers]
      summary: Read one client (E-6)
      description: |
        SHIPPED. `BoutiqueCustomerAccess` (`customers:view`).

        The shape is deliberately **not** the internal customer shape: no memory, no extracted AI
        context and no internal-token field reaches a staff device. `loyaltyTierIsDerived` is the
        constant `1` so a client cannot render an editable tier control — `status` is derived by
        `CustomerLoyaltyService.RecommendStatus` from spend, visits and recency.

        `404` means "not in this boutique, or deleted". The server makes those indistinguishable on
        purpose, matching the by-slug precedent, so the client must not guess which it was.
      operationId: getTenantCustomer
      responses:
        "200":
          description: The client
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantCustomerDetail" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Customers]
      summary: Update one client (E-7)
      description: |
        SHIPPED. `BoutiqueCustomerManage` (`customers:manage`) — `customers:view` is held by every
        role, so there was nothing correct to gate a write on.

        The writable subset is `fullName`, `nickname`, `phoneNumber`, `email` and `level`.
        **`status` is absent on purpose**: it is derived, so a writable field would let the UI
        contradict the loyalty rule, and a `status` sent in the body is ignored.

        `phoneNumber` is normalised to E.164 through the existing `PhoneNormalizer`. A number that
        is not a recognised Sri Lankan form is `400`; a number another client in this organization
        already holds is `409 customer-phone-conflict`.
      operationId: updateTenantCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCustomerRequest" }
      responses:
        "200":
          description: The updated client
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantCustomerDetail" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            `customer-phone-conflict` — another client in this organization already holds that
            number.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, const: customer-phone-conflict }
                  message: { type: string }
    delete:
      tags: [Customers]
      summary: Remove one client (E-8)
      description: |
        SHIPPED. `BoutiqueCustomerManage` (`customers:manage`).

        **Soft**: `DeletedAt` is set, matching the existing global query filter, so the client is
        invisible to every read.

        **Idempotent**: deleting an already-deleted client is `204`, not `404`. The deletion is the
        end state, and the soft-delete filter means the caller could not have distinguished the two
        anyway.

        **Refused with 409** when the client has orders in a non-terminal status. Terminal means
        `completed`, `cancelled` or `rejected` — the three with no outgoing edge in
        `OrderService.ValidTransitions`. This is a **business guard, not referential integrity**:
        `Order.CustomerId` is a bare `Guid` with no foreign key, and `Order.CustomerName` is
        denormalised, so nothing is orphaned and a deleted client's orders stay readable.
      operationId: deleteTenantCustomer
      responses:
        "204":
          description: The client is removed (or already was)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            `customer-has-open-orders` — the client has orders that are still live.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, const: customer-has-open-orders }
                  openOrders: { type: integer }
                  message: { type: string }

  # ---------------------------------------------------------------------------
  # Boutique income (S-60, S-61) — the shop's own takings.
  #
  # A different economy from `/admin/revenue`, which records what Aveline billed a boutique. The two
  # are never summed and no route reads both. `amount` is always positive and the sign is applied by
  # the reader from `kind`, so a column sum cannot net a refund against a sale by accident.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Tenant dashboard KPIs and the reduced takings read (S-57…S-59, E-13).
  #
  # Two policies: the reduced read is member-level because every role may see two labelled figures;
  # the full strip carries margin and the series, so it stays behind `reports:view`.
  # ---------------------------------------------------------------------------
  /api/v1/orgs/{organizationId}/dashboard/takings:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Dashboard]
      summary: Read the boutique's takings, reduced to two labelled figures
      description: |
        SHIPPED. `BoutiqueMember` — any active member, because a section is visible when its cheapest
        panel is readable.

        Carries **exactly** `collected` (verified money minus refunds) and `billedUnconfirmed`
        (derived billed value). There is deliberately no margin, no per-client or per-operator split,
        no register and no series. The reduction is enforced by the shape of the response: a test
        enumerates the serialised field names and fails if anything outside the allowed set appears.
      operationId: getTenantTakings
      parameters:
        - name: window
          in: query
          schema: { type: string, enum: [7d, 30d, 90d, mtd, ytd], default: 30d }
      responses:
        "200":
          description: The two labelled figures
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantTakings" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/dashboard/summary:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Dashboard]
      summary: Read the tenant dashboard's KPI summary for a window
      description: |
        SHIPPED. `BoutiqueReportsView` (`reports:view`).

        **Every absent number is `null`, never `0`.** `0` is a measurement — nobody ordered — while
        `null` is the absence of one. `sales.marginCostsComplete` is `false` when any contributing
        order carries a zero `WholesaleCost`, which is caller-supplied rather than read from the
        inventory record. `cash` reports collected, outstanding and refunded separately so an
        expiring request is never presented as a receivable.

        Cached for 60 seconds per `(organizationId, window)`. **A cache outage degrades rather than
        fails**: the figures are computed directly and the `dataQuality` notes say so.
      operationId: getTenantDashboardSummary
      parameters:
        - name: window
          in: query
          schema: { type: string, enum: [7d, 30d, 90d, mtd, ytd], default: 30d }
      responses:
        "200":
          description: The KPI groups and the data-quality block
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantDashboardSummary" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/dashboard/revenue-series:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Dashboard]
      summary: Read the boutique's revenue series over a window
      description: |
        SHIPPED. `BoutiqueReportsView` (`reports:view`).

        Dense buckets. **A bucket with no orders carries `null`, not `0`**, so the client renders a
        gap rather than a line drawn through a measurement the server never produced. The window cap
        is echoed in `windowCapped` rather than applied silently.
      operationId: getTenantRevenueSeries
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: bucket
          in: query
          schema: { type: string, enum: [day, week, month], default: day }
      responses:
        "200":
          description: The dense series
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantRevenueSeries" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/dashboard/top-items:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Dashboard]
      summary: Read the boutique's best-selling pieces in a window
      description: |
        SHIPPED. `BoutiqueReportsView` (`reports:view`).

        Grouped on the denormalised `ItemName`, because `OrderItem.ItemId` has no enforced link to the
        catalogue: a renamed piece appears under both names rather than being silently merged.
      operationId: getTenantTopItems
      parameters:
        - name: window
          in: query
          schema: { type: string, enum: [7d, 30d, 90d, mtd, ytd], default: 30d }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 5 }
      responses:
        "200":
          description: The ranked pieces
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantTopItems" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/billing/periods:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Billing]
      summary: Read the boutique's billing-period history
      description: |
        SHIPPED (E-12 / S-62). `BillingView` (`billing:view`).

        The most recent billing periods, newest first: the period's Blossom account, its plan, and the
        top-ups that landed in it.

        **`planListPriceLkr` is `null` whenever the stored `PriceLkr` is zero**, never `0`, with
        `subscriptionPricesConfigured` saying whether a price was configured. `PriceLkr` is never
        assigned anywhere in the product, so reading the column directly would print `LKR 0` as the
        plan price of every subscription.

        `planTier`/`hasSubscriptionRow` come from the day's `OrganizationSubscriptionSnapshot`, not from
        `Organization.PlanTier`: a tier exists even for an organization that never had a billing row.

        A **statement of account, not an invoice** — no payment provider is connected.
      operationId: getTenantBillingPeriods
      parameters:
        - name: take
          in: query
          schema: { type: integer, minimum: 1, maximum: 24, default: 12 }
      responses:
        "200":
          description: The period history, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BillingPeriod" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/blossoms/top-up-packs:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Blossoms]
      summary: List the Blossom top-up packs this boutique may purchase
      description: |
        SHIPPED (E-11 / S-63). `BillingManage` (`billing:manage`) — deliberately the **same permission
        as the purchase it feeds**: whoever may not buy may not see what is for sale either.

        The active `TopUpPack` price-book rows, ordered by size. The lookup is identical to the one
        `POST …/blossoms/top-ups` performs, so a pack offered here cannot be rejected at purchase and a
        pack accepted there cannot be missing. A draft row is not listed.

        No payment provider is connected, so a purchase records a grant rather than a charge.
      operationId: getBlossomTopUpPacks
      responses:
        "200":
          description: The active top-up packs, ordered by size
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TopUpPack" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/income/ledger:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Income]
      summary: Read the boutique's income register with its window totals
      description: |
        SHIPPED. `BoutiqueReportsView` (`reports:view`) — org-scoped, so a cross-tenant caller is
        refused. Staff hold no `reports:view`; their reduced takings card is a separate route.

        `derivedTotal` is **billed value with no evidence of collection** and `verifiedTotal` is
        money taken. They are reported separately and **never summed into one unlabelled figure**.
        `unverifiedGap` is the distance between them and is the surface's most important number, not
        an error. Each `kind` also carries its own total, so a refund is never netted into a sale
        figure without a label.

        The totals and the reconciliation block cover the **whole window**, not the page.

        A window longer than `TenantDashboard:MaxWindowDays` (default 400) is capped and the cap is
        **echoed** in `windowCapped` and the effective `window`, never applied silently.
      operationId: getBoutiqueIncomeLedger
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: kind
          in: query
          description: An unknown value is a 400 naming the known kinds, never ignored.
          schema: { type: string, enum: [Sale, PaymentReceived, Refund, Adjustment] }
        - name: basis
          in: query
          description: An unknown value is a 400 naming the known bases, never ignored.
          schema: { type: string, enum: [Derived, Verified] }
        - name: q
          in: query
          description: Searches `reason` and `sourceRef`.
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: The register page with the window's totals and reconciliation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoutiqueIncomeLedgerPage" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/income/accounts:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Income]
      summary: Read the boutique's takings broken down by kind
      description: |
        SHIPPED. `BoutiqueReportsView` (`reports:view`).

        One total and count per `kind`, plus a `byPaymentMethod` split for cash entries. That split
        is read from the **payment rows**, joined on `paymentId`, rather than inferred: a ledger
        entry carries no payment method of its own, and inventing one would be the fabrication this
        surface exists to avoid.
      operationId: getBoutiqueIncomeAccounts
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Per-kind totals and the payment-method split
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoutiqueIncomeAccounts" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/customers/{customerId}/interactions:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: customerId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Customers]
      summary: Read one client's interaction history (E-9)
      description: |
        SHIPPED. `BoutiqueCustomerAccess` (`customers:view`).

        Without this read a client's `visitCount` had no ledger behind it: the detail shape reported a
        total with nothing to show the visits it counted. The history is the same rows the counter
        writes through `POST …/interactions`, newest first, and it deliberately carries **no money** —
        `countedAsVisit` says whether a row moved the client's counters, not what it was worth.

        `404` means "not in this boutique, or deleted". The server makes those indistinguishable on
        purpose, matching the by-slug precedent, so the client must not guess which it was.
      operationId: getCustomerInteractions
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: The client's interaction history, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerInteractionPage" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Customers]
      summary: Record a counter interaction (and a visit)
      description: |
        The write path behind Home's `Log a visit`. An interaction is recorded on
        every call; the customer's counters move only for an **inbound in-person**
        interaction, because a WhatsApp reply is not someone at the counter. A
        visit is **not billable**: consumption is an `AiUsageRecord` written after a
        completed agent workflow, so `blossomsCharged` is always `0`. The counter
        increment is a single atomic statement on a relational provider, so two
        concurrent visits cannot lose one. Requires `Idempotency-Key`.
      operationId: recordCustomerInteraction
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordCustomerInteractionRequest" }
      responses:
        "201":
          description: The interaction was recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisitReceipt" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: The idempotency lease store is unreachable; the request was refused, not applied.

  /api/v1/orgs/{organizationId}/customers/highlights:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Customers]
      summary: Read the clients with something happening right now
      description: |
        Home's `Direct client link` row, the `See all` sheet and the status ticker.
        The `activity` sentence is generated server-side from a real
        `Customer_Interactions` row, not authored prose. There is deliberately **no**
        read/unread flag: the schema has no per-user marker, and a dot that can
        never clear is worse than no dot.
      operationId: getCustomerHighlights
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: activitySince
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: The highlights
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerHighlightsResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/stats/home:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Home]
      summary: Read the derived focus deck for the organization's local day
      description: |
        Home's focus deck. Requires an active membership for the organization in
        the route that grants `catalog:view` (`BoutiqueAccess`), so every staff
        role can read the floor's work. The feed is **derived**, not stored:
        `wardrobe` comes from inventory at or below the reorder line, `patron` from
        upcoming customer events, and `commerce` from agent runs paused for a human
        decision — the last only when the caller's role holds `stats:view:agent`,
        which `dataQuality.commerceAvailable` reports. `logistics` has no writer in
        the product yet and is reported unavailable rather than counted as zero.
        The day comes from `Organization.TimeZone`, never from the device, and the
        window actually used is echoed back. Do not assume the caller's order is
        preserved: the deck is free to reorder locally.
      operationId: getHomeFeed
      responses:
        "200":
          description: The focus feed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeFeed" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/focus/dismissals:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      tags: [Home]
      summary: Record a human decision about one derived focus docket
      description: |
        The only persisted part of the focus deck. A dismissal is keyed by the
        docket's `sourceKey` (the underlying fact, not the docket id) and is bound
        to a server-computed hash of the docket's content, so a dismissal of
        "reorder the raw silk" does not silently suppress a later, different
        low-stock docket for the same item. Idempotent by nature: dismissing the
        same fact twice is the same end state, so a repeat is a replay rather than
        a conflict. The docket must be present in the caller's own feed; a docket
        from another organization is therefore indistinguishable from one that does
        not exist. Requires `Idempotency-Key`.
      operationId: dismissFocusTask
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DismissFocusTaskRequest" }
      responses:
        "200":
          description: The decision and the caller's refreshed counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FocusDismissalResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: The idempotency lease store is unreachable; the request was refused, not applied.

  /api/v1/orgs/{organizationId}/blossoms/top-ups:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      tags: [Billing]
      summary: Purchase a Blossom pack
      description: Phase 2. Requires `billing:manage`. Requires `Idempotency-Key`.
      operationId: purchaseBlossomTopUp
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skuCode]
              properties:
                skuCode:
                  type: string
                  maxLength: 64
                  example: blossom_pack_500
                blossomQuantity: { type: number, nullable: true }
                paymentReference: { type: string, maxLength: 128, nullable: true }
      responses:
        "201":
          description: Top-up granted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlossomLedgerEntryResponse" }
        "400":
          description: Validation failure or unknown SKU
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Period closed, or idempotency key reuse
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ---------------------------------------------------------------------------
  # Admin billing
  # ---------------------------------------------------------------------------
  /api/v1/admin/orgs/{organizationId}/blossoms/credit:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      tags: [Admin Billing]
      summary: Credit Blossoms to an organization
      description: Phase 2. Requires `billing:adjust`. Requires `Idempotency-Key`.
      operationId: adminCreditBlossoms
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminBlossomAdjustmentRequest" }
      responses:
        "201":
          description: Ledger entry written
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlossomLedgerEntryResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Period closed, or idempotency key reuse
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/admin/orgs/{organizationId}/blossoms/debit:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      tags: [Admin Billing]
      summary: Debit Blossoms from an organization
      description: Phase 2. Requires `billing:adjust`. Requires `Idempotency-Key`.
      operationId: adminDebitBlossoms
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, reason]
              properties:
                amount: { $ref: "#/components/schemas/BlossomAmount" }
                reason: { $ref: "#/components/schemas/AdjustmentReason" }
                allowNegative: { type: boolean, default: false }
      responses:
        "201":
          description: Ledger entry written
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlossomLedgerEntryResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Insufficient balance, period closed, or idempotency key reuse
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InsufficientBalanceError" }

  /api/v1/admin/orgs/{organizationId}/blossoms/revoke:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      tags: [Admin Billing]
      summary: Revoke a granted top-up
      description: Phase 2. Requires `billing:adjust`. Requires `Idempotency-Key`. Full reversal only.
      operationId: adminRevokeBlossomGrant
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ledgerEntryId, reason]
              properties:
                ledgerEntryId: { type: string, format: uuid }
                reason: { $ref: "#/components/schemas/AdjustmentReason" }
      responses:
        "201":
          description: Revocation entry written
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlossomLedgerEntryResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The grant is not revocable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/admin/orgs/{organizationId}/blossoms/statement:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Admin Billing]
      summary: Read any organization's statement of account
      description: |
        Requires `billing:adjust`. Paged, filtered and ordered server-side, with the same parameters
        as the org-scoped statement.
      operationId: adminGetBlossomStatement
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: kind
          in: query
          description: Entitlement rows, consumption rows, or both.
          schema:
            type: string
            enum: [all, entitlement, consumption]
            default: all
        - name: entryType
          in: query
          description: |
            Restricts entitlement rows to one ledger entry type. A ledger concept, so supplying it
            excludes consumption rows entirely.
          schema:
            $ref: "#/components/schemas/BlossomLedgerEntryType"
        - name: sourceKind
          in: query
          description: Restricts entitlement rows to one source.
          schema:
            $ref: "#/components/schemas/BlossomSourceKind"
        - name: q
          in: query
          description: |
            Substring match over the reason or source reference; for consumption rows, over the
            workflow id, provider or model.
          schema: { type: string }
        - name: minAmount
          in: query
          description: |
            Inclusive lower bound on the signed ledger movement. A ledger concept, so supplying it
            excludes consumption rows entirely.
          schema: { type: number, format: decimal }
        - name: maxAmount
          in: query
          description: Inclusive upper bound on the signed ledger movement.
          schema: { type: number, format: decimal }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Statement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlossomStatementResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/orgs:
    get:
      tags: [Admin Organizations]
      summary: Search organizations across the platform
      description: Phase 3. Requires the team-only `admin:orgs:read` permission (FR-4.8).
      operationId: adminSearchOrganizations
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
          description: Matches name or slug, case-insensitively
        - name: isActive
          in: query
          schema: { type: boolean }
        - name: planTier
          in: query
          schema: { $ref: "#/components/schemas/PlanTier" }
      responses:
        "200":
          description: Organizations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrganizationPage" }
        "400":
          description: Invalid `planTier`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/orgs/{organizationId}/entitlement-overrides:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    patch:
      tags: [Admin Organizations]
      summary: Set per-organization entitlement overrides
      description: |
        Phase 3. Requires `billing:adjust`. Applies one or more overrides together
        (FR-4.9), upserting each on `(organizationId, key, effectiveFrom)`, then
        returns the organization's resolved entitlements. Used for Enterprise
        contracts.
      operationId: adminSetEntitlementOverrides
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetEntitlementOverridesRequest" }
      responses:
        "200":
          description: Resolved entitlements after the overrides were applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntitlementOverridesResponse" }
        "400":
          description: No overrides supplied, or an unknown key / valueType / mismatched value
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Unknown organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ---------------------------------------------------------------------------
  # Subscription and entitlements
  # ---------------------------------------------------------------------------
  /api/v1/orgs/{organizationId}/subscription:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Billing]
      summary: Read the current subscription
      description: |
        Phase 2. Requires `billing:view`. If no subscription row exists yet, returns
        `200` with `status: "None"` and the tier derived from the organization, so a
        valid organization never produces a 404 here.
      operationId: getSubscription
      responses:
        "200":
          description: Subscription
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{organizationId}/subscription/change-plan:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      tags: [Billing]
      summary: Upgrade or downgrade the plan
      description: |
        Phase 2. Requires `billing:manage`. Requires `Idempotency-Key`.

        An upgrade takes effect immediately and writes a `PlanUpgradeProration`
        ledger entry. A downgrade defaults to the next period and is blocked with
        `409 plan-limit-violation` when current usage exceeds any target limit.
      operationId: changePlan
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePlanRequest" }
      responses:
        "200":
          description: Plan changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangePlanResponse" }
        "400":
          description: No-op plan change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Plan limit violation, or idempotency key reuse
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanLimitViolationError" }

  /api/v1/orgs/{organizationId}/subscription/cancel:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      tags: [Billing]
      summary: Cancel at the end of the current period
      description: Phase 2. Requires `billing:manage`.
      operationId: cancelSubscription
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Already cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/orgs/{organizationId}/entitlements:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Billing]
      summary: Read resolved entitlements for the organization
      description: |
        Phase 2. Requires `billing:view`. Frontends should drive ALL plan gating
        from this endpoint rather than hardcoding a plan matrix.
      operationId: getEntitlements
      responses:
        "200":
          description: Entitlements
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntitlementListResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/entitlements/usage:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Billing]
      summary: Read observed usage against each limited entitlement
      description: Phase 2. Requires `billing:view`.
      operationId: getEntitlementUsage
      responses:
        "200":
          description: Entitlement usage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntitlementUsageResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ---------------------------------------------------------------------------
  # API keys
  # ---------------------------------------------------------------------------
  /api/v1/orgs/{organizationId}/api-keys:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [API Keys]
      summary: List API keys
      description: Phase 3. Requires `apikeys:view`. The secret and its hash are never returned.
      operationId: listApiKeys
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ApiKeyStatus" }
      responses:
        "200":
          description: API keys
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyPage" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [API Keys]
      summary: Create an API key
      description: |
        Phase 3. Requires `apikeys:manage` and the `api.access` entitlement
        (Rose and Enterprise only). The plaintext `secret` is returned **exactly
        once** in this response and can never be retrieved again.
      operationId: createApiKey
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApiKeyRequest" }
      responses:
        "201":
          description: Created. Store the secret immediately.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyCreatedResponse" }
        "400":
          description: Validation failure, or a scope that cannot be delegated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Missing permission, or the plan does not include `api.access`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/orgs/{organizationId}/api-keys/{keyId}/revoke:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/ApiKeyId"
    post:
      tags: [API Keys]
      summary: Revoke an API key
      description: Phase 3. Requires `apikeys:manage`. Effective within 60 seconds on all instances.
      operationId: revokeApiKey
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 300 }
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKey" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Already revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/orgs/{organizationId}/api-keys/{keyId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/ApiKeyId"
    delete:
      tags: [API Keys]
      summary: Delete an unused API key
      description: Phase 3. Requires `apikeys:manage`. Only permitted when the key has never been used.
      operationId: deleteApiKey
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The key has been used and cannot be hard-deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ---------------------------------------------------------------------------
  # Pricing — admin
  # ---------------------------------------------------------------------------
  /api/v1/admin/pricing/rules:
    get:
      tags: [Pricing]
      summary: List Blossom conversion rules
      description: "Phase 1. Requires the team-only `PricingAdminRead` policy: the `admin` or `owner` role **and** `pricing:view`. Never available to boutique roles."
      operationId: listPricingRules
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: scopeKind
          in: query
          schema: { $ref: "#/components/schemas/PricingScopeKind" }
        - name: provider
          in: query
          schema: { type: string, maxLength: 64 }
        - name: model
          in: query
          schema: { type: string, maxLength: 128 }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/PricingRuleStatus" }
        - name: activeAt
          in: query
          schema: { type: string, format: date-time }
          description: Return the rule that would price usage at this instant
      responses:
        "200":
          description: Rules
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingRulePage" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Pricing]
      summary: Create a Blossom conversion rule
      description: |
        Phase 1. Requires `pricing:manage`. A past `effectiveFrom` additionally
        requires `pricing:backdate`. The rule is created as `Draft`.
      operationId: createPricingRule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePricingRuleRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingRule" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Missing `pricing:manage`, or a past effective date without `pricing:backdate`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: The effective window overlaps an existing rule for the same scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/admin/pricing/rules/{ruleId}:
    parameters:
      - $ref: "#/components/parameters/PricingRuleId"
    get:
      tags: [Pricing]
      summary: Read one conversion rule
      description: "Phase 1. Requires the team-only `PricingAdminRead` policy: the `admin` or `owner` role **and** `pricing:view`."
      operationId: getPricingRule
      responses:
        "200":
          description: Rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingRule" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Pricing]
      summary: Edit a draft conversion rule
      description: |
        Phase 1. Requires `pricing:manage`. Only permitted while `status = Draft`.
        A past `effectiveFrom` additionally requires `pricing:backdate` (403 otherwise).
      operationId: updatePricingRule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePricingRuleRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingRule" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The rule is not a `Draft` (`code: rule-immutable`). Only a `Draft`
            rule may be edited; supersede it with a new rule instead.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/admin/pricing/rules/{ruleId}/activate:
    parameters:
      - $ref: "#/components/parameters/PricingRuleId"
    post:
      tags: [Pricing]
      summary: Activate a conversion rule
      description: |
        Phase 1. Requires `pricing:manage`. Atomically trims the predecessor's
        `effectiveTo` to this rule's `effectiveFrom` and marks the predecessor
        `Superseded`. A past `effectiveFrom` in the body additionally requires
        `pricing:backdate` (403 otherwise).
      operationId: activatePricingRule
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                effectiveFrom: { type: string, format: date-time, nullable: true }
      responses:
        "200":
          description: Activated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingRule" }
        "400":
          description: The rule is not a Draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The effective window overlaps an existing rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/admin/pricing/rules/{ruleId}/cancel:
    parameters:
      - $ref: "#/components/parameters/PricingRuleId"
    post:
      tags: [Pricing]
      summary: Cancel a draft conversion rule
      description: Phase 1. Requires `pricing:manage`.
      operationId: cancelPricingRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { $ref: "#/components/schemas/AdjustmentReason" }
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingRule" }
        "400":
          description: |
            `code: rule-priced` when the rule is already `Active` and has priced
            usage (activate a superseding rule instead); `code: validation` for a
            bad reason.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/pricing/rules/{ruleId}/recompute:
    parameters:
      - $ref: "#/components/parameters/PricingRuleId"
    post:
      tags: [Pricing]
      summary: Re-price already-recorded usage affected by a backdated rule
      description: |
        Requires `pricing:backdate`. Calculates pricing differences for affected AI usage
        records, writes compensating `BlossomLedgerEntry` (CorrectionRecompute) entries,
        updates the organization `UsageAccount`, and emits `pricing.rule.recomputed` events.
      operationId: recomputePricingRule
      responses:
        "200":
          description: Recompute result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingRecomputeResult" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Price book
  # ---------------------------------------------------------------------------
  /api/v1/admin/pricing/price-book:
    get:
      tags: [Pricing]
      summary: List price-book entries
      description: |
        Phase 1. Requires the team-only `PricingAdminRead` policy: the `admin` or `owner` role **and** `pricing:view`.

        Returns a **bare array of entries — there is no `page`/`pageSize` and no
        `{ items, total }` envelope** (finding M-8, a deliberate deviation from the
        §A.4 pagination convention).
      operationId: listPricingPriceEntries
      parameters:
        - name: skuKind
          in: query
          schema: { $ref: "#/components/schemas/PricingSkuKind" }
        - name: planTier
          in: query
          schema: { $ref: "#/components/schemas/PlanTier" }
        - name: organizationId
          in: query
          schema: { type: string, format: uuid }
          description: |
            Filter to this organization's override; omit to list global entries only.
      responses:
        "200":
          description: Price-book entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PricingPriceEntry" }
        "400":
          description: Invalid `skuKind` or `planTier` filter
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Pricing]
      summary: Create a price-book entry
      description: Phase 1. Requires `pricing:manage`. Created as `Draft`.
      operationId: createPricingPriceEntry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePriceEntryRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingPriceEntry" }
        "400":
          description: Field validation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/pricing/price-book/{entryId}:
    parameters:
      - $ref: "#/components/parameters/PricingEntryId"
    get:
      tags: [Pricing]
      summary: Read one price-book entry
      description: |
        Phase 1. Requires the team-only `PricingAdminRead` policy: the `admin` or `owner` role **and** `pricing:view`.
        A global entry (no `organizationId`) is always readable; a per-organization
        override is readable only when the caller passes that same `organizationId`.
      operationId: getPricingPriceEntry
      parameters:
        - name: organizationId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Price-book entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingPriceEntry" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Pricing]
      summary: Edit a price-book entry
      description: Phase 1. Requires `pricing:manage`.
      operationId: updatePricingPriceEntry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePriceEntryRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingPriceEntry" }
        "400":
          description: Field validation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Pricing]
      summary: Retire a price-book entry
      description: |
        Phase 1. Requires `pricing:manage`. Sets the entry's status to `Cancelled`;
        returns `204 No Content`.
      operationId: deletePricingPriceEntry
      responses:
        "204":
          description: Retired
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # API consumption statistics
  # ---------------------------------------------------------------------------
  /api/v1/orgs/{organizationId}/statistics/api/requests:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [API Statistics]
      summary: Read API request volume
      description: Phase 5. Requires `stats:view`.
      operationId: getApiRequestStatistics
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: groupBy
          in: query
          schema:
            type: string
            enum: [hour, day, routeTemplate, statusClass, apiKeyId, userId]
            default: hour
        - name: routeTemplate
          in: query
          schema: { type: string, maxLength: 200 }
        - name: statusClass
          in: query
          schema: { type: string, enum: ["1xx", "2xx", "3xx", "4xx", "5xx"] }
        - name: apiKeyId
          in: query
          schema: { type: string, format: uuid }
        - name: userId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Request statistics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiRequestStatisticsResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/statistics/api/errors:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [API Statistics]
      summary: Read API error and throttle rates
      description: |
        Phase 5. Requires `stats:view`. Throttle rejections (429) are reported
        separately from other 4xx so the UI can distinguish "you are being
        throttled" from "you sent a bad request".
      operationId: getApiErrorStatistics
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: groupBy
          in: query
          schema:
            type: string
            enum: [hour, day, routeTemplate, statusCode]
            default: hour
        - name: routeTemplate
          in: query
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          description: Error statistics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorStatisticsResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/statistics/api/latency:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [API Statistics]
      summary: Read API latency percentiles
      description: |
        Phase 5. Requires `stats:view`. Percentiles are interpolated from
        histogram buckets, so `precision` is `bucket-interpolated` — surface that
        in the UI rather than presenting the numbers as exact.
