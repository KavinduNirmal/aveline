  # ---------------------------------------------------------------------------
  # Conversations
  # ---------------------------------------------------------------------------
  /api/v1/orgs/{organizationId}/conversations:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Conversations]
      summary: List conversations
      operationId: listConversations
      description: >-
        The inbox, newest-first with an id tiebreak so paging is total. Page one holds
        the newest threads. Each row carries the client's name, a block-aware preview of
        the newest message, the block it came from (the row's category), who spoke last
        and the actionable `markers` set. The same tile is pushed over the SignalR
        `conversations` hub as **`ReceiveConversationChanged`** whenever a thread changes
        or appears (to `org:{organizationId}` for shared threads and to
        `user:{ownerUserId}` for a per-user general Salon), so an open inbox updates
        without a re-list.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationPage" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Conversations]
      summary: Create a conversation
      operationId: createConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customerId: { type: string, format: uuid, nullable: true }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationDto" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/conversations/{conversationId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/ConversationId"
    get:
      tags: [Conversations]
      summary: Read a conversation
      operationId: getConversation
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationDto" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{organizationId}/conversations/{conversationId}/messages:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/ConversationId"
    get:
      tags: [Conversations]
      summary: List messages
      operationId: listMessages
      description: |
        Oldest first, with `page` one holding the *oldest* messages; a client that wants the
        newest words asks for the last page. Ordering is total: `CreatedAt` then `Id`, so a tied
        timestamp cannot duplicate or skip a row across a page seam. The response echoes the
        clamped `pageSize` (1..200), which is the value a client must use to work out the last
        page. A conversation the caller cannot see is a `404`, never a `500`.

        `around` opens the page that **holds** that message rather than `page`, which is how a
        notification deep-link lands on the words it was about. The served page is echoed, so
        `hasEarlier` (`page > 1`) and `hasMore` (`page * pageSize < total`) follow from the
        response alone. An anchor that is not in the conversation serves page 1.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: around
          in: query
          schema: { type: string, format: uuid, nullable: true }
          description: Deep-link anchor; serves the page that holds this message id
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessagePage" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Conversations]
      summary: Send a staff message
      operationId: sendMessage
      description: |
        Records an internal staff note and triggers the agent. The note is stored `Published`,
        which means it is visible in the Salon and was not delivered to the customer's channel.

        `clientMessageId` makes the send idempotent. It is a client-generated UUIDv4, stable for
        one composed message across the send and every retry. A replay with the same key and the
        same text returns the stored message with `200` and does **not** trigger the agent a
        second time. Reusing a key for different text is a `409` with
        `code: message-idempotency-conflict`, because the key promises exactly one message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1 }
                clientMessageId:
                  type: string
                  format: uuid
                  nullable: true
                  description: Client-generated idempotency key, stable across retries
                attachmentIds:
                  type: array
                  maxItems: 5
                  description: |
                    Ids of attachments uploaded for this conversation and not yet bound. All of
                    them must belong to this conversation and be unbound; a bad id fails the
                    whole send with `400` rather than half-binding, so the uploads stay
                    sweepable.
                  items: { type: string, format: uuid }
                imageUrl:
                  type: string
                  nullable: true
                  description: |
                    Optional absolute URL of an image the server should fetch and attach
                    (`SendMessageRequest.ImageUrl`). The path is explicit rather than scanned out
                    of `text`: a regex would fire on a product link and miss `…/image?id=123`, and
                    it would turn a typo into a server-side request.

                    The fetch is **best-effort**: a refused URL leaves the text intact, adds no
                    attachment, logs at `Warning` and the message is still stored, with `200`. The
                    one exception is the kill switch: when `Media:ImageUrlUploadEnabled=false`
                    (the shipped default) the send is answered with `400` and
                    `code: "feature-disabled"`, because that is a capability answer the client can
                    act on rather than a bad URL. The operator's controls are the kill switch, the
                    `Media:ImageUrlAllowlist` host allow-list, and the existing route rate limiting.
      responses:
        "200":
          description: Message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageDto" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/orgs/{organizationId}/conversations/{conversationId}/deliver:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/ConversationId"
    post:
      tags: [Conversations]
      summary: Deliver a block to the customer's own channel
      operationId: deliverConversationBlockToCustomer
      description: |
        Sends the words to the thread's **customer**, on a channel the boutique has connected, and
        then records the outbound row with `status: Sent`.

        This route is deliberately not `POST …/messages`. A message there is a staff **note**: it
        is written into the Salon, reaches no customer, and on a client-bound thread it triggers
        the agent. Delivery is the opposite promise, so the two are separate calls and a caller
        cannot reach one by asking for the other.

        **Channel resolution.** The thread's `externalRef` — the handle an inbound message arrived
        from — is preferred over the client's `phoneNumber`, so a number edited on the customer
        record cannot silently redirect a reply to a different handset. WhatsApp Cloud API is the
        only channel with a provider today; Instagram has credentials but no provider and no
        webhook, so an Instagram-only tenant is answered `channel_unsupported` rather than handed
        a send that never happened.

        **Nothing is recorded on a refusal.** A row saying `Sent` is a claim that a customer was
        messaged, so it is only written once the provider has accepted. A provider success whose
        record then fails to write is logged and still reported as delivered, because the customer
        does have the message.

        **Idempotency.** `clientMessageId` is a client-generated UUIDv4, stable for one delivery
        across retries. A replay whose stored row already went out is answered from that row with
        `200` and does not send the words to the customer a second time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 1
                  description: |
                    The words to send, already rendered by the client from the block — a draft's
                    sentence, a piece's line, a look's name and note.
                clientMessageId:
                  type: string
                  format: uuid
                  nullable: true
                  description: Client-generated idempotency key, stable across retries
      responses:
        "200":
          description: Delivered, with the row the thread records it as
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryResultDto" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The conversation does not exist in this organization, or is not visible
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryResultDto" }
        "409":
          description: |
            This thread or this tenant cannot deliver at all — `no_customer`, `no_channel_handle`,
            `channel_not_connected` or `channel_unsupported`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryResultDto" }
        "502":
          description: The provider was reached and refused the send (`provider_refused`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryResultDto" }

  /api/v1/orgs/{organizationId}/conversations/{conversationId}/messages/{messageId}/regenerate:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/ConversationId"
      - name: messageId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Conversations]
      summary: Regenerate the agent's answer to a turn
      operationId: regenerateConversationMessage
      description: |
        Re-runs the **question**, not the answer. The staff turn the message replied to is
        resolved (falling back to the message's own first block text when the staff turn has
        scrolled out of the look-back window) and the agent is triggered again with the thread's
        customer context.

        Answered `202`: the fresh content does not exist yet and arrives the way every other agent
        reply does, as `message.created` events applied by the subscriber and broadcast over the
        Salon hub. There is therefore no response body.

        It writes no message and does not touch the superseded block. Stored message rows are
        immutable history that a later read returns, so a client that wants a view-level
        replacement must do that itself; see `docs/frontend/tenant-dashboard.md`.
      responses:
        "202":
          description: The run was accepted; the reply arrives on the hub
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The message is not in this conversation, or the thread is not visible

  /api/v1/orgs/{organizationId}/conversations/{conversationId}/select-customer:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/ConversationId"
    post:
      tags: [Conversations]
      summary: Bind a customer to a conversation
      operationId: selectConversationCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId]
              properties:
                customerId: { type: string, format: uuid }
                query: { type: string, nullable: true }
      responses:
        "200":
          description: Bound
        "400":
          description: A customerId is required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{organizationId}/conversations/{conversationId}/messages/{messageId}/sign-off:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/ConversationId"
      - name: messageId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Conversations]
      summary: Decide a sign-off request
      description: |
        The `contentHash` must match the hash of the message as the approver saw it.
        A mismatch is rejected so an approval cannot be applied to edited content.

        **Authorization.** This is a human-in-the-loop release gate for an above-limit
        commitment, so the route requires the `BoutiqueConversationApproval` policy —
        active membership **plus** `approvals:approve` — on top of the group's
        `conversations:view`. An ordinary staff member therefore receives `403`.
      operationId: decideSignOff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved, contentHash]
              properties:
                approved: { type: boolean }
                contentHash: { type: string, minLength: 1 }
      responses:
        "200":
          description: Decided
        "400":
          description: Content hash missing or mismatched
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{organizationId}/conversations/{conversationId}/messages/{messageId}/sign-off/revoke:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/ConversationId"
      - name: messageId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Conversations]
      summary: Revoke an approved SignOff
      description: |
        Takes an approval back. Appends a `revoked` row to the immutable decision log — the
        original approval is **not** mutated — and sets both the message and the conversation
        back to `AwaitingSignOff`, so the SignOff is decidable again and the inbox's derived
        `approval` marker lights again. No LangGraph action is taken: ADR-018 leaves the resume
        unwired, so there is nothing to undo.

        Requires the `BoutiqueConversationApproval` policy (`approvals:approve`), like the
        decide route. A SignOff whose newest decision is not an approval is a `400`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, nullable: true }
      responses:
        "200":
          description: The revoked message, back in `AwaitingSignOff`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageDto" }
        "400":
          description: Not a SignOff, or its newest decision is not an approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{organizationId}/conversations/{conversationId}/attachments:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/ConversationId"
    post:
      tags: [Conversations]
      summary: Upload a thread attachment
      operationId: uploadConversationAttachment
      description: |
        Stores one image or PDF against a conversation, **unbound**. The send then names the id
        in `attachmentIds`, and the same idempotent insert that creates the message binds it; an
        upload that is never sent is swept after the TTL.

        Accepts `multipart/form-data` with a `file` field, or JSON with `imageData` (raw base64
        or a `data:` URL). The allow-list is images plus `application/pdf`; audio and video are
        refused. The cap is 5 MB per file and 5 files per message. A file over the cap or of a
        disallowed type is refused **before anything is written**.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
          application/json:
            schema:
              type: object
              required: [imageData]
              properties:
                imageData: { type: string }
                fileName: { type: string, nullable: true }
                width: { type: integer, nullable: true }
                height: { type: integer, nullable: true }
      responses:
        "200":
          description: The stored attachment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttachmentDto" }
        "400":
          description: No data, a disallowed type, or over the 5 MB cap
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{organizationId}/conversations/{conversationId}/attachments/{attachmentId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/ConversationId"
      - name: attachmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Conversations]
      summary: Serve an attachment's bytes
      operationId: getConversationAttachment
      description: |
        **Authenticated**, unlike the catalog's anonymous image GET, which is deliberately not
        copied for a customer's file: the route is under `conversations:view` and the conversation
        must be visible to the caller. The response carries `X-Content-Type-Options: nosniff` and
        the stored type is re-checked against the allow-list, so a spoofed upload can never be
        rendered as HTML or script from the API origin.
      responses:
        "200":
          description: The bytes
          content:
            image/*:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{organizationId}/conversations/{conversationId}/read:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/ConversationId"
    patch:
      tags: [Conversations]
      summary: Mark a conversation read
      operationId: markConversationRead
      description: |
        Advances the **caller's own** read marker for one conversation. The marker is
        monotonic: it is ordered by `(createdAt, id)` and a write that would move it backwards
        is accepted (`204`) but changes nothing, so a second device re-opening an older
        position cannot un-read what the first device read.

        An absent row means **nothing has been read** — there is no coalesce to an epoch. One
        row exists per `(organization, user, conversation)`, so a colleague on the same
        organization-shared thread has an independent marker. The inbox draws no badge today;
        when it wants one it reads this table's aggregate rather than growing a second model.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lastReadMessageId]
              properties:
                lastReadMessageId:
                  type: string
                  format: uuid
                  description: The newest message the caller has seen, in this conversation
      responses:
        "204":
          description: The marker advanced, or was already at least this far along
        "400":
          description: The message does not belong to this conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Catalog & Visual Intelligence
  #
  # The tenant-facing catalog surface. Every route is scoped under
  # `/api/v1/orgs/{organizationId}/catalog` and guarded by the boutique access policy (a
  # valid Clerk bearer token, an active organisation membership, and `catalog:view`).
  #
  # Media note: `images/upload` goes through the configured provider seam; `images/{imageId}`
  # answers `302` to the absolute CDN URL for a Cloudinary-backed row and streams bytes for a
  # database-backed row. `analyze-image` and the internal vision route share one `404`
  # translation: a named reference that does not resolve for this organisation is `404`, never
  # a resolved image and never a token.
  # ---------------------------------------------------------------------------
  /api/v1/orgs/{organizationId}/catalog/items:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Catalog & Visual Intelligence]
      summary: Search inventory items for the boutique catalog
      operationId: catalogSearchInventory
      description: |
        Filtered, paginated item search. `inStockOnly` defaults `false` here (the internal
        vision route's default is `true`); `page` defaults 1 and `pageSize` 50.
      parameters:
        - name: category
          in: query
          schema: { type: string, nullable: true }
        - name: color
          in: query
          schema: { type: string, nullable: true }
        - name: size
          in: query
          schema: { type: string, nullable: true }
        - name: minPrice
          in: query
          schema: { type: number, nullable: true }
        - name: maxPrice
          in: query
          schema: { type: number, nullable: true }
        - name: inStockOnly
          in: query
          schema: { type: boolean, nullable: true, default: false }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Matching items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogItem" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Catalog & Visual Intelligence]
      summary: Create a new item in the boutique inventory catalog
      operationId: catalogCreateItem
      description: |
        `imageUrl` may be an absolute URL, a raw base64 value, or a `data:` URL. A `data:` image
        is stored through the configured provider **and** capped at `Media:CatalogMaxFileBytes`
        (2 MB default); an over-cap image is refused rather than reported as a successful write.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogItemCreateRequest" }
      responses:
        "201":
          description: The created item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogItem" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/catalog/items/search:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      tags: [Catalog & Visual Intelligence]
      summary: Search inventory items via POST request payload
      operationId: catalogSearchInventoryPost
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogItemSearchRequest" }
      responses:
        "200":
          description: Matching items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogItem" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/catalog/items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/CatalogItemId"
    get:
      tags: [Catalog & Visual Intelligence]
      summary: Get a specific catalog item by ID
      operationId: catalogGetItem
      responses:
        "200":
          description: The item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogItem" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Catalog & Visual Intelligence]
      summary: Update details of an existing catalog item
      operationId: catalogUpdateItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogItemUpdateRequest" }
      responses:
        "200":
          description: The updated item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogItem" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Catalog & Visual Intelligence]
      summary: Delete (soft-delete) an inventory item from the boutique catalog
      operationId: catalogDeleteItem
      description: |
        Soft-deletes the `InventoryItems` row only. **No image row and no stored image byte is
        touched**: the catalog image delete path is deliberately deferred (S8 / Wave 5) and is
        not shipped. A Cloudinary asset therefore outlives its item until that slice lands.
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{organizationId}/catalog/items/{itemId}/sales:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/CatalogItemId"
    post:
      tags: [Catalog & Visual Intelligence]
      summary: Sell a catalog piece over the counter
      operationId: catalogRecordSale
      description: |
        Decrements the piece's stock by `quantity`, derives its stock status (zero becomes
        `reserved`, two or fewer `low_stock`, otherwise `available`) and appends the money to the
        boutique's takings journal as one `Sale` / `Verified` entry. The two writes are one call,
        so the catalog and the register cannot disagree about whether a sale happened.

        `unitPrice` defaults to the piece's catalog price. A sale must have a positive total; a
        zero-amount sale is refused (`400`) rather than allowed to fail the journal's
        positive-amount constraint. Asking for more pieces than are on hand is `409`
        `insufficient-stock`, and an archived piece cannot be sold (`400`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogSaleRequest" }
      responses:
        "200":
          description: The sale receipt, naming the journal row it wrote
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogSaleReceipt" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            `insufficient-stock` — the request asked for more pieces than the catalog row holds.
            Nothing was sold and the stock is unchanged.

  /api/v1/orgs/{organizationId}/catalog/items/{itemId}/status:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/CatalogItemId"
    patch:
      tags: [Catalog & Visual Intelligence]
      summary: Update status (available/reserved/archived) of a catalog item
      operationId: catalogUpdateItemStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [available, reserved, archived] }
      responses:
        "200":
          description: The updated item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogItem" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{organizationId}/catalog/low-stock:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Catalog & Visual Intelligence]
      summary: Get inventory items with low stock
      operationId: catalogGetLowStock
      parameters:
        - name: threshold
          in: query
          schema: { type: integer, nullable: true }
      responses:
        "200":
          description: Low-stock items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogItem" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/catalog/items/{itemId}/qr:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/CatalogItemId"
    get:
      tags: [Catalog & Visual Intelligence]
      summary: Generate and retrieve a QR code for a specific catalog inventory item
      operationId: catalogGetItemQr
      responses:
        "200":
          description: The generated QR code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QrCodeResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orgs/{organizationId}/catalog/qr/generate:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      tags: [Catalog & Visual Intelligence]
      summary: Generate a custom QR code (PNG, SVG, or JSON base64 data URL) for any payload
      operationId: catalogGenerateQr
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload]
              properties:
                payload: { type: string }
                format: { type: string, enum: [png, svg, json], default: png }
                size: { type: integer, default: 300 }
                eccLevel: { type: string, enum: [L, M, Q, H], default: M }
                quietZone: { type: integer, default: 2 }
      responses:
        "200":
          description: The generated QR code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QrCodeResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/catalog/items/scan-qr:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      tags: [Catalog & Visual Intelligence]
      summary: Scan and resolve a QR barcode or uploaded camera image to an inventory catalog piece
      operationId: catalogScanItemQr
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, nullable: true }
                payload: { type: string, nullable: true }
                imageData: { type: string, nullable: true }
      responses:
        "200":
          description: The resolution result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QrScanResult" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/catalog/qr/scan:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      tags: [Catalog & Visual Intelligence]
      summary: Alias endpoint for scanning and resolving QR codes
      operationId: catalogScanQrAlias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, nullable: true }
                payload: { type: string, nullable: true }
                imageData: { type: string, nullable: true }
      responses:
        "200":
          description: The resolution result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QrScanResult" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orgs/{organizationId}/catalog/analyze-image:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      tags: [Catalog & Visual Intelligence]
      summary: Extract visual fashion attributes and tags using Elle Vision AI
      operationId: catalogAnalyzeImage
      description: |
        Runs one image analysis for the organisation. The request carries **either** a named
        reference (the arm the agent should use) **or** a caller-supplied external URL (the
        compatibility arm).

        `imageUrl` remains a **non-nullable** string defaulting to empty: making it nullable
        would be a nullability change on a live DTO and would alter binder behaviour, so the
        reference arm treats **empty as absent** (strategy §4 C14). `imageRefKind` may name
        `attachment` or `inventoryImage` (the two tokenisable row kinds); `externalUrl` and any
        unknown kind fall through to the `imageUrl` arm, which stays deliberately permissive.

        A named reference that does not resolve for this organisation — another tenant's, an
        unknown row, or a deleted row — is **`404`, never a resolved image and never a token**.
        This is the same translation the internal vision route applies. Only `KeyNotFoundException`
        is caught, so every other fault is a `500`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnalyzeImageRequest" }
      responses:
        "200":
          description: The analysis result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageAnalysisResult" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: |
            The named reference does not resolve for this organisation. (The `imageUrl` arm
            does not produce this: it is forwarded to the provider.)

  /api/v1/orgs/{organizationId}/catalog/items/{itemId}/matches:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/CatalogItemId"
    get:
      tags: [Catalog & Visual Intelligence]
      summary: Get customers matching a specific catalog item
      operationId: catalogGetCustomerMatches
      parameters:
        - name: minScore
          in: query
          schema: { type: number, default: 0.7 }
      responses:
        "200":
          description: Matching customers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogCustomerMatch" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
