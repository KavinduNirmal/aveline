    # --- invitations ---------------------------------------------------------
    CreateInvitationResponse:
      type: object
      description: |
        T6 added the three summary-email fields so a caller can render the notice's outcome without
        inferring it from the absence of an error.
      properties:
        invitationId: { type: string, format: uuid }
        code: { type: string }
        link: { type: string }
        mobileLink: { type: string }
        boutiqueRole: { type: string }
        recipientEmail: { type: string, nullable: true }
        expiresAt: { type: string, format: date-time }
        summaryEmailRequested: { type: boolean }
        summaryEmailStatus:
          type: string
          enum: [NotRequested, Dispatched, NotSent]
          description: |
            `Dispatched` means the notice was handed to the configured sender, which records a
            dispatch rather than a delivery.
        summaryEmailNote: { type: string, nullable: true }

    BulkCreateInvitationResponse:
      type: object
      description: |
        E-10. The minted codes plus what the clamp and the notice actually did. `requestedCount`
        and `createdCount` are reported side by side so a server-side clamp is visible rather than
        silent.
      properties:
        invitations:
          type: array
          items: { $ref: "#/components/schemas/CreateInvitationResponse" }
        requestedCount: { type: integer }
        createdCount: { type: integer }
        effectiveValidityHours: { type: integer, description: The clamped value. }
        summaryEmailRequested: { type: boolean }
        summaryEmailStatus:
          type: string
          enum: [NotRequested, Dispatched, NotSent]
        summaryEmailNote: { type: string, nullable: true }
    PendingInvitationDto:
      type: object
      properties:
        invitationId: { type: string, format: uuid }
        boutiqueRole: { type: string }
        recipientEmail: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    AcceptInvitationResponse:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        boutiqueRole: { type: string }
        clerkOrgId: { type: string, nullable: true }
        accountState: { type: string, nullable: true }

    # --- commerce: approvals -------------------------------------------------
    ApprovalDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject, revise]
          description: |
            The verb decides the permission it needs: `reject` and `revise` require
            `orders:manage` as well as `approvals:approve` (Q14).
        reason: { type: string, maxLength: 1000, nullable: true }
        revisedDiscount:
          type: number
          format: decimal
          nullable: true
          description: Only meaningful for `revise`.

    ApprovalQueueResponseDto:
      type: object
      description: |
        One entry in the human-in-the-loop approval queue. `decidedBy` is the resolved Aveline user
        id; it was always `null` before T1 fixed the actor resolution (F-5).
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        approvalType: { type: string }
        status: { type: string }
        thresholdExceeded: { type: boolean }
        reason: { type: string }
        decisionComment: { type: string, nullable: true }
        decidedBy: { type: string, format: uuid, nullable: true }
        threadId: { type: string, nullable: true }
        conversationId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time, nullable: true }
        order:
          type: object
          nullable: true
          description: The order under review; `null` when it is not readable, never a fabricated stub.

    # --- onboarding ----------------------------------------------------------
    SaveBoutiqueDetailsRequest:
      type: object
      required: [name, address, phoneNumber]
      properties:
        name: { type: string, maxLength: 200 }
        address: { type: string, maxLength: 500 }
        phoneNumber: { type: string, maxLength: 50 }
        description: { type: string, maxLength: 1000, nullable: true }
        logoUrl: { type: string, maxLength: 1000, nullable: true }
        slug: { type: string, maxLength: 100, nullable: true }
    SaveAiCustomizationRequest:
      type: object
      description: Fields are tier-gated; a disallowed field returns 400.
      properties:
        brandVoice: { type: string, maxLength: 500, nullable: true }
        businessRules: { type: string, maxLength: 1000, nullable: true }
        preferredColorsFabrics: { type: string, maxLength: 1000, nullable: true }
        customerPreferences: { type: string, maxLength: 1000, nullable: true }
    OnboardingOrganizationDto:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        address: { type: string, nullable: true }
        phoneNumber: { type: string, nullable: true }
        description: { type: string, nullable: true }
        logoUrl: { type: string, nullable: true }
        planTier: { $ref: "#/components/schemas/PlanTier" }
        brandVoice: { type: string, nullable: true }
        businessRules: { type: string, nullable: true }
        preferredColorsFabrics: { type: string, nullable: true }
