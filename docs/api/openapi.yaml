  /api/v1/admin/orgs/{organizationId}/blossoms/revoke:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      tags: [Admin Billing]
      summary: Revoke a granted top-up
      description: Phase 2. Requires `billing:adjust`. Requires `Idempotency-Key`. Full reversal only.
      operationId: adminRevokeBlossomGrant
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ledgerEntryId, reason]
              properties:
                ledgerEntryId: { type: string, format: uuid }
                reason: { $ref: "#/components/schemas/AdjustmentReason" }
      responses:
        "201":
          description: Revocation entry written
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlossomLedgerEntryResponse" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The grant is not revocable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/admin/orgs/{organizationId}/blossoms/statement:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Admin Billing]
      summary: Read any organization's statement of account
      description: |
        Requires `billing:adjust`. Paged, filtered and ordered server-side, with the same parameters
        as the org-scoped statement.
      operationId: adminGetBlossomStatement
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: kind
          in: query
          description: Entitlement rows, consumption rows, or both.
          schema:
            type: string
            enum: [all, entitlement, consumption]
            default: all
        - name: entryType
          in: query
          description: |
            Restricts entitlement rows to one ledger entry type. A ledger concept, so supplying it
            excludes consumption rows entirely.
          schema:
            $ref: "#/components/schemas/BlossomLedgerEntryType"
        - name: sourceKind
          in: query
          description: Restricts entitlement rows to one source.
          schema:
            $ref: "#/components/schemas/BlossomSourceKind"
        - name: q
          in: query
          description: |
            Substring match over the reason or source reference; for consumption rows, over the
            workflow id, provider or model.
          schema: { type: string }
        - name: minAmount
          in: query
          description: |
            Inclusive lower bound on the signed ledger movement. A ledger concept, so supplying it
            excludes consumption rows entirely.
          schema: { type: number, format: decimal }
        - name: maxAmount
          in: query
          description: Inclusive upper bound on the signed ledger movement.
          schema: { type: number, format: decimal }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Statement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlossomStatementResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/orgs:
    get:
      tags: [Admin Organizations]
      summary: Search organizations across the platform
      description: Phase 3. Requires the team-only `admin:orgs:read` permission (FR-4.8).
      operationId: adminSearchOrganizations
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
          description: Matches name or slug, case-insensitively
        - name: isActive
          in: query
          schema: { type: boolean }
        - name: planTier
          in: query
          schema: { $ref: "#/components/schemas/PlanTier" }
      responses:
        "200":
          description: Organizations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrganizationPage" }
        "400":
